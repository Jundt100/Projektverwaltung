  y = pdfSpalten(doc, y, [['kunde', 'Kunde', m.kunde], ['objekt', 'Objekt', m.objekt], ['werkzeug', 'Monteur / Ausführung', m.monteur]]);
  // Folgeseiten: schmaler Kopf mit Titel und Projekt-Nr.
  const neueSeite = () => {
    doc.addPage();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...AA_TXT);
    doc.text(`${m.titel || 'Mängelliste'} · Projekt-Nr ${p.nummer}`, M, 14);
    pdfVerlauf(doc, M, 16.5, B, 0.6);
    return 21;
  };
  if ((m.hinweis || '').trim()) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT); doc.text('Hinweise für den Monteur', M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
    const hl = pdfAbsatz(doc, m.hinweis, B);
    doc.text(hl, M, y + 5.5); y += 5.5 + hl.length * 4.4 + 6;
  }
  if (!L.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(90); doc.text('Keine offenen Mängel.', M, y + 2); y += 10; }
  // Seitenaufteilung: Seite 1 bis 4 Mängel (2 Reihen), jede weitere Seite bis 6 (3 Reihen); die Bestätigung des Monteurs
  // kommt auf die letzte Seite. Die Bildhöhe richtet sich nach dem Platz, damit immer alles auf die Seite passt.
  const reihen = [];
  for (let i = 0; i < L.length; i += 2) reihen.push(L.slice(i, i + 2));
  const seiten = reihen.length ? [reihen.slice(0, 2)] : [[]];
  for (let i = 2; i < reihen.length; i += 3) seiten.push(reihen.slice(i, i + 3));
  let letzte = null; // letzte Reihe (für die Bestätigung im freien Feld daneben)
  seiten.forEach((R, si) => {
    if (si) y = neueSeite();
    const halbLeer = R.length && R[R.length - 1].length === 1, unterschriftUnten = si === seiten.length - 1 && !halbLeer;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    const texte = R.map(paar => paar.map(x => pdfAbsatz(doc, x.text, cw - 2 * pad)));
    const festH = texte.map(t => 22 + Math.max(1, ...t.map(z => z.length)) * 4.2);
    const frei = H - 12 - y - (unterschriftUnten ? 24 : 0) - R.length * gap - festH.reduce((a, b) => a + b, 0);
    const bildH = R.length ? Math.max(26, Math.min(58, frei / R.length)) : 0;
    R.forEach((paar, ri) => {
      const h = festH[ri] + bildH;
      paar.forEach((x, j) => karte(x, M + j * (cw + gap), h, bildH, texte[ri][j]));
      letzte = { y, h, n: paar.length };
      y += h + gap;
    });
  });
  // eine Karte: Kopf, Bild (eingepasst), Beschreibung, unten «erledigt» und Visum des Monteurs
  function karte(x, cx, h, bildH, zeilen) {

    doc.setFillColor(255); doc.setDrawColor(222); doc.setLineWidth(0.25); doc.roundedRect(cx, y, cw, h, 3, 3, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...AA_TXT);
    const kopf = `Mangel ${x.nr}`;
    doc.text(kopf, cx + pad, y + 6.2);
    if (x.bereich.trim()) {
      const bx = cx + pad + doc.getTextWidth(kopf) + 2;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(90);
      doc.text(doc.splitTextToSize('· ' + x.bereich.trim(), cx + cw - pad - bx)[0], bx, y + 6.2);
    }
    const ix = cx + pad, iy = y + 9, iw = cw - 2 * pad;
    doc.setFillColor(244, 244, 241); doc.roundedRect(ix, iy, iw, bildH, 2, 2, 'F');
    const data = bilder[x.bild];
    if (data) {
      try {
        const pr = doc.getImageProperties(data), k = Math.min(iw / pr.width, bildH / pr.height), w = pr.width * k, hh = pr.height * k;
        doc.addImage(data, 'JPEG', ix + (iw - w) / 2, iy + (bildH - hh) / 2, w, hh);
      } catch (e) { /* Bild defekt: Fläche bleibt leer */ }
    } else { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(160); doc.text('kein Bild', ix + iw / 2, iy + bildH / 2 + 1, { align: 'center' }); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40);
    doc.text(zeilen, cx + pad, iy + bildH + 5, { lineHeightFactor: 1.25 }); // 4.2 mm pro Zeile, wie bei der Höhenberechnung
    const by = y + h - 4;
    pdfKaestchen(doc, cx + pad, by - 2.7, x.erledigt);
    doc.setFontSize(9); doc.setTextColor(60); doc.text('erledigt', cx + pad + 5.5, by);
    const vx = cx + cw / 2 - 4;
    doc.text('Visum:', vx, by);
    doc.setDrawColor(150); doc.setLineWidth(0.25); doc.line(vx + 11, by + 0.6, cx + cw - pad, by + 0.6);
  }
  // Bestätigung des Monteurs, auf Papier: im freien Feld neben dem letzten Mangel, sonst darunter (Platz ist reserviert)
  const titelB = 'Mängel behoben – Bestätigung Monteur', felder = ['Datum:', 'Name Monteur:', 'Unterschrift Monteur:'];
  doc.setDrawColor(150); doc.setLineWidth(0.25);
  if (letzte && letzte.n === 1) {
    const x = M + cw + gap + pad;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...AA_TXT); doc.text(titelB, x, letzte.y + 6.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(60);
    const abstand = Math.min(14, (letzte.h - 16) / 3);
    felder.forEach((l, i) => { const ly = letzte.y + 14 + (i + 0.6) * abstand; doc.text(l, x, ly); doc.line(x, ly + 1.5, x + cw - 2 * pad, ly + 1.5); });
  } else {
    y += 2;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...AA_TXT); doc.text(titelB, M, y);
    const lw = (B - 2 * 8) / 3;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(60);
    felder.forEach((l, i) => { const x = M + i * (lw + 8); doc.text(l, x, y + 14); doc.line(x, y + 15.5, x + lw, y + 15.5); });
  }
  const n = doc.getNumberOfPages();
  if (n > 1) for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8.5); doc.setTextColor(130); doc.text(`Seite ${i} / ${n}`, W - M, H - 8, { align: 'right' }); }
  doc.save(`Maengelliste_${p.nummer}_${p.name}.pdf`.replace(/[\\/:*?"<>|\s]+/g, '_'));
  toast('Mängelliste als PDF gespeichert.');
  if (knopf) { knopf.disabled = false; knopf.textContent = 'Als PDF speichern'; }
}

async function blitzPdf(pid) {
  const p = findP(pid), knopf = $('bz-pdf');

  if (knopf) { knopf.disabled = true; knopf.textContent = 'Erstelle PDF …'; }

    // Die Original-Vorlage liegt in einer eigenen Datei neben der index.html
    // Die Original-Vorlage steckt am Ende dieser Datei (Base64); die frühere separate Datei ist nicht mehr nötig
    if (!window.LASOLTEC_PDF) window.LASOLTEC_PDF = ($('lasoltec-vorlage')?.textContent || '').replace(/\s+/g, '');
    if (!window.LASOLTEC_PDF) throw new Error('leer');
    schritt = 'bibliothek';
    await ladeScript(PDFLIB_URL);
    schritt = 'pdf';
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.load(Uint8Array.from(atob(window.LASOLTEC_PDF), c => c.charCodeAt(0)));

    const font = await doc.embedFont(StandardFonts.Helvetica), fett = await doc.embedFont(StandardFonts.HelveticaBold);
    const blau = rgb(0.05, 0.16, 0.42);

    const sauber = s => [...String(s || '')].map(ch => { try { font.encodeText(ch); return ch; } catch (e) { return ch === 'Ω' ? 'Ohm' : ''; } }).join('');
    const umbrechen = (txt, size, maxW) => sauber(txt).split('\n').flatMap(absatz => {
      const out = []; let z = '';
      absatz.split(/\s+/).filter(Boolean).forEach(w => {
        const t = z ? z + ' ' + w : w;
        if (font.widthOfTextAtSize(t, size) > maxW && z) { out.push(z); z = w; } else z = t;
      });
      return z ? [...out, z] : out;
    });
    // Koordinaten aus der Vorlage (Grundlinie der Unterstrich-Linien bzw. der ☐-Zeichen, Ursprung unten links)
    const feld = (txt, linieY) => {
      let size = 10, zeilen = umbrechen(txt, size, 420);
      if (zeilen.length > 2) { size = 8.5; zeilen = umbrechen(txt, size, 420); }
      zeilen = zeilen.slice(0, 2);
      zeilen.forEach((z, i) => seite.drawText(z, { x: 91, y: linieY + 3 + (zeilen.length - 1 - i) * 10.5, size, font, color: blau }));
    };

    [213.8, 186.9, 160.1, 133.2, 106.5].forEach((y, i) => { if (b.unterlagen[BLITZ_UNTERLAGEN[i][0]]) kreuz(324.1, y); });
    const daten = await doc.save();

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([daten], { type: 'application/pdf' }));
    a.download = `Checkliste_Blitzschutz_${p.nummer}_${p.name}.pdf`.replace(/[\\/:*?"<>|\s]+/g, '_');
    a.style.display = 'none';

      vorlage: 'Die LASOLTEC-Vorlage fehlt in dieser Version der App – bitte die aktuelle index.html hochladen.',

}

// Monate der Zeitachse (Tag-Index von/bis) mit Jahr, z.B. "November 2026"
function monatsAbschnitte(ax) {
  const out = [];
  let von = 0;
  for (let i = 1; i <= ax.tage; i++) {
    if (i === ax.tage || addDays(ax.start, i).getUTCDate() === 1) {
      const d0 = addDays(ax.start, von);
      out.push({ von, bis: i, text: `${MONATE[d0.getUTCMonth()]} ${d0.getUTCFullYear()}` });
      von = i;
    }
  }
  return out;
}
// ---------- Gewerk-Suche im Terminformular ----------
const gwLabel = g => [g.name, g.firma, g.kontakt].filter(Boolean).join(' · ');
let gwTreffer = [], gwAktiv = 0;
function gwListe(offen) {
  const L = $('gw-liste'), inp = $('t-gw-suche');
  if (!L || !inp) return;
  if (!offen) { L.hidden = true; return; }
  const p = findP(route().id), gewaehlt = $('t-gw').value;
  // ist ein Gewerk gewählt und der Text unverändert, alle zeigen
  const sel = gewaehlt && p.gewerke.some(g => g.id === gewaehlt) ? gewerk(p, gewaehlt) : null;
  const q = sel && inp.value === gwLabel(sel) ? '' : inp.value.trim().toLowerCase();
  const woerter = q.split(/\s+/).filter(Boolean);
  const passt = g => { const t = [g.name, g.firma, g.kontakt, g.telefon, g.email, g.adresse, ARTEN[artOf(g)]].join(' ').toLowerCase(); return woerter.every(w => t.includes(w)); };
  const hl = s => { let h = esc(s || ''); woerter.forEach(w => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  gwTreffer = [];
  let html = '';
  GW_ARTEN.forEach(([art, titel]) => {
    const liste = p.gewerke.map(g => gewerk(p, g.id)).filter(g => artOf(g) === art && passt(g));
    if (!liste.length) return;
    html += `<div class="gw-gruppe">${titel}</div>` + liste.map(g => {
      const i = gwTreffer.push(g.id) - 1;
      return `<div class="gw-opt ${g.id === gewaehlt ? 'gewaehlt' : ''}" data-i="${i}" onmousedown="event.preventDefault();gwWaehlen('${g.id}')">
        <span class="swatch" style="background:${g.farbe}"></span>
        <div style="min-width:0"><b>${hl(g.name)}</b>${g.firma ? ` <span class="muted">· ${hl(g.firma)}</span>` : ''}
          ${g.kontakt || g.telefon || g.email ? `<div class="muted klein">${[g.kontakt && '👤 ' + hl(g.kontakt), g.telefon && '☎ ' + hl(g.telefon), g.email && hl(g.email)].filter(Boolean).join(' · ')}</div>` : ''}</div></div>`;
    }).join('');
  });
  // Kontakte aus dem CRM, die in diesem Projekt noch kein Gewerk sind
  if (woerter.length) {
    const crm = S().kontakte.filter(c => c.art !== 'kunde' && !p.gewerke.some(g => g.crm === c.id) && woerter.every(w => kontaktText(c).includes(w))).sort(nachName).slice(0, 12);
    if (crm.length) html += `<div class="gw-gruppe">Aus Kontakten (CRM) hinzufügen</div>` + crm.map(c => {
      const i = gwTreffer.push('crm:' + c.id) - 1;
      return `<div class="gw-opt" data-i="${i}" onmousedown="event.preventDefault();gwAusKontakt('${c.id}')">
        <span class="avatar klein" style="background:${avatarFarbe(c)}">${initialen(kontaktName(c))}</span>
        <div style="min-width:0"><b>${hl(c.gewerk || c.firma || c.name)}</b> <span class="muted">· ${hl([c.firma, c.name].filter(Boolean).join(' · '))}</span>
          <div class="muted klein">${[c.telefon && '☎ ' + hl(c.telefon), c.email && hl(c.email)].filter(Boolean).join(' · ')}</div></div></div>`;
    }).join('');
  }
  const neuIdx = gwTreffer.push('__neu') - 1;
  html += `<div class="gw-opt gw-neu" data-i="${neuIdx}" onmousedown="event.preventDefault();gwNeu()">＋ Neues Gewerk${q ? ` «${esc(inp.value.trim())}»` : ''} anlegen</div>`;
  if (gwTreffer.length === 1) html = `<div class="muted" style="padding:10px 12px">Kein Gewerk gefunden.</div>` + html;
  L.innerHTML = html;
  gwAktiv = Math.min(gwAktiv, gwTreffer.length - 1);
  if (q) gwAktiv = 0;
  gwMarkieren();
  L.hidden = false;
}
function gwMarkieren() {
  document.querySelectorAll('#gw-liste .gw-opt').forEach(el => el.classList.toggle('aktiv', +el.dataset.i === gwAktiv));
  document.querySelector('#gw-liste .gw-opt.aktiv')?.scrollIntoView({ block: 'nearest' });
}
function gwTaste(e) {
  const L = $('gw-liste');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (L.hidden) return gwListe(true);
    gwAktiv = (gwAktiv + (e.key === 'ArrowDown' ? 1 : -1) + gwTreffer.length) % gwTreffer.length;
    gwMarkieren();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const id = gwTreffer[gwAktiv];
    if (id === '__neu') gwNeu(); else if (id && id.startsWith('crm:')) gwAusKontakt(id.slice(4)); else if (id) gwWaehlen(id);
  } else if (e.key === 'Escape') L.hidden = true;
}
function gwWaehlen(id) {
  const p = findP(route().id), g = p && p.gewerke.some(x => x.id === id) && gewerk(p, id);
  if (!g || !$('t-gw')) return;
  $('t-gw').value = id; $('t-gw-suche').value = gwLabel(g);
  $('gw-liste').hidden = true;
  $('t-titel').focus();
}

// Termine nach Gewerk gruppiert, Gruppen in der Reihenfolge ihres ersten Termins
function ganttGruppen(p, termine) {
  const map = new Map();
  termine.forEach(t => { if (!map.has(t.gewerkId)) map.set(t.gewerkId, []); map.get(t.gewerkId).push(t); });
  return [...map].map(([gid, items]) => ({ g: gewerk(p, gid), items, start: items[0].start, ende: items.reduce((m, t) => t.ende > m ? t.ende : m, '0000') }));
}
// opt.zoom: 'tag' | 'woche' (sonst Auswahl im Terminplan), opt.vorschau: nur anzeigen (Projekt-Übersicht)
function gantt(p, termine, opt = {}) {
  const ax = zeitachse(termine), tagMode = (opt.zoom || ui.zoom) !== 'woche', w = tagMode ? 24 : (opt.vorschau ? 10 : 8), TW = ax.tage * w;
  const s0 = isoOf(ax.start), idx = iso => diffDays(s0, iso);
  const raster = `background-image:repeating-linear-gradient(to right, transparent 0 ${5 * w}px, rgba(0,0,0,.045) ${5 * w}px ${7 * w}px),` +
    `repeating-linear-gradient(to right, ${tagMode ? `#e6eaef 0 1px, transparent 1px ${w}px` : `#d5dbe2 0 1px, transparent 1px ${7 * w}px`})`;
  const tint = (c, a) => `background:linear-gradient(${c}${a},${c}${a}),#fff`;
  const row = (cls, left, track, leftStyle = '', attr = '') =>
    `<div class="xg-row ${cls}"><div class="xg-left" style="${leftStyle}" ${attr}>${left}</div><div class="xg-track" style="width:${TW}px;${raster}">${track}</div></div>`;

  const monate = monatsAbschnitte(ax).map(m => `<div class="xg-mon" style="left:${m.von * w}px;width:${(m.bis - m.von) * w}px">${m.text}</div>`).join('');
  const wochen = ax.wochen.map((d, i) => `<div class="xg-wk" style="left:${i * 7 * w}px;width:${7 * w}px">KW ${kw(d)}${tagMode ? ' · ' + fmt(isoOf(d)).slice(0, 6) : ''}</div>`).join('');
  let tage = '';
  if (tagMode) for (let i = 0; i < ax.tage; i++) {
    const d = addDays(ax.start, i), wd = (d.getUTCDay() + 6) % 7;
    tage += `<div class="xg-day ${wd > 4 ? 'we' : ''}" style="left:${i * w}px;width:${w}px">${d.getUTCDate()}<br>${'MDMDFSS'[wd]}</div>`;
  }
  const head = `<div class="xg-row xg-head" style="height:${tagMode ? 70 : 44}px"><div class="xg-left">
      <div>Gewerk / Aufgabe</div><div>Fortschritt</div><div>Start</div><div>Ende</div></div>
      <div class="xg-track" style="width:${TW}px">${monate}${wochen}${tage}</div></div>`;

  const body = ganttGruppen(p, termine).map(gr => {
    const g = gr.g;
    const kopf = row('xg-group', `<div style="grid-column:1/-1"><span class="swatch" style="background:${g.farbe}"></span>${esc(g.name)}${seiteTag(g)}
        <span class="muted" style="font-weight:400;margin-left:6px">${esc(g.firma || '')}</span></div>`,
      `<div class="xg-sum" style="left:${idx(gr.start) * w}px;width:${(diffDays(gr.start, gr.ende) + 1) * w}px;background:${g.farbe}"></div>`, tint(g.farbe, '38'));
    return kopf + gr.items.map(t => {
      const f = t.fortschritt || 0, l = idx(t.start) * w;
      const bar = t.meilenstein
        ? `<div class="xg-ms" style="left:${l + w / 2 - 6.5}px;background:${g.farbe}" title="${esc(t.titel)}: ${fmt(t.start)}"></div>`
        : `<div class="xg-bar" style="left:${l + 1}px;width:${(diffDays(t.start, t.ende) + 1) * w - 2}px;background:${g.farbe}" title="${esc(t.titel)}: ${fmt(t.start)} – ${fmt(t.ende)}${zeitTxt(t) ? ', ' + zeitTxt(t) : ''} · ${f}%"><i style="width:${f}%"></i></div>`;
      const pl = t.pl ? `<div class="xg-pl" style="left:${l - 3}px" title="Ich bin vor Ort: ${fmt(t.start)}${t.plZeit ? ' ab ' + t.plZeit : ''}"></div>` : '';
      const vor = t.nach && p.termine.find(x => x.id === t.nach);
      return row('task', `<div title="${esc(t.titel)}${vor ? ' – startet nach: ' + esc(vor.titel) : ''}">${vor ? '<span class="muted">↳ </span>' : ''}${t.meilenstein ? '◆ ' : ''}${esc(t.titel)}${zeitTxt(t) ? `<span class="muted"> · ${zeitTxt(t)}</span>` : ''}</div>
          <div>${t.meilenstein ? '' : `<span class="prog"><div style="width:${f}%"></div></span><small>${f}%</small>`}</div>
          <div>${fmt(t.start)}</div><div>${fmt(t.ende)}</div>`,
        bar + pl, tint(g.farbe, '14'), opt.vorschau ? '' : `onclick="ui.editTermin='${t.id}';render();scrollTo(0,0)" title="Klicken zum Bearbeiten"`);
    }).join('');
  }).join('');

  const ti = idx(todayIso()), LW = innerWidth <= 800 ? 230 : 480;
  const heute = ti >= 0 && ti < ax.tage ? `<div class="xg-today" style="left:${LW + ti * w + w / 2 - 1}px" title="Heute"></div>` : '';
  return `<div class="xg" data-today="${Math.max(0, ti) * w}" data-w="${w}"><div class="xg-inner">${head}${body}${heute}</div></div>`;
}

function speichereTermin(pid) {
  const p = findP(pid);
  const d = { gewerkId: val('t-gw'), titel: val('t-titel'), start: val('t-start'), ende: val('t-ende'), bemerkung: val('t-bem'), meilenstein: $('t-ms').checked,
    pl: $('t-pl').checked, plZeit: val('t-plzeit'), fortschritt: +$('t-fs').value, zeitVon: val('t-von'), zeitBis: val('t-bis'), nach: val('t-nach'), abstand: Math.max(0, +val('t-abst') || 0) };
  if (d.meilenstein && d.start && !d.ende) d.ende = d.start;
  // mit Abhängigkeit genügt die Dauer: fehlender Start wird berechnet
  if (d.nach && !d.start) { d.start = d.ende || todayIso(); if (!d.ende) d.ende = d.start; }
  if (!d.gewerkId) { toast('Bitte ein Gewerk aus der Liste wählen oder neu anlegen.'); return $('t-gw-suche').focus(); }
  if (!d.titel || !d.start || !d.ende) return toast('Bitte Tätigkeit, Start und Ende ausfüllen.');
  if (d.ende < d.start) return toast('Das Ende liegt vor dem Start.');
  if (ui.editTermin) Object.assign(p.termine.find(x => x.id === ui.editTermin), d);
  else p.termine.push({ id: uid(), ...d });
  const n = verschiebeAbhaengige(p);
  ui.editTermin = null; ui.formNr = (ui.formNr || 0) + 1; // Formular danach leeren
  save(); render(); toast(n ? `Termin gespeichert · ${n} abhängige Termine angepasst.` : 'Termin gespeichert.');
}
function loescheTermin(pid, tid) {
  if (!confirm('Termin löschen?')) return;
  const p = findP(pid);
  p.termine = p.termine.filter(x => x.id !== tid);
  verschiebeAbhaengige(p); save(); render();
}

// ---------- Abhängigkeiten ----------
function addArbeitstage(iso, n) {
  let d = toDate(iso);
  while (n > 0) { d = addDays(d, 1); const w = d.getUTCDay(); if (w && w !== 6) n--; }
  return isoOf(d);
}
// alle Termine, die (direkt oder indirekt) nach tid starten – dürfen nicht Vorgänger von tid werden
function nachfolger(p, tid) {
  const s = new Set([tid]);
  let neu = true;
  while (neu) { neu = false; p.termine.forEach(t => { if (t.nach && s.has(t.nach) && !s.has(t.id)) { s.add(t.id); neu = true; } }); }
  return s;
}
// Start = nächster Arbeitstag nach Ende des Vorgängers + Abstand; Anzahl Arbeitstage bleibt gleich. Gibt Anzahl verschobener Termine zurück.
function verschiebeAbhaengige(p) {
  const moved = new Set();
  for (let runde = 0; runde <= p.termine.length; runde++) {
    let geaendert = false;
    p.termine.forEach(t => {
      if (!t.nach) return;
      const v = p.termine.find(x => x.id === t.nach);
      if (!v) { t.nach = ''; return; }
      const start = addArbeitstage(v.ende, 1 + (t.abstand || 0));
      if (start !== t.start) {
        const at = Math.max(1, arbeitstage(t.start, t.ende));
        t.start = start; t.ende = addArbeitstage(start, at - 1);
        moved.add(t.id); geaendert = true;
      }
    });
    if (!geaendert) break;
  }
  return moved.size;
}

// ---------- Gewerke ----------
const GW_ARTEN = [['intern', 'CKW (intern)'], ['sub', 'Subunternehmer'], ['extern', 'Extern']];
function viewGewerke(p) {
  const fehlend = S().standardGewerke.filter(s => !p.gewerke.some(x => x.std === s.sid));
  return `
  <div class="card">
    <div class="ck-head">
      <div><h3 style="margin:0">Gewerke</h3><span class="muted">${p.gewerke.length} Gewerke · Standard-Gewerke sind mit ★ markiert</span></div>
      <button onclick="gewerkDialog('${p.id}')">＋ Gewerk hinzufügen</button>
    </div>
  </div>
  ${fehlend.length ? `<div class="note">${fehlend.length} Standard-Gewerke fehlen in diesem Projekt (${fehlend.map(s => esc(s.name) + ' ' + artKurz(s)).join(', ')}).
    <button class="sm" onclick="ergaenzeStandard('${p.id}')">Ergänzen</button></div>` : ''}
  ${GW_ARTEN.map(([art, titel]) => {

function gwArt(art) {

// legt eine Mailvorlage für ein Gewerk an und gibt ihren Namen zurück
function neueVorlageFuer(gewerkName) {
  const L = S().mailvorlagen;
  let name = `${gewerkName} anfragen`, n = 2;
  while (L.some(m => m.name.toLowerCase() === name.toLowerCase())) name = `${gewerkName} anfragen ${n++}`;
  L.push({ name, gewerk: gewerkName, an: '', betreff: `${gewerkName} {projektnummer} {projekt}, {ort}`,
    text: `Guten Tag {gewerk_kontakt}\n\nFür unser Projekt {projektnummer} {projekt} in {ort} benötigen wir Sie für folgende Arbeiten:\n\n{termine}\n\nBitte bestätigen Sie mir die Termine kurz.\n` });
  return name;
}
function gewerkSpeichern() {
  const { pid, gid, art, ausSuche } = ui.gwDlg, p = findP(pid), intern = art === 'intern';
  const name = val('g-name');
  if (!name) { toast('Bitte einen Gewerk-Namen eingeben.'); return $('g-name').focus(); }
  let vorlage = $('g-vorlage').value, neueVorlage = false;
  if (vorlage === '__neu') { vorlage = neueVorlageFuer(name); neueVorlage = true; }
  const daten = { name, art, eigen: intern, firma: intern ? '' : val('g-firma'), adresse: intern ? '' : val('g-adr'), kontakt: val('g-kontakt'),
    telefon: val('g-tel'), email: val('g-mail'), farbe: $('g-farbe').value, mailvorlage: vorlage };
  let meldung = gid ? 'Gewerk gespeichert' : 'Gewerk hinzugefügt';
  // Kontaktdaten zentral im CRM halten: verknüpften Kontakt aktualisieren oder neu anlegen
  let crm = ui.gwDlg.crm && kontaktById(ui.gwDlg.crm) ? ui.gwDlg.crm : '';
  const kd = { art, name: daten.kontakt, firma: daten.firma, telefon: daten.telefon, email: daten.email, adresse: daten.adresse };
  if (crm) { const c = kontaktById(crm); Object.assign(c, kd, { gewerk: c.gewerk || name }); }
  else if ($('g-crm-neu')?.checked && (kd.name || kd.firma || kd.email || kd.telefon)) {
    crm = uid(); S().kontakte.push({ id: crm, gewerk: name, notiz: '', ...kd }); meldung += ' · im CRM gespeichert';
  }
  daten.crm = crm || undefined;
  let g = gid && p.gewerke.find(x => x.id === gid);
  if (g) Object.assign(g, daten); else { g = { id: uid(), ...daten }; p.gewerke.push(g); }
  if (document.querySelector('input[name=g-std]:checked')?.value === 'ja' && !g.std) {
    const { id, std, fix, ...rest } = g, sid = uid();
    S().standardGewerke.push({ ...rest, sid });
    g.std = sid; g.fix = true;
    const n = stdAbgleich(state);
    meldung += ` · als Standard-Gewerk übernommen${n ? ' (' + inProjekten(n) + ')' : ''}`;
  }
  if (neueVorlage) meldung += ` · Mailvorlage «${vorlage}» angelegt`;
  save(); $('dlg').close(); render(); toast(meldung + '.');
  if (ausSuche) gwWaehlen(g.id);
}
function loescheGewerk(pid, gid) {
  const p = findP(pid);

// ---------- Wochenplan ----------
const wochenStart = iso => { const d = toDate(iso); return isoOf(addDays(d, -((d.getUTCDay() + 6) % 7))); };
// am Wochenende nur zeigen, wenn der Termin dort beginnt oder endet (sonst wird über das Wochenende nicht gearbeitet)
const aktivAm = (t, d) => t.start <= d && t.ende >= d && (toDate(d).getUTCDay() % 6 !== 0 || d === t.start || d === t.ende);
function viewWoche() {
  const today = todayIso();
  if (!ui.woche) ui.woche = wochenStart(today);
  const ws = ui.woche, tage = [...Array(7)].map((_, i) => isoOf(addDays(toDate(ws), i))), we = tage[6];
  const rows = state.projects.map(p => ({
    p, t: sortTermine(p).filter(t => t.start <= we && t.ende >= ws && (!ui.nurIntern || artOf(gewerk(p, t.gewerkId)) !== 'extern'))
  })).filter(r => r.t.length).sort((a, b) => a.t[0].start.localeCompare(b.t[0].start));
  const zeigen = tage.filter((d, i) => i < 5 || rows.some(r => r.t.some(t => aktivAm(t, d))));
  const shift = n => isoOf(addDays(toDate(ws), 7 * n));
  const einsaetze = meineEinsaetze().filter(e => e.t.start >= ws && e.t.start <= we).length;
  return `
  <div class="page-head no-print">
    <div><h1>Wochenplan</h1><div class="muted" style="margin-top:4px">KW ${kw(toDate(ws))} · ${fmt(ws)} – ${fmt(we)} · ${rows.length} Baustellen · ${einsaetze} Einsätze von mir</div></div>
    <div class="row">
      <label class="check" style="margin-right:8px"><input type="checkbox" ${ui.nurIntern ? 'checked' : ''} onchange="ui.nurIntern=this.checked;render()"> nur unsere Montage (intern + Sub)</label>
      <button class="sec sm" onclick="ui.woche='${shift(-1)}';render()">‹</button>
      <button class="sec sm" onclick="ui.woche=null;render()">Diese Woche</button>
      <button class="sec sm" onclick="ui.woche='${shift(1)}';render()">›</button>
      <button class="sec sm" onclick="print()">Drucken</button>
    </div>
  </div>
  <div class="print-only"><h2>Wochenplan KW ${kw(toDate(ws))} · ${fmt(ws)} – ${fmt(we)}</h2></div>
  <div class="card" style="padding:0;overflow:hidden">
    ${rows.length ? `<div class="table-wrap"><table class="wk">
      <tr><th style="width:200px">Projekt</th>${zeigen.map(d => `<th class="${d === today ? 'heute' : ''}">${WT[toDate(d).getUTCDay()]} ${fmt(d).slice(0, 6)}</th>`).join('')}</tr>
      ${rows.map(({ p, t }) => `<tr>
        <td><div style="display:flex;gap:8px;align-items:flex-start;cursor:pointer" onclick="openProjekt('${p.id}')"><span class="pdot" style="background:${p.farbe};margin-top:4px"></span>
          <div><b>${esc(p.nummer)}</b> ${esc(p.name)}<div class="muted">${esc(p.ort || '')}</div></div></div></td>
        ${zeigen.map(d => `<td class="${d === today ? 'heute' : ''}">${t.filter(x => aktivAm(x, d)).map(x => {
          const g = gewerk(p, x.gewerkId);
          return `<div class="wk-chip" style="border-left-color:${g.farbe}" onclick="openProjekt('${p.id}')" title="${esc(x.titel)}: ${fmt(x.start)} – ${fmt(x.ende)}">
            ${zeitTxt(x) ? `<b class="wk-zeit">${zeitTxt(x)}</b>` : ''}${x.meilenstein ? '◆ ' : ''}${esc(x.titel)}<small>${esc(g.name)}${!g.eigen && g.firma ? ' · ' + esc(g.firma) : ''}</small>
            ${x.pl && x.start === d ? `<span class="wk-pl">Ich vor Ort${x.plZeit ? ' ab ' + x.plZeit : ''}</span>` : ''}</div>`;
        }).join('')}</td>`).join('')}
      </tr>`).join('')}
    </table></div>` : '<div class="empty">In dieser Woche sind keine Arbeiten geplant.</div>'}
  </div>`;
}

function kontaktLoeschen(cid) {

function kontaktPicker(aktion, opt = {}) {
  return `<div class="gw-wahl"><input id="kp-${aktion}" autocomplete="off" placeholder="${opt.platzhalter || 'Kontakt suchen …'}" data-filter="${opt.filter || ''}" data-neu="${opt.ohneNeu ? '' : '1'}"

let kpTreffer = [], kpAktiv = 0;
function kpListe(aktion) {
  const inp = $('kp-' + aktion), L = $('kpl-' + aktion);
  if (!inp) return;
  const filter = inp.dataset.filter ? inp.dataset.filter.split(',') : null;
  const woerter = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const liste = S().kontakte.filter(c => (!filter || filter.includes(c.art)) && woerter.every(w => kontaktText(c).includes(w)));
  kpTreffer = []; kpAktiv = 0;
  let html = '';
  KONTAKT_ARTEN.forEach(([art, titel]) => {
    const l = liste.filter(c => c.art === art).sort(nachName).slice(0, 30);
    if (!l.length) return;
    html += `<div class="gw-gruppe">${titel}</div>` + l.map(c => {
      const i = kpTreffer.push(c.id) - 1;
      return `<div class="gw-opt" data-i="${i}" onmousedown="event.preventDefault();kpWaehlen('${aktion}','${c.id}')">
        <span class="avatar klein" style="background:${avatarFarbe(c)}">${initialen(kontaktName(c))}</span>
        <div style="min-width:0"><b>${markiere(kontaktName(c), woerter)}</b>${kontaktFirma(c) && c.name ? ` <span class="muted">· ${markiere(kontaktFirma(c), woerter)}</span>` : ''}
          <div class="muted klein">${[c.gewerk && markiere(c.gewerk, woerter), c.telefon && '☎ ' + markiere(c.telefon, woerter), c.email && markiere(c.email, woerter)].filter(Boolean).join(' · ')}</div></div></div>`;
    }).join('');
  });
  if (inp.dataset.neu) {
    const i = kpTreffer.push('__neu') - 1;
    html += `<div class="gw-opt gw-neu" data-i="${i}" onmousedown="event.preventDefault();kpNeu('${aktion}')">＋ Neuer Kontakt${inp.value.trim() ? ` «${esc(inp.value.trim())}»` : ''}</div>`;
  }
  if (!liste.length) html = '<div class="muted" style="padding:10px 12px">Kein Kontakt gefunden.</div>' + html;
  L.innerHTML = html; L.hidden = false; kpMarkieren(aktion);
}
function kpMarkieren(aktion) {
  document.querySelectorAll(`#kpl-${aktion} .gw-opt`).forEach(el => el.classList.toggle('aktiv', +el.dataset.i === kpAktiv));
  document.querySelector(`#kpl-${aktion} .gw-opt.aktiv`)?.scrollIntoView({ block: 'nearest' });
}
function kpTaste(e, aktion) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    kpAktiv = (kpAktiv + (e.key === 'ArrowDown' ? 1 : -1) + kpTreffer.length) % Math.max(1, kpTreffer.length);
    kpMarkieren(aktion);
  } else if (e.key === 'Enter') {
    e.preventDefault(); e.stopPropagation();
    const id = kpTreffer[kpAktiv];
    if (id === '__neu') kpNeu(aktion); else if (id) kpWaehlen(aktion, id);
  } else if (e.key === 'Escape') $('kpl-' + aktion).hidden = true;
}
function kpWaehlen(aktion, cid) { $('kpl-' + aktion).hidden = true; $('kp-' + aktion).value = ''; window[aktion](cid); }
function kpNeu(aktion) {
  const inp = $('kp-' + aktion), f = inp.dataset.filter;
  $('kpl-' + aktion).hidden = true;
  kontaktDialog(null, { name: inp.value.trim(), art: f ? f.split(',')[0] : 'extern', danach: aktion });
}

// ---------- Alle Termine (Kalender) ----------
function viewKalender() {
  const [y, m] = ui.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), last = new Date(Date.UTC(y, m, 0));
  const gridStart = addDays(first, -((first.getUTCDay() + 6) % 7));
  const gridEnd = addDays(last, 6 - ((last.getUTCDay() + 6) % 7));
  const today = todayIso();
  const spans = state.projects.map(p => ({ p, s: span(p) })).filter(x => x.s).sort((a, b) => a.s.start.localeCompare(b.s.start));
  const plTag = {};
  meineEinsaetze().forEach(e => (plTag[e.t.start] = plTag[e.t.start] || []).push(e));

  let weeks = '';
  for (let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)) {
    const wsI = isoOf(ws), weI = isoOf(addDays(ws, 6));
    const segs = spans.filter(x => x.s.start <= weI && x.s.ende >= wsI);
    const rows = `minmax(26px, auto) ${segs.map(() => '25px').join(' ')} 1fr`;
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), di = isoOf(d);
      const cls = [d.getUTCMonth() !== m - 1 && 'out', i >= 5 && 'we', di === today && 'today'].filter(Boolean).join(' ');
      const pls = ui.showPl ? (plTag[di] || []).map(({ p, t }) =>
        `<b class="cal-pl" title="Ich vor Ort: ${esc(p.nummer)} ${esc(p.name)} – ${esc(t.titel)}${t.plZeit ? ' ab ' + t.plZeit : ''}" onclick="openProjekt('${p.id}')">${t.plZeit || 'PL'} ${esc(p.nummer)}</b>`).join('') : '';
      cells += `<div class="cal-day ${cls}" style="grid-column:${i + 1}"></div>
        <div class="cal-num ${cls}" style="grid-column:${i + 1}"><span>${d.getUTCDate()}</span>${pls}</div>`;
    }
    const bars = segs.map(({ p, s }, lane) => {
      const a = s.start > wsI ? s.start : wsI, b = s.ende < weI ? s.ende : weI;
      const l = s.start < wsI ? '0' : '5px', r = s.ende > weI ? '0' : '5px';
      return `<div class="cal-bar" style="grid-column:${diffDays(wsI, a) + 1} / span ${diffDays(a, b) + 1};grid-row:${lane + 2};background:${p.farbe};border-radius:${l} ${r} ${r} ${l}"
        title="${esc(p.nummer)} ${esc(p.name)}: ${fmt(s.start)} – ${fmt(s.ende)}" onclick="openProjekt('${p.id}')">${esc(p.nummer)} · ${esc(p.name)}</div>`;
    }).join('');
    weeks += `<div class="cal-week" style="grid-template-rows:${rows}">${cells}${bars}</div>`;
  }

  const shift = n => { const d = new Date(Date.UTC(y, m - 1 + n, 1)); return isoOf(d).slice(0, 7); };
  return `
  <div class="page-head">
    <h1>Alle Termine</h1>
    <div class="row">
      <label class="check" style="margin-right:12px"><input type="checkbox" ${ui.showPl ? 'checked' : ''} onchange="ui.showPl=this.checked;render()"> <span class="cal-pl" style="margin:0">PL</span> Meine Einsätze anzeigen</label>
      <button class="sec sm" onclick="ui.month='${shift(-1)}';render()">‹</button>
      <b style="min-width:140px;text-align:center">${MONATE[m - 1]} ${y}</b>
      <button class="sec sm" onclick="ui.month='${shift(1)}';render()">›</button>
      <button class="sec sm" onclick="ui.month='${today.slice(0, 7)}';render()">Heute</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <div class="cal" style="border:none;min-width:640px">
      <div class="cal-head">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => `<div>${d}</div>`).join('')}</div>
      ${weeks}
    </div>
  </div>
  <div class="card">
    <h3>Projektdauer</h3>
    ${spans.length ? `<div class="table-wrap"><table>
      <tr><th>Projekt</th><th>Start</th><th>Ende</th><th>Dauer</th><th>Status</th></tr>
      ${spans.map(({ p, s }) => `<tr class="click" onclick="openProjekt('${p.id}')">
        <td><span class="swatch" style="background:${p.farbe}"></span><b>${esc(p.nummer)}</b> ${esc(p.name)}</td>
        <td>${fmt(s.start)}</td><td>${fmt(s.ende)}</td>
        <td>${Math.ceil((diffDays(s.start, s.ende) + 1) / 7)} Wo. · ${arbeitstage(s.start, s.ende)} AT</td>
        <td>${badge(p)}</td></tr>`).join('')}
    </table></div>` : '<div class="empty">Noch keine Projekte mit Terminen.</div>'}
  </div>`;
}

function updStd(i, k, v) {
  const s = S().standardGewerke[i], alt = s[k];

  s[k] = v;
  let n = 0;
  state.projects.forEach(p => p.gewerke.forEach(g => {

    if ((g[k] ?? '') === (alt ?? '') || (k !== 'name' && !g[k])) { g[k] = v; if (k === 'art') g.eigen = v === 'intern'; n++; }
  }));
  save(); render();
  if (n) toast(`Gespeichert · ${inProjekten(n)} übernommen.`);
}
function addStd(art = 'extern') {
  const list = S().standardGewerke;
  list.push({ name: 'Neues Gewerk', art, eigen: art === 'intern', firma: '', adresse: '', kontakt: '', email: '', farbe: freieFarbe(list.map(g => g.farbe)), sid: uid() });
  const n = stdAbgleich(state);
  save(); render();
  toast(`Gewerk hinzugefügt${n ? ' · ' + inProjekten(n) + ' ergänzt' : ''}. Jetzt Namen eintragen.`);

// aus allen Projekten entfernen; Gewerke mit Terminen bleiben im Projekt (dann löschbar)
function stdEntfernen(sid) {
  let weg = 0, bleibt = 0;
  state.projects.forEach(p => {
    p.gewerke = p.gewerke.filter(g => {
      if (g.std !== sid) return true;
      if (p.termine.some(t => t.gewerkId === g.id)) { delete g.std; g.fix = false; bleibt++; return true; }
      weg++; return false;
    });
  });
  return { weg, bleibt };
}
function delStd(i) {
  const s = S().standardGewerke[i];
  if (!confirm(`«${s.name}» aus der Standardliste und aus allen Projekten ohne Termine dieses Gewerks entfernen?`)) return;
  S().standardGewerke.splice(i, 1);
  const r = stdEntfernen(s.sid);
  save(); render();
  toast(`Entfernt${r.weg ? ' · ' + inProjekten(r.weg) : ''}${r.bleibt ? ` · ${r.bleibt}× wegen Terminen behalten` : ''}.`);
}
function stdZuruecksetzen() {

}

// Backup mit den Bildern der Mängellisten (die liegen ausserhalb der Projekte)
async function backupJson() {
  const bilder = {};
  for (const id of bildIds(state)) { const d = await bildHolen(id); if (d) bilder[id] = d; }
  return JSON.stringify(Object.keys(bilder).length ? { ...state, bilder } : state, null, 2);
}
async function exportJson() {
  const blob = new Blob([await backupJson()], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `projekte-backup-${todayIso()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importJson(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.projects)) throw 0;
      if (confirm(`${d.projects.length} Projekte importieren? Die aktuellen Daten werden ersetzt.`)) {
        const bilder = d.bilder || {};
        delete d.bilder;
        Object.entries(bilder).forEach(([id, data]) => { bildCache[id] = data; idb.set('bild:' + id, data).catch(() => {}); bildHochladen(id, data); });
        state = migrate(d); save(); nav('projekte'); toast('Backup importiert.');
      }
    } catch (e) { toast('Ungültige Backup-Datei.'); }
    input.value = '';
  };
  r.readAsText(f);
}

// Ordner-Handle wird in IndexedDB gemerkt (localStorage kann das nicht)
const idb = {
  open: () => new Promise((res, rej) => {
    const r = indexedDB.open('ckw-projekte', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }),
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};

// ---------- Bilder (Mängelliste) ----------
// Bilder stehen nicht im Projekt (Cloud-Eintrag max. 1 MB, Browser-Speicher ca. 5 MB), sondern einzeln:
// lokal in IndexedDB unter "bild:{id}", in der Cloud unter nutzer/{uid}/bilder/{id}. Im Projekt steht nur die id.
const bildCache = {};
let bildFehlerGemeldet = false;
async function bildSpeichern(data) {
  const id = 'b' + uid() + uid();
  bildCache[id] = data;
  try { await idb.set('bild:' + id, data); } catch (e) { /* bleibt im Speicher und in der Cloud */ }

}
function bildHochladen(id, data) {
  if (!cloud.user) return;
  nutzerRef().collection('bilder').doc(id).set({ data, geaendert: firebase.firestore.FieldValue.serverTimestamp() }).catch(e => {
    if (bildFehlerGemeldet) return;
    bildFehlerGemeldet = true;
    toast(e.code === 'permission-denied' ? 'Bild nur auf diesem Gerät gespeichert – die Firestore-Regeln erlauben «bilder» noch nicht.' : 'Bild konnte nicht in die Cloud geladen werden.');
  });
}
async function bildHolen(id) {
  if (!id) return null;
  if (bildCache[id]) return bildCache[id];
  let d = null;
  try { d = await idb.get('bild:' + id); } catch (e) {}
  // auf einem anderen Gerät aufgenommen: aus der Cloud holen und hier ablegen
  if (!d && cloud.user) {
    try { const s = await nutzerRef().collection('bilder').doc(id).get(); if (s.exists) { d = s.data().data; idb.set('bild:' + id, d).catch(() => {}); } } catch (e) {}
  }
  if (d) bildCache[id] = d;
  return d;
}
function bildLoeschen(id) {
  if (!id) return;
  delete bildCache[id];
  idb.del('bild:' + id).catch(() => {});
  if (cloud.user) nutzerRef().collection('bilder').doc(id).delete().catch(() => {});
}
// Foto verkleinern: längste Seite 1280 px, JPEG – ca. 100–250 KB pro Bild
function bildVerkleinern(file, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); };
    img.src = url;
  });
}
const bildIds = st => st.projects.flatMap(p => (p.maengel?.punkte || []).map(x => x.bild).filter(Boolean));
// Bilder in einem Bereich nachladen (<img data-bild="id">)
function bilderEinsetzen(wurzel) {
  wurzel.querySelectorAll('img[data-bild]').forEach(async img => {
    const d = await bildHolen(img.dataset.bild);
    if (d) img.src = d; else img.replaceWith(Object.assign(document.createElement('span'), { textContent: 'Bild nicht verfügbar' }));
  });
}
const backup = { dir: null, status: 'showDirectoryPicker' in window ? 'none' : 'unsupported', last: null };

async function initBackup() {
  if (backup.status === 'unsupported') return;
  try {
    const dir = await idb.get('dir');
    if (!dir) return;
    backup.dir = dir;
    backup.status = (await dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'granted' : 'prompt';
    if (backup.status === 'granted') runAutoBackup();

}
async function waehleOrdner() {

    const dir = await window.showDirectoryPicker({ id: 'ckw-backup', mode: 'readwrite' });
    backup.dir = dir; backup.status = 'granted';
    await idb.set('dir', dir);
    state.settings.autoBackup = true; save();

async function regrant() {
  try { backup.status = (await backup.dir.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'granted' : 'prompt'; } catch (e) {}
  if (backup.status === 'granted') await runAutoBackup();

}
async function writeFile(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });

}
let abTimer;
function scheduleAutoBackup() { clearTimeout(abTimer); abTimer = setTimeout(() => runAutoBackup(), 1500); }
async function runAutoBackup(force) {
  if (!backup.dir || backup.status !== 'granted' || (!S().autoBackup && !force)) return;
  try {
    const json = await backupJson();
    await writeFile(backup.dir, 'projekte-backup-aktuell.json', json);
    if (S().tageskopien) await writeFile(backup.dir, `projekte-backup-${todayIso()}.json`, json);

// ---------- PDF ----------
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const LIME = [191, 214, 47];

// Logo rechtsbündig bei xr (oder mittig, wenn mitte): hochgeladenes Bild, sonst nachgebaute CKW-Wortmarke
function pdfLogo(doc, xr, yTop, h, mitte = false) {
  const s = S();
  if (s.logo && s.logoW && s.logoH) {
    const w = h * s.logoW / s.logoH;
    try { doc.addImage(s.logo, mitte ? xr - w / 2 : xr - w, yTop, w, h); return true; } catch (e) { /* weiter mit Wortmarke */ }
  }
  if (!/ckw/i.test(s.firma)) return false;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(h / (0.72 * 0.3528)); doc.setTextColor(0);
  const r = h * 0.12, tw = doc.getTextWidth('CKW');
  if (mitte) xr += (tw + 2 * r + h * 0.05) / 2;
  doc.text('CKW', xr - 2 * r - h * 0.05 - tw, yTop + h);
  doc.setFillColor(...LIME); doc.circle(xr - r, yTop + h - r, r, 'F');
  return true;
}

// Linie mit Farbverlauf Blau → Türkis → Grün → Gelb (Arbeitsauftrag)
function pdfVerlauf(doc, x, y, w, h) {
  const st = [[0, 85, 140], [0, 150, 200], [120, 190, 60], [230, 200, 40]], n = 80;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) * (st.length - 1), a = Math.min(Math.floor(t), st.length - 2), f = t - a;
    doc.setFillColor(...st[a].map((v, j) => Math.round(v + (st[a + 1][j] - v) * f)));
    doc.rect(x + w * i / n, y, w / n + 0.05, h, 'F');
  }
}
// Kopf von Arbeitsauftrag und Abnahmeprotokoll: Logo, Farbverlauf, dunkler Balken, Titel; gibt die nächste y-Position zurück
const AA_DUNKEL = [55, 71, 79], AA_TXT = [24, 24, 27];
const pdfAbsatz = (doc, t, w) => String(t || '').split('\n').flatMap(l => l.trim() ? doc.splitTextToSize(l, w) : ['']);
function pdfAaKopf(doc, nummer, rechts, titel) {
  const W = 210, M = 14, B = W - 2 * M;
  pdfLogo(doc, W / 2, 10, 11, true);
  pdfVerlauf(doc, M, 25.5, B, 0.9);
  doc.setFillColor(...AA_DUNKEL); doc.roundedRect(M, 30, B, 9, 2, 2, 'F');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(255);
  doc.text(`Projekt-Nr: ${nummer}`, M + 4, 35.8);
  let x = W - M - 4;
  [...rechts].reverse().forEach(([l, v]) => { const t = `${l}: ${v}`; doc.text(t, x, 35.8, { align: 'right' }); x -= doc.getTextWidth(t) + 9; });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(...AA_TXT);
  const tl = doc.splitTextToSize(titel, B);
  doc.text(tl, M, 51);
  return 51 + tl.length * 7.5 + 4;
}
// Spalten mit Symbol und Trennlinien (Kunde · Objekt · …), zwei oder drei
function pdfSpalten(doc, y, spalten) {
  const M = 14, sw = (210 - 2 * M) / spalten.length; let hoch = 0;
  spalten.forEach(([icon, l, text], i) => {
    const x = M + i * sw + (i ? 4 : 0);
    pdfIcon(doc, icon, x, y - 4.3);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT);
    if (doc.getTextWidth(l) > sw - 11) doc.setFontSize(10);
    doc.text(l, x + 7, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
    const L = pdfAbsatz(doc, text, sw - 13);
    doc.text(L, x + 7, y + 5.2);
    hoch = Math.max(hoch, 7 + L.length * 4.3);
  });
  hoch = Math.max(hoch, 18);
  doc.setDrawColor(205); doc.setLineWidth(0.3);
  for (let i = 1; i < spalten.length; i++) doc.line(M + i * sw, y - 4, M + i * sw, y + hoch);
  return y + hoch + 9;
}
// Symbole im PDF: dieselben Pfade wie im Formular (AA_PFADE), einmal als Bild gezeichnet
const pdfIconCache = {};
function pdfIcon(doc, art, x, y) {
  if (!pdfIconCache[art]) {
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    c.width = c.height = 96; ctx.scale(4, 4); ctx.fillStyle = 'rgb(' + AA_DUNKEL.join(',') + ')';
    ctx.fill(new Path2D(AA_PFADE[art] || AA_PFADE.werkzeug));
    pdfIconCache[art] = c.toDataURL('image/png');
  }
  doc.addImage(pdfIconCache[art], 'PNG', x, y, 5.2, 5.2);
}
function pdfKaestchen(doc, x, y, an) {
  doc.setDrawColor(140); doc.setLineWidth(0.3); doc.setFillColor(255); doc.roundedRect(x, y, 3.2, 3.2, 0.5, 0.5, 'FD');
  if (an) { doc.setDrawColor(24); doc.setLineWidth(0.55); doc.line(x + 0.6, y + 1.7, x + 1.4, y + 2.6); doc.line(x + 1.4, y + 2.6, x + 2.7, y + 0.6); }
}

function pdf(pid) {
  const p = findP(pid), s = S();
  const termine = sortTermine(p);
  if (!termine.length) return toast('Keine Termine vorhanden.');
  if (!window.jspdf) return toast('PDF-Bibliothek nicht geladen (Internetverbindung?).');
  // Der Terminplan ist immer ein einzelnes A3-Blatt (quer). Passt er nicht, wird die Tabelle kleiner gezeichnet.
  let doc;
  for (const f of [1, 0.9, 0.8, 0.72, 0.65, 0.58, 0.52, 0.47, 0.42, 0.38, 0.34]) {

// zeichnet den Terminplan; f skaliert Schrift und Zeilenhöhe der Tabellen
function pdfTerminplan(p, termine, f) {
  const s = S(), { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
  const W = 420, H = 297, M = 14, BRAND = [24, 24, 27], UNTEN = 18;
  const ax = zeitachse(termine);
  const kontakt = [s.telefon && 'Tel. ' + s.telefon, s.email].filter(Boolean);

  // Kopf
  doc.setFillColor(...LIME); doc.rect(0, 0, W, 3, 'F');
  doc.setTextColor(29, 39, 51);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.text('Terminplan', M, 19);
  doc.setFontSize(15); doc.text(`Projekt ${p.nummer} – ${p.name}`, M, 28);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  let ly = 35;
  if (p.ort) { doc.text(`Ort: ${p.ort}`, M, ly); ly += 5.5; }
  doc.text(`Projektleiter: ${s.name}   ·   Stand: ${fmt(todayIso())}`, M, ly);

  // Logo oben rechts, darunter Firmenadresse
  const mitLogo = pdfLogo(doc, W - M, 9, 12);
  const ry = mitLogo ? 28 : 16;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(24, 24, 27);
  doc.text(s.firma, W - M, ry, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 90, 98);
  const right = [s.strasse, s.ort, `Projektleiter: ${s.name}`, ...kontakt].filter(Boolean);
  doc.text(right, W - M, ry + 5, { align: 'right' });
  doc.setTextColor(24, 24, 27);

  let y = Math.max(ly + 7, ry + 5 + right.length * 4.4 + 3);
  if (p.bemerkung) {
    const lines = doc.splitTextToSize(p.bemerkung, W - 2 * M);
    doc.setFontSize(10); doc.setTextColor(90); doc.text(lines, M, y); y += lines.length * 4.5 + 2;
    doc.setTextColor(29, 39, 51);
  }

  // Terminplan-Tabelle im Gantt-Stil, gruppiert nach Gewerk
  const rows = ganttGruppen(p, termine).flatMap(gr => [{ gr }, ...gr.items.map(t => ({ t, g: gr.g }))]);
  const LW = [100, 22, 22, 22], GCOL = 4;
  const gW = W - 2 * M - LW.reduce((a, b) => a + b, 0), dW = gW / ax.tage, tagMode = dW >= 2.4;
  const s0 = isoOf(ax.start), tIdx = diffDays(s0, todayIso());
  const mix = (hex, fa) => hexRgb(hex).map(c => Math.round(c + (255 - c) * fa));
  doc.autoTable({
    startY: y, margin: { left: M, right: M, top: 14, bottom: UNTEN }, rowPageBreak: 'avoid',
    head: [['Gewerk / Aufgabe', 'Fortschritt', 'Start', 'Ende', '']],
    body: rows.map(r => {
      if (r.gr) {
        const g = r.gr.g;
        return [{ content: `${g.name}${g.firma ? '  –  ' + g.firma : ''}   (${ARTEN[artOf(g)]})`, colSpan: 4, styles: { fontStyle: 'bold', fillColor: mix(g.farbe, 0.72) } }, ''];
      }
      const t = r.t, fill = { fillColor: mix(r.g.farbe, 0.9) };
      return [
        { content: '   ' + (t.meilenstein ? '[MS] ' : '') + t.titel + (zeitTxt(t) ? `  (${zeitTxt(t)})` : '') + (t.bemerkung ? '\n   ' + t.bemerkung : '') + (t.pl ? `\n   Projektleiter vor Ort${t.plZeit ? ' ab ' + t.plZeit : ''}` : ''), styles: fill },
        { content: t.meilenstein ? '' : (t.fortschritt || 0) + ' %', styles: { ...fill, halign: 'right' } },
        { content: fmt(t.start), styles: fill }, { content: fmt(t.ende), styles: fill }, ''];
    }),
    styles: { fontSize: 9.5 * f, cellPadding: 1.3 * f, valign: 'middle', lineColor: [221, 227, 234], lineWidth: 0.1, minCellHeight: 6.6 * f },
    headStyles: { fillColor: BRAND, textColor: 255, fontStyle: 'bold', fontSize: 10 * Math.max(f, 0.7), minCellHeight: (tagMode ? 17 : 12) * Math.max(f, 0.75) },
    columnStyles: { 0: { cellWidth: LW[0] }, 1: { cellWidth: LW[1] }, 2: { cellWidth: LW[2] }, 3: { cellWidth: LW[3] }, 4: { cellWidth: gW, fillColor: [255, 255, 255] } },
    didDrawCell: d => {
      if (d.column.index !== GCOL) return;
      const { x, y: cy, width: w, height: h } = d.cell;
      if (d.section === 'head') {
        // drei Bänder: Monat + Jahr, Kalenderwoche, Wochentage
        const mh = h * (tagMode ? 0.34 : 0.5), wh = tagMode ? h * 0.33 : h * 0.5, wy = cy + mh;
        const lang = 7 * dW > 28, step = Math.max(1, Math.ceil(12 / (7 * dW)));
        doc.setLineWidth(0.1); doc.setDrawColor(110, 120, 132); doc.line(x, wy, x + w, wy);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...LIME);
        monatsAbschnitte(ax).forEach(m => {
          const mx = x + m.von * dW;
          if (m.von) { doc.setDrawColor(170, 178, 186); doc.line(mx, cy, mx, cy + h); }
          if ((m.bis - m.von) * dW > 18) doc.text(m.text, mx + 1, cy + mh / 2 + 1.3);
        });
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(255); doc.setDrawColor(110, 120, 132);
        ax.wochen.forEach((wk, i) => {
          const wx = x + i * 7 * dW;
          if (i) doc.line(wx, wy, wx, cy + h);
          if (i % step === 0) doc.text(lang ? `KW ${kw(wk)} · ${fmt(isoOf(wk)).slice(0, 6)}` : 'KW' + kw(wk), wx + 0.8, wy + wh / 2 + 1.1);
        });
        if (tagMode) {
          doc.setFontSize(Math.min(7, dW * 2.2));
          for (let i = 0; i < ax.tage; i++) {
            const wd = (addDays(ax.start, i).getUTCDay() + 6) % 7;
            doc.setTextColor(wd > 4 ? 140 : 225); doc.text('MDMDFSS'[wd], x + (i + 0.5) * dW, wy + wh + (h - mh - wh) * 0.72, { align: 'center' });
          }
        }
        return;
      }
      // Raster: Wochenenden grau, Tages- und Wochenlinien, Heute-Linie
      doc.setFillColor(241, 243, 246);
      for (let i = 5; i < ax.tage; i += 7) doc.rect(x + i * dW, cy, 2 * dW, h, 'F');
      doc.setLineWidth(0.1);
      if (tagMode) { doc.setDrawColor(233, 237, 241); for (let i = 1; i < ax.tage; i++) doc.line(x + i * dW, cy, x + i * dW, cy + h); }
      doc.setDrawColor(200, 207, 215); for (let i = 7; i < ax.tage; i += 7) doc.line(x + i * dW, cy, x + i * dW, cy + h);
      if (tIdx >= 0 && tIdx < ax.tage) { doc.setDrawColor(192, 57, 43); doc.setLineWidth(0.35); doc.line(x + (tIdx + 0.5) * dW, cy, x + (tIdx + 0.5) * dW, cy + h); }
      const r = rows[d.row.index];
      if (!r) return;
      if (r.gr) {
        doc.setFillColor(...mix(r.gr.g.farbe, 0.35));
        doc.rect(x + diffDays(s0, r.gr.start) * dW, cy + h / 2 - 0.9, (diffDays(r.gr.start, r.gr.ende) + 1) * dW, 1.8, 'F');
        return;
      }
      const t = r.t, c = hexRgb(r.g.farbe);
      const bx = x + diffDays(s0, t.start) * dW, bh = Math.min(5 * f, h - 2), by = cy + (h - bh) / 2;
      if (t.meilenstein) {
        const cx = bx + dW / 2, rr = 2.8 * f, my = cy + h / 2;
        doc.setFillColor(...c);
        doc.triangle(cx - rr, my, cx, my - rr, cx + rr, my, 'F');
        doc.triangle(cx - rr, my, cx, my + rr, cx + rr, my, 'F');
      } else {
        const bw = Math.max(0.8, (diffDays(t.start, t.ende) + 1) * dW - (tagMode ? 0.3 : 0));
        doc.setFillColor(...c); doc.rect(bx, by, bw, bh, 'F');
        const f = (t.fortschritt || 0) / 100;
        if (f > 0) { doc.setFillColor(...c.map(v => Math.round(v * 0.6))); doc.rect(bx, by, bw * f, bh, 'F'); }
      }
      if (t.pl) {
        doc.setFillColor(192, 57, 43); doc.setDrawColor(255); doc.setLineWidth(0.4);
        doc.circle(bx + 0.6, by - 0.2, 1.3, 'FD');
      }
    }
  });
  // Legende
  {
    const ly2 = doc.lastAutoTable.finalY + 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(107, 119, 133);
    let lx = M;
    doc.setFillColor(150, 160, 170); doc.rect(lx, ly2 - 2.6, 7, 3, 'F'); doc.setFillColor(90, 96, 102); doc.rect(lx, ly2 - 2.6, 3.5, 3, 'F');
    doc.text('dunkel = erledigter Anteil', lx + 9, ly2); lx += 52;
    doc.setDrawColor(192, 57, 43); doc.setLineWidth(0.4); doc.line(lx + 1, ly2 - 3.2, lx + 1, ly2 + 0.8);
    doc.text('Heute', lx + 3.5, ly2); lx += 20;
    if (termine.some(t => t.pl)) {
      doc.setFillColor(192, 57, 43); doc.circle(lx + 1.5, ly2 - 1.1, 1.5, 'F');
      doc.text(`Projektleiter ${s.name} am ersten Tag vor Ort`, lx + 4.5, ly2);
    }
  }

  // Beteiligte
  const used = p.gewerke.filter(g => termine.some(t => t.gewerkId === g.id)).map(g => gewerk(p, g.id))
    .sort((a, b) => (b.eigen ? 1 : 0) - (a.eigen ? 1 : 0));
  y = doc.lastAutoTable.finalY + 14 * Math.max(f, 0.7);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13 * Math.max(f, 0.7)); doc.setTextColor(29, 39, 51);
  doc.text('Beteiligte Unternehmen', M, y);
  const zeile = g => [g.name, ARTEN[artOf(g)], g.firma || '–', g.adresse || '',
    g.eigen ? [g.kontakt, g.telefon && 'Tel. ' + g.telefon, g.kontakt !== s.name && 'PL: ' + s.name, ...kontakt].filter(Boolean).join(', ')
      : [g.kontakt, g.telefon && 'Tel. ' + g.telefon, g.email].filter(Boolean).join(', ')];
  // bei vollen Plänen zweispaltig (zwei Unternehmen pro Zeile), damit alles auf das eine A3-Blatt passt
  const zweispaltig = f < 0.75 && used.length > 3;
  const kopf = ['Gewerk', 'Ausführung', 'Firma', 'Adresse', 'Kontakt'];
  const haelfte = Math.ceil(used.length / 2);
  const koerper = zweispaltig
    ? Array.from({ length: haelfte }, (_, i) => [...zeile(used[i]), ...(used[i + haelfte] ? zeile(used[i + haelfte]) : ['', '', '', '', ''])])
    : used.map(zeile);
  doc.autoTable({
    startY: y + 3, margin: { left: M, right: M, top: 14, bottom: UNTEN }, rowPageBreak: 'avoid',
    head: [zweispaltig ? [...kopf, ...kopf] : kopf],
    body: koerper,
    styles: { fontSize: 9.5 * f, cellPadding: 1.8 * f, lineColor: [221, 227, 234], lineWidth: 0.1 },
    headStyles: { fillColor: [241, 240, 235], textColor: BRAND, fontStyle: 'bold', fontSize: 9.5 * Math.max(f, 0.7) },
    didParseCell: d => { const g = gwAnZelle(d); if (d.section === 'body' && g && g.eigen) d.cell.styles.fontStyle = 'bold'; },
    didDrawCell: d => {
      const g = gwAnZelle(d);
      if (d.section === 'body' && g && d.column.index % 5 === 0) {
        doc.setFillColor(...hexRgb(g.farbe));
        doc.rect(d.cell.x, d.cell.y, 1.2, d.cell.height, 'F');
      }
    }
  });
  // welches Unternehmen steht in dieser Zelle (bei zweispaltig: rechte Hälfte = zweite Liste)
  function gwAnZelle(d) { return zweispaltig ? used[d.row.index + (d.column.index >= 5 ? haelfte : 0)] : used[d.row.index]; }

  // Fusszeile (bei Überlänge auf jeder Seite, normalerweise nur eine)
  const n = doc.getNumberOfPages();
  const fuss = [s.firma, s.strasse, s.ort, 'Projektleiter: ' + s.name, ...kontakt].filter(Boolean).join(' · ');
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor(...LIME); doc.setLineWidth(0.7); doc.line(M, H - 13, W - M, H - 13);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 119, 133);
    doc.text(fuss, M, H - 8);
    doc.text(`Projekt ${p.nummer} · Stand ${fmt(todayIso())}${n > 1 ? ` · Seite ${i} / ${n}` : ''}`, W - M, H - 8, { align: 'right' });
  }
  return doc;
}

const ERLAUBTE_MAIL = 'nicola.jundt@ckw.ch';
// Firestore: nutzer/{uid}/daten/einstellungen und nutzer/{uid}/projekte/{projektId}, Inhalt jeweils als JSON-Text
const cloud = { user: null, db: null, status: 'aus', fehler: '', zuletzt: null, synced: {}, timer: null, unsub: [] };
const EINST = '__einstellungen';
const nutzerRef = () => cloud.db.collection('nutzer').doc(cloud.user.uid);

function cloudStart() {
  if (!window.firebase) return zeigeLogin('Der Anmeldedienst ist nicht erreichbar – bitte Internetverbindung prüfen und neu laden.', false);
  firebase.initializeApp(FIREBASE_CONFIG);
  cloud.db = firebase.firestore();
  cloud.db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); // offline weiterarbeiten
  firebase.auth().onAuthStateChanged(async u => {
    if (!u) { cloudStop(); return zeigeLogin(); }
    if ((u.email || '').toLowerCase() !== ERLAUBTE_MAIL) {

function zeigeLogin(fehler = '', formular = true) {
  document.body.classList.add('gesperrt');
  $('login-info').textContent = formular ? 'Bitte melde dich an.' : '';

async function anmelden() {
  const mail = $('l-mail').value.trim().toLowerCase(), pw = $('l-pw').value;
  if (mail !== ERLAUBTE_MAIL) return zeigeLogin('Diese E-Mail-Adresse hat keinen Zugang.');
  $('l-btn').disabled = true; $('l-btn').textContent = 'Anmelden …';
  try { await firebase.auth().signInWithEmailAndPassword(mail, pw); $('l-pw').value = ''; }
  catch (e) {
    const t = {
      'auth/invalid-credential': 'E-Mail oder Passwort ist falsch.', 'auth/wrong-password': 'E-Mail oder Passwort ist falsch.',
      'auth/user-not-found': 'E-Mail oder Passwort ist falsch.', 'auth/too-many-requests': 'Zu viele Versuche – bitte später erneut versuchen oder Passwort zurücksetzen.',
      'auth/network-request-failed': 'Keine Internetverbindung.'

async function passwortReset() {

async function abmelden() {
  if (!confirm('Abmelden? Die Daten bleiben in der Cloud gespeichert, die Kopie auf diesem Gerät wird gelöscht.')) return;
  clearTimeout(cloud.timer);
  try { await cloudSchreiben(); } catch (e) { /* Schreibvorgang wartet offline weiter */ }
  cloudStop();
  await firebase.auth().signOut();
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = migrate({}); render();
}
function cloudStop() { cloud.unsub.forEach(f => f()); cloud.unsub = []; cloud.user = null; cloud.synced = {}; cloudStatus('aus'); }

async function cloudLaden() {
  cloudStatus('laedt');
  const ref = nutzerRef();
  const [es, ps] = await Promise.all([ref.collection('daten').doc('einstellungen').get(), ref.collection('projekte').get()]);
  if (es.exists || !ps.empty) {
    const projekte = ps.docs.map(x => JSON.parse(x.data().json));
    // Projekte, die nur auf diesem Gerät existieren (z.B. vor der Anmeldung erfasst), bleiben erhalten
    state.projects.forEach(p => { if (!projekte.some(x => x.id === p.id)) projekte.push(p); });
    state = migrate({ settings: es.exists ? JSON.parse(es.data().json) : state.settings, projects: projekte });
    // Stand der Cloud merken, damit nur Abweichungen (lokale Projekte, Umstellungen aus migrate) hochgeladen werden
    cloud.synced = {};
    if (es.exists) cloud.synced[EINST] = es.data().json;
    ps.docs.forEach(x => cloud.synced[x.id] = x.data().json);
    speichereLokal();
    await cloudSchreiben();
  } else {
    await cloudSchreiben(true); // erste Anmeldung: Daten dieses Geräts hochladen
  }
  cloudStatus('ok');
}
function cloudPlanen() {
  if (!cloud.user) return;
  clearTimeout(cloud.timer);
  cloudStatus('speichert');
  cloud.timer = setTimeout(() => cloudSchreiben().catch(e => cloudStatus('fehler', e.message)), 800);
}
async function cloudSchreiben(alles) {
  if (!cloud.user) return;
  const ref = nutzerRef(), batch = cloud.db.batch(), jetzt = firebase.firestore.FieldValue.serverTimestamp();
  const neu = { [EINST]: JSON.stringify(state.settings) };
  state.projects.forEach(p => neu[p.id] = JSON.stringify(p));
  let n = 0;
  Object.entries(neu).forEach(([id, json]) => {
    if (!alles && cloud.synced[id] === json) return;
    if (json.length > 950000) { toast(id === EINST ? 'Einstellungen zu gross für die Cloud – bitte ein kleineres Logo verwenden.' : 'Ein Projekt ist zu gross für die Cloud (Unterschrift/Bilder verkleinern).'); return; }
    batch.set(id === EINST ? ref.collection('daten').doc('einstellungen') : ref.collection('projekte').doc(id), { json, geaendert: jetzt });
    n++;
  });
  Object.keys(cloud.synced).forEach(id => { if (!(id in neu)) { batch.delete(ref.collection('projekte').doc(id)); n++; } });
  if (!n) return cloudStatus('ok');
  cloud.synced = neu; // Firestore puffert die Änderungen auch offline zuverlässig
  cloudStatus(navigator.onLine ? 'speichert' : 'offline');
  await batch.commit();
  cloudStatus('ok');
}
// Änderungen von anderen Geräten übernehmen
function cloudAbonnieren() {
  const ref = nutzerRef();
  const anwenden = () => { speichereLokal(); if ($('dlg').open) cloud.spaeter = true; else render(); };
  cloud.unsub.push(ref.collection('projekte').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    let geaendert = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed') {
        if (id in cloud.synced) { delete cloud.synced[id]; state.projects = state.projects.filter(p => p.id !== id); geaendert = true; }
        return;
      }
      const json = ch.doc.data().json;
      if (cloud.synced[id] === json) return; // eigene Änderung
      const p = JSON.parse(json), i = state.projects.findIndex(x => x.id === id);
      if (i >= 0) state.projects[i] = p; else state.projects.push(p);
      cloud.synced[id] = json; geaendert = true;
    });
    if (geaendert) { state = migrate(state); anwenden(); }
  }, e => cloudStatus('fehler', e.message)));
  cloud.unsub.push(ref.collection('daten').doc('einstellungen').onSnapshot(doc => {
    if (doc.metadata.hasPendingWrites || !doc.exists) return;
    const json = doc.data().json;
    if (cloud.synced[EINST] === json) return;
    state.settings = JSON.parse(json); cloud.synced[EINST] = json;
    state = migrate(state); anwenden();
  }, e => cloudStatus('fehler', e.message)));
  $('dlg').addEventListener('close', () => { if (cloud.spaeter) { cloud.spaeter = false; render(); } });
}
function cloudStatus(s, fehler = '') {
  cloud.status = s; cloud.fehler = fehler;
  if (s === 'ok') cloud.zuletzt = new Date();
  if ($('sideUser')) renderCloud();
}
window.addEventListener('online', () => { if (cloud.user) cloudSchreiben(true).catch(() => {}); });
window.addEventListener('offline', () => { if (cloud.user) cloudStatus('offline'); });
function cloudText() {
  return { aus: 'nicht angemeldet', laedt: 'lädt …', speichert: 'speichert …', offline: 'offline – wird später synchronisiert',
    fehler: 'Fehler beim Speichern', ok: 'synchronisiert' + (cloud.zuletzt ? ' ' + cloud.zuletzt.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : '') }[cloud.status];

function renderCloud() {
  const farbe = { ok: '#58d68d', speichert: '#5dade2', laedt: '#5dade2', offline: '#f5b041', fehler: '#e74c3c', aus: '#9aa5b1' }[cloud.status];

    ? `<span class="dot" style="background:${farbe}" title="Cloud: ${cloudText()}"></span><span class="side-txt"><b>${esc(cloud.user.email)}</b>☁ ${cloudText()}<br>
       <button class="sec sm" onclick="abmelden()">Abmelden</button></span>` : '';
}
