<style>
  :root {
    --bg: #ebeae6; --side: #f8f8f5; --card: #fff; --text: #18181b; --muted: #74747c; --line: #e8e7e2;
    --ink: #18181b; --brand: #18181b; --brand-dark: #000; --brand-2: #f1f0eb; --lime: #bfd62f; --bar: #93b81c;
    --danger: #c0392b; --ok: #2e8b3e; --warn: #c27c0e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .layout.collapsed { grid-template-columns: 64px 1fr; }
  .side-toggle { background: rgba(255,255,255,.12); border: none; width: 30px; height: 30px; padding: 0; border-radius: 6px; color: #fff; font-size: 16px; flex-shrink: 0; }
  .collapsed .brand { padding: 16px 0; justify-content: center; }
  .collapsed .brand-txt, .collapsed nav a span, .collapsed .side-txt { display: none; }
  .collapsed nav a { justify-content: center; padding: 10px 0; }
  .collapsed .side-foot { padding: 14px 0; text-align: center; }
  .collapsed .side-foot .dot { margin: 0; }
  main { padding: 24px 24px 60px; min-width: 0; max-width: 1200px; width: 100%; margin: 0 auto; }
  aside { background: var(--brand); color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { padding: 16px 12px 14px 18px; border-bottom: 1px solid rgba(255,255,255,.15); display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 66px; }
  .brand-txt { min-width: 0; }
  .brand b { display: block; font-size: 16px; }
  .brand span { font-size: 12px; opacity: .8; }
  nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #fff; text-decoration: none; opacity: .85; font-size: 15px; }
  nav a:hover { background: rgba(255,255,255,.1); opacity: 1; }
  nav a.active { background: #fff; color: var(--brand); opacity: 1; font-weight: 600; }
  nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding: 14px 18px; font-size: 12px; border-top: 1px solid rgba(255,255,255,.15); opacity: .9; }
  .side-foot button { margin-top: 6px; background: #fff; color: var(--brand); border-color: #fff; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 22px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; color: var(--text); }
  input:disabled { background: #f1f3f6; color: var(--muted); }
  textarea { min-height: 60px; resize: vertical; }
  input[type=color] { padding: 2px; height: 38px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); margin: 0; }
  .check input { width: auto; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border: 1px solid var(--brand); background: var(--brand); color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  button.sec { background: #fff; color: var(--brand); }
  button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button.sm { padding: 4px 9px; font-size: 13px; }
  button:hover { filter: brightness(1.08); }
  button.plus { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 26px; line-height: 1; box-shadow: 0 3px 10px rgba(0,85,140,.3); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f8fafc; }
  .table-wrap { overflow-x: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; flex-shrink: 0; }
  .pnum { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-2); display: inline-block; padding: 2px 8px; border-radius: 99px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; display: inline-block; }
  .b-laufend { background: #e3f4e8; color: var(--ok); } .b-geplant { background: var(--brand-2); color: var(--brand); }
  .b-abgeschlossen { background: #eceff3; color: var(--muted); } .b-leer { background: #fdf2e0; color: var(--warn); }
  .tag-int { font-size: 11px; background: var(--brand); color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .tag-sub { font-size: 11px; background: #fdf2e0; color: #9a5b00; border: 1px solid #f3d9a8; padding: 0 6px; border-radius: 4px; margin-left: 6px; }
  .tag-ext { font-size: 11px; background: #fff; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; margin-left: 6px; }
  .tag-pl { font-size: 11px; background: #fdecea; color: var(--danger); padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .tag-warn { font-size: 11px; background: var(--danger); color: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-left: 6px; }
  .g-pl { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; transform: translateX(-3px); z-index: 2; }
  .cal-pl { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--danger); border-radius: 3px; padding: 0 4px; margin-left: 3px; vertical-align: 1px; cursor: pointer; max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: none; color: var(--muted); border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 14px; }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  /* Projekte */
  .projects { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .pcard { border: 1px solid var(--line); border-left: 5px solid var(--c, var(--brand)); border-radius: 10px; padding: 14px; background: #fff; cursor: pointer; transition: box-shadow .15s; }
  .pcard:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  /* Dashboard */
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi b { font-size: 26px; display: block; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .next { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; border: none; }
  .next .muted { color: rgba(255,255,255,.8); }
  .next .big { font-size: 24px; font-weight: 700; margin: 6px 0 2px; }
  .next .when { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
  .next .when div b { display: block; font-size: 17px; }
  .next button { background: #fff; color: var(--brand); border-color: #fff; margin-top: 14px; }
  .cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress div { height: 100%; background: var(--ok); }
  .li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .li:last-child { border-bottom: none; }
  .li .date { width: 86px; font-size: 13px; color: var(--muted); flex-shrink: 0; }
  /* Terminplan (Gantt im Tagesraster) */
  .xg { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .xg-inner { position: relative; width: max-content; }
  .xg-row { display: flex; border-bottom: 1px solid #e8ecf1; min-height: 32px; }
  .xg-left { position: sticky; left: 0; z-index: 3; display: grid; grid-template-columns: 1fr 100px 80px 80px; width: 480px; flex-shrink: 0; background: #fff; border-right: 2px solid var(--line); font-size: 13px; }
  .xg-left > div { padding: 5px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
  .xg-row.task .xg-left { cursor: pointer; }
  .xg-row.task .xg-left > div:first-child { padding-left: 22px; }
  .xg-row.task:hover .xg-left { filter: brightness(.97); }
  .xg-track { position: relative; flex-shrink: 0; }
  .xg-head { background: #2c3440; color: #fff; }
  .xg-head .xg-left { background: #2c3440; color: #fff; font-weight: 600; font-size: 12px; border-right-color: #2c3440; }
  .xg-mon { position: absolute; top: 0; height: 22px; padding: 4px 6px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; color: var(--lime); border-left: 1px solid rgba(255,255,255,.35); border-bottom: 1px solid rgba(255,255,255,.12); }
  .xg-wk { position: absolute; top: 22px; height: 22px; border-left: 1px solid rgba(255,255,255,.25); padding: 4px 5px; white-space: nowrap; overflow: hidden; font-size: 11px; }
  .xg-day { position: absolute; top: 44px; height: 26px; text-align: center; font-size: 10px; line-height: 1.15; padding-top: 2px; color: #dfe5eb; border-left: 1px solid rgba(255,255,255,.08); }
  .xg-day.we { color: #8a96a3; }
  .xg-group .xg-left > div { font-weight: 700; }
  .xg-bar { position: absolute; top: 8px; height: 16px; border-radius: 3px; overflow: hidden; min-width: 4px; }
  .xg-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.3); }
  .xg-sum { position: absolute; top: 13px; height: 6px; border-radius: 3px; opacity: .55; }
  .xg-ms { position: absolute; top: 9px; width: 13px; height: 13px; transform: rotate(45deg); }
  .xg-pl { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; z-index: 2; }
  .xg-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
  .prog { height: 6px; background: #e3e7ec; border-radius: 3px; overflow: hidden; display: inline-block; width: 40px; vertical-align: middle; margin-right: 6px; }
  .prog div { height: 100%; background: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--brand); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 10px; font-size: 13px; background: #fff; color: var(--brand); }
  .seg button.on { background: var(--brand); color: #fff; }
  /* Checkliste */
  .ck-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-bottom: 1px solid #eef1f5; }
  .ck-row:last-child { border-bottom: none; }
  .ck-row input[type=checkbox] { width: 18px; height: 18px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--ok); cursor: pointer; }
  .ck-row.done .ck-txt > span:first-child { color: var(--muted); text-decoration: line-through; text-decoration-color: #b8c0ca; }
  .ck-row.lvl0 .ck-txt > span:first-child { font-weight: 600; }
  .ck-txt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .ck-txt input[type=date] { padding: 3px 6px; width: 150px; }
  .ck-am { font-size: 11px; color: var(--ok); }
  .ck-notiz { flex-basis: 100%; font-size: 12px; color: var(--muted); background: #f8fafc; border-left: 3px solid var(--line); padding: 3px 8px; white-space: pre-wrap; }
  .ck-btn { background: none; border: none; color: var(--muted); padding: 0 4px; font-size: 14px; }
  .ck-btn:hover { color: var(--brand); }
  .ck-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ck-phase.complete h3::after { content: ' ✓'; color: var(--ok); }
  textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; min-height: 420px; line-height: 1.45; }
  /* Kalender */
  .cal { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8fafc; border-bottom: 1px solid var(--line); }
  .cal-head div { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); min-height: 96px; }
  .cal-week:last-child { border-bottom: none; }
  .cal-day { grid-row: 1 / -1; border-right: 1px solid var(--line); }
  .cal-day:nth-child(14n-1) { border-right: none; }
  .cal-day.we { background: #fafbfc; }
  .cal-num { grid-row: 1; padding: 4px 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; min-width: 0; }
  .cal-num.out { color: #b8c0ca; }
  .cal-num.today span { background: var(--danger); color: #fff; border-radius: 99px; padding: 1px 6px; font-weight: 700; }
  .cal-bar { z-index: 1; margin: 2px 3px; height: 21px; line-height: 21px; font-size: 11.5px; color: #fff; padding: 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 500; }
  .cal-bar:hover { filter: brightness(1.1); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  dialog { border: none; border-radius: 12px; padding: 22px; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20,30,40,.45); }
  .note { background: #fdf2e0; border: 1px solid #f3d9a8; color: #7a5300; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  /* ---------- Look: hell, weich, abgerundet ---------- */

  .layout { gap: 14px; padding: 14px; }

  .collapsed .nav-sec { display: none; }

// Gut unterscheidbare Farben für automatische Vorschläge
const FARBEN = ['#00558c', '#e67e22', '#16a085', '#8e44ad', '#c0392b', '#d4a017', '#2c7be5', '#27ae60', '#e84393', '#8d6e63',
  '#2c3e50', '#5dade2', '#7f8c8d', '#f39c12', '#1abc9c', '#9b59b6', '#a93226', '#6c5ce7', '#00b894', '#b7950b', '#e17055', '#0984e3', '#6d4c41', '#fd79a8'];
function freieFarbe(belegt) {
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const abstand = (a, b) => { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };
  const frei = c => belegt.every(b => abstand(c, b) > 70);
  const f = FARBEN.find(frei);
  if (f) return f;
  // alle Vorschläge belegt: zufällige Farbe mit möglichst grossem Abstand
  let best = '#000000', bestD = -1;
  for (let i = 0; i < 60; i++) {
    const c = '#' + [0, 0, 0].map(() => Math.floor(40 + Math.random() * 180).toString(16).padStart(2, '0')).join('');
    const d = Math.min(...belegt.map(b => abstand(c, b)));
    if (d > bestD) { best = c; bestD = d; }
  }
  return best;
}

// Gruss und Signatur stehen bereits im Mailprogramm; ältere Vorlagen werden beim Laden gekürzt
const ohneGruss = t => String(t || '').replace(/\n\s*(Freundliche Grüsse|Danke und Gruss)\b[\s\S]*$/, '').trimEnd();

// eine Zeile pro Eintrag; Grundlage für Checkliste und Editor
function zeilenAusText(text) {
  const flags = (s, z) => s.replace(/\[(datum|oder|!|mail:[^\]]*|dok:[^\]]*)\]/gi, (m, f) => {
    f = f.toLowerCase();
    if (f === 'datum') z.datum = true; else if (f === 'oder') z.oder = true; else if (f === '!') z.wichtig = true;
    else if (f.startsWith('mail:')) z.mail = m.slice(6, -1).trim(); else z.dok = m.slice(5, -1).trim().toLowerCase();
    return '';
  }).replace(/\s+/g, ' ').trim();
  return String(text || '').split('\n').filter(l => l.trim()).map(raw => {
    if (raw.trim().startsWith('#')) { const z = { typ: 'phase', wichtig: false }; z.text = flags(raw.trim().replace(/^#+\s*/, ''), z); return z; }
    const z = { typ: 'item', lvl: Math.floor(raw.replace(/\t/g, '  ').match(/^ */)[0].length / 2), datum: false, oder: false, wichtig: false, mail: '', dok: '' };
    z.text = flags(raw.trim(), z);
    return z;
  });
}
function textAusZeilen(lines) {
  return lines.filter(z => z.text.trim()).map(z => z.typ === 'phase' ? '\n# ' + z.text.trim() + (z.wichtig ? ' [!]' : '')
    : '  '.repeat(z.lvl) + z.text.trim() + (z.datum ? ' [datum]' : '') + (z.oder ? ' [oder]' : '') + (z.wichtig ? ' [!]' : '')
      + (z.mail ? ` [mail: ${z.mail}]` : '') + (z.dok ? ` [dok: ${z.dok}]` : '')).join('\n').trim();
}
// übernimmt [mail: …], [dok: …] und [!] aus der Standardvorlage für Phasen und Punkte mit gleichem Text und gleicher Position
function flagsErgaenzen(text) {
  const std = new Map(), stdPh = new Map();
  const walk = n => { std.set(n.key, n); n.children.forEach(walk); };
  parseCheckliste(CHECKLISTE_VORLAGE).forEach(ph => { stdPh.set(ph.titel.toLowerCase(), ph); ph.items.forEach(walk); });
  let phase = 'Allgemein';
  const stack = [], lines = zeilenAusText(text);
  lines.forEach(z => {
    if (z.typ === 'phase') { phase = z.text; stack.length = 0; if (stdPh.get(phase.toLowerCase())?.wichtig) z.wichtig = true; return; }
    while (stack.length > z.lvl) stack.pop();
    const s = std.get([phase, ...stack, z.text].join(' › ').toLowerCase());
    if (s) { z.mail = z.mail || s.mail; z.dok = z.dok || s.dok; z.wichtig = z.wichtig || s.wichtig; }
    stack.push(z.text);
  });
  return textAusZeilen(lines);
}
// Zeilen mit eindeutigem Schlüssel (Phase › Elternpunkte › Text), wie in parseCheckliste
function zeilenMitKey(text) {
  let phase = 'Allgemein';
  const stack = [];
  return zeilenAusText(text).map(z => {
    if (z.typ === 'phase') { phase = z.text; stack.length = 0; return { ...z, key: 'phase:' + phase.toLowerCase() }; }
    while (stack.length > z.lvl) stack.pop();
    const key = [phase, ...stack, z.text].join(' › ').toLowerCase();
    stack.push(z.text);
    return { ...z, key };
  });
}
// Änderungen der Vorlage (alt → neu) auf die Checkliste eines Projekts übertragen.
// Projektspezifische Anpassungen bleiben: im Projekt entfernte Punkte kommen nicht zurück, eigene Punkte bleiben.
// Ohne alt werden nur fehlende Punkte der Vorlage ergänzt.
function vorlageUebertragen(projText, altText, neuText) {
  const N = zeilenMitKey(neuText), A = altText == null ? null : zeilenMitKey(altText);
  const imAlt = new Map((A || []).map(z => [z.key, z])), imNeu = new Set(N.map(z => z.key));
  let L = zeilenMitKey(projText);
  if (A) {
    const weg = A.filter(z => !imNeu.has(z.key)).map(z => z.key);
    L = L.filter(z => !weg.some(k => z.key === k || z.key.startsWith((k.startsWith('phase:') ? k.slice(6) : k) + ' › ')));
    N.forEach(n => {
      const a = imAlt.get(n.key), z = a && L.find(x => x.key === n.key);
      if (z) ['datum', 'oder', 'wichtig', 'mail', 'dok'].forEach(f => { if ((a[f] || '') !== (n[f] || '') && (z[f] || '') === (a[f] || '')) z[f] = n[f]; });
    });
  }
  N.forEach((n, i) => {
    if (L.some(z => z.key === n.key) || imAlt.has(n.key)) return;
    // hinter dem vorherigen Eintrag der Vorlage einfügen (nach dessen Unterpunkten)
    let pos = -1;
    for (let j = i - 1; j >= 0 && pos < 0; j--) pos = L.findIndex(z => z.key === N[j].key);
    let k = pos + 1;
    if (n.typ === 'phase') { while (k < L.length && L[k].typ !== 'phase') k++; }
    else if (pos >= 0 && L[pos].typ === 'item' && n.lvl <= L[pos].lvl) { while (k < L.length && L[k].typ === 'item' && L[k].lvl > n.lvl) k++; }
    L.splice(k, 0, { ...n });
  });
  return textAusZeilen(L);
}
function parseCheckliste(text) {
  const phasen = [], stack = [];
  zeilenAusText(text).forEach(z => {
    if (z.typ === 'phase') { phasen.push({ titel: z.text, wichtig: z.wichtig, items: [] }); stack.length = 0; return; }
    if (!phasen.length) phasen.push({ titel: 'Allgemein', items: [] });
    const ph = phasen[phasen.length - 1];
    while (stack.length > z.lvl) stack.pop();
    const parent = stack[stack.length - 1];
    const node = { ...z, key: [ph.titel, ...stack.map(n => n.text), z.text].join(' › ').toLowerCase(), children: [],
      label: [...stack.slice(-1).map(n => n.text), z.text].join(' › ') };
    (parent ? parent.children : ph.items).push(node);
    stack.push(node);
  });
  return phasen;
}
function chkDone(p, n) {
  const st = p.chk[n.key] || {};
  if (st.ok || (n.datum && st.datum)) return true;
  if (!n.children.length) return false;
  return n.oder ? n.children.some(c => chkDone(p, c)) : n.children.every(c => chkDone(p, c));
}
// gezählt werden die Hauptpunkte jeder Phase
function chkStats(p) {
  const ph = parseCheckliste(p.checkliste);
  let done = 0, total = 0;
  ph.forEach(x => x.items.forEach(n => { total++; if (chkDone(p, n)) done++; }));
  return { done, total, ph, pct: total ? Math.round(done / total * 100) : 0 };
}

function migrate(d) {
  d.projects = d.projects || [];
  d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  if (!Array.isArray(d.settings.standardGewerke)) d.settings.standardGewerke = stdKopie();
  if (typeof d.settings.checklisteVorlage !== 'string') d.settings.checklisteVorlage = CHECKLISTE_VORLAGE;
  if (!Array.isArray(d.settings.mailvorlagen)) d.settings.mailvorlagen = MAIL_VORLAGEN.map(m => ({ ...m }));
  // Version 3: ältere Checklisten bekommen Mail-/Dokument-Verknüpfungen und "vor Baustart"-Markierungen der Standardvorlage,
  // Mailvorlagen enden ohne Gruss und Signatur
  if ((d.settings.chkVersion || 1) < 3) {
    d.settings.checklisteVorlage = flagsErgaenzen(d.settings.checklisteVorlage);
    d.projects.forEach(p => { if (typeof p.checkliste === 'string') p.checkliste = flagsErgaenzen(p.checkliste); });
    d.settings.mailvorlagen.forEach(m => m.text = ohneGruss(m.text));
    d.settings.chkVersion = 3;
  }
  // Version 4: Blitzschutzattest bekommt die LASOLTEC-Checkliste als Dokument
  if (d.settings.chkVersion < 4) {
    d.settings.checklisteVorlage = flagsErgaenzen(d.settings.checklisteVorlage);
    d.projects.forEach(p => { if (typeof p.checkliste === 'string') p.checkliste = flagsErgaenzen(p.checkliste); });
    d.settings.chkVersion = 4;
  }
  // Version 5: Meldewesen-Vorlage für TAG / IA und IBN
  if (d.settings.chkVersion < 5) {
    const neu = MAIL_VORLAGEN.find(m => m.name === 'TAG / IA einreichen');
    if (!d.settings.mailvorlagen.some(m => m.name === neu.name)) d.settings.mailvorlagen.unshift({ ...neu });
    const ibn = d.settings.mailvorlagen.find(m => m.name === 'IBN-Termin anfragen');
    if (ibn) Object.assign(ibn, { text: MELDEWESEN_TEXT, betreff: 'Meldewesen IBN {projektnummer} {projekt}' });
    d.settings.checklisteVorlage = flagsErgaenzen(d.settings.checklisteVorlage);
    d.projects.forEach(p => { if (typeof p.checkliste === 'string') p.checkliste = flagsErgaenzen(p.checkliste); });
    d.settings.chkVersion = 5;
  }
  d.projects.forEach((p, i) => {
    if (!p.farbe) p.farbe = PALETTE[i % PALETTE.length];
    if (typeof p.checkliste !== 'string') p.checkliste = d.settings.checklisteVorlage;
    if (!p.chk) p.chk = {};
    delete p.bauherr;
    p.gewerke.forEach(g => { if (!g.art) g.art = g.eigen ? 'intern' : 'extern'; g.eigen = g.art === 'intern'; });
  });
  crmAufbauen(d);
  // Standard-Gewerke gelten immer für alle Projekte (fehlende werden ergänzt)
  stdAbgleich(d);
  // Version 6: Punkte, die nach Projektstart in die Vorlage kamen, in bestehenden Projekten ergänzen
  if (d.settings.chkVersion < 6) {
    d.projects.forEach(p => p.checkliste = vorlageUebertragen(p.checkliste, null, d.settings.checklisteVorlage));
    d.settings.chkVersion = 6;
  }
  return d;
}
function neueId() { return Math.random().toString(36).slice(2, 10); }
// CRM einmalig aus den bisherigen Kontaktdaten der Gewerke aufbauen und verknüpfen
function crmAufbauen(d) {
  if (!Array.isArray(d.settings.kontakte)) d.settings.kontakte = [];
  d.projects.forEach(p => { if (!Array.isArray(p.personen)) p.personen = []; });
  if ((d.settings.crmVersion || 0) >= 1) return;
  const K = d.settings.kontakte, kl = s => (s || '').trim().toLowerCase();
  const anlegen = g => {
    const intern = g.eigen || g.art === 'intern';
    const daten = { name: g.kontakt || '', firma: intern ? '' : (g.firma || ''), telefon: g.telefon || '', email: g.email || '', adresse: intern ? '' : (g.adresse || '') };
    if (!(daten.name || daten.firma || daten.email || daten.telefon)) return undefined;
    let c = K.find(k => kl(k.name) === kl(daten.name) && kl(k.firma) === kl(daten.firma) && kl(k.email) === kl(daten.email));
    if (!c) { c = { id: neueId(), art: g.art || (intern ? 'intern' : 'extern'), gewerk: g.name, notiz: '', ...daten }; K.push(c); }
    return c.id;
  };
  d.settings.standardGewerke.forEach(s => { if (!s.crm) s.crm = anlegen(s); });
  d.projects.forEach(p => p.gewerke.forEach(g => { if (!g.crm) g.crm = anlegen(g); }));
  d.settings.crmVersion = 1;
}
function gwSchluessel(g) { return (g.name + '|' + (g.art || (g.eigen ? 'intern' : 'extern'))).toLowerCase(); }
// verknüpft Projekt-Gewerke mit ihrem Standard-Gewerk (g.std = sid) und ergänzt fehlende in jedem Projekt
function stdAbgleich(d) {
  const liste = d.settings.standardGewerke;
  let neu = 0;
  liste.forEach(s => { if (!s.sid) s.sid = neueId(); });
  d.projects.forEach(p => {
    p.gewerke.forEach(g => {
      if (g.std) return;
      const s = liste.find(s => gwSchluessel(s) === gwSchluessel(g) && !p.gewerke.some(x => x.std === s.sid));
      if (s) { g.std = s.sid; g.fix = true; }
    });
    liste.forEach(s => {
      if (p.gewerke.some(g => g.std === s.sid)) return;
      const { sid, ...rest } = s;
      p.gewerke.push({ firma: '', adresse: '', kontakt: '', email: '', ...rest, id: neueId(), std: sid, fix: true, eigen: s.art === 'intern' });
      neu++;
    });
  });
  return neu;
}

// ---------- Datum ----------
const DAY = 86400000;
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoOf = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / DAY);
const fmt = s => s ? s.split('-').reverse().join('.') : '';
const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const fmtLong = s => s ? WT[toDate(s).getUTCDay()] + ', ' + fmt(s) : '';

function kw(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / DAY + 1) / 7);
}
function arbeitstage(a, b) {
  let n = 0;
  for (let d = toDate(a); d <= toDate(b); d = addDays(d, 1)) { const w = d.getUTCDay(); if (w && w !== 6) n++; }
  return n;
}
function relTage(iso) {
  const n = diffDays(todayIso(), iso);
  return n === 0 ? 'heute' : n === 1 ? 'morgen' : n > 0 ? `in ${n} Tagen` : `vor ${-n} Tagen`;
}
// Zeitachse: Montag der ersten Woche bis Sonntag der letzten Woche
function zeitachse(termine) {
  if (!termine.length) return null;
  const min = Math.min(...termine.map(t => toDate(t.start)));
  const max = Math.max(...termine.map(t => toDate(t.ende)));
  const s = new Date(min); s.setUTCDate(s.getUTCDate() - ((s.getUTCDay() + 6) % 7));
  const e = new Date(max); e.setUTCDate(e.getUTCDate() + (7 - (e.getUTCDay() || 7)));
  const tage = Math.round((e - s) / DAY) + 1;
  const wochen = [];
  for (let i = 0; i < tage; i += 7) wochen.push(addDays(s, i));
  return { start: s, tage, wochen, pos: iso => (toDate(iso) - s) / DAY / tage };
}

// Kalenderdatei (.ics) für Outlook / Google / Apple
function icsDownload(pairs) {
  const tx = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const ev = pairs.map(([pid, tid]) => {
    const p = findP(pid), t = p.termine.find(x => x.id === tid), g = gewerk(p, t.gewerkId);
    const d = t.start.replace(/-/g, '');
    let when;
    const zeit = t.plZeit || t.zeitVon;
    if (zeit) {
      const [h, m] = zeit.split(':').map(Number), e = h * 60 + m + 120;
      const hm = n => String(Math.floor(n / 60) % 24).padStart(2, '0') + String(n % 60).padStart(2, '0');
      when = [`DTSTART:${d}T${hm(h * 60 + m)}00`, `DTEND:${d}T${hm(Math.min(e, 23 * 60 + 59))}00`];
    } else {
      when = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${isoOf(addDays(toDate(t.start), 1)).replace(/-/g, '')}`];
    }
    return ['BEGIN:VEVENT', `UID:${t.id}-${p.id}@projekte`, `DTSTAMP:${stamp}`, ...when,
      `SUMMARY:${tx(`${p.nummer} ${p.name}: ${t.titel}`)}`, `LOCATION:${tx(p.ort)}`,
      `DESCRIPTION:${tx(`Gewerk: ${g.name} (${ARTEN[artOf(g)]}${g.firma && !g.eigen ? ', ' + g.firma : ''})\nTermin: ${fmt(t.start)} – ${fmt(t.ende)}${t.bemerkung ? '\n' + t.bemerkung : ''}`)}`,
      'END:VEVENT'].join('\r\n');
  });
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Projekte//Terminplan//DE', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = pairs.length === 1 ? `Einsatz_${findP(pairs[0][0]).nummer}.ics` : `Meine_Einsaetze_${todayIso()}.ics`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- DOM-Abgleich: nur Geändertes anfassen, damit nichts flackert und Übergänge laufen ----------
function morphHtml(el, html) {
  const neu = el.cloneNode(false);
  neu.innerHTML = html;
  morphKinder(el, neu);
}
// data-form: wechselt der Wert, wird das Formular neu aufgebaut (z.B. nach dem Speichern leeren)
const gleichArt = (a, b) => a.nodeType === b.nodeType && (a.nodeType !== 1 || (a.tagName === b.tagName && (a.id || '') === (b.id || '')
  && a.getAttribute('data-form') === b.getAttribute('data-form')));
function morphKinder(alt, neu) {
  const kinder = [...neu.childNodes];
  kinder.forEach((nk, i) => {
    const ak = alt.childNodes[i];
    if (!ak) alt.appendChild(nk);
    else if (!gleichArt(ak, nk)) alt.replaceChild(nk, ak);
    else if (nk.nodeType === 1) morphElement(ak, nk);
    else if (ak.nodeValue !== nk.nodeValue) ak.nodeValue = nk.nodeValue;

function morphElement(alt, neu) {

  // Formularwerte vor dem Abgleich der Kinder merken (Optionen werden dabei verschoben)
  // Eingaben des Nutzers bleiben erhalten, solange sich der gespeicherte Wert nicht geändert hat
  const selAlt = tag === 'SELECT' ? [...alt.options].findIndex(o => o.hasAttribute('selected')) : -1;
  const selIdx = tag === 'SELECT' ? [...neu.options].findIndex(o => o.hasAttribute('selected')) : -1;
  const taAlt = tag === 'TEXTAREA' ? alt.textContent : null, taWert = tag === 'TEXTAREA' ? neu.textContent : null;
  const wertAlt = alt.getAttribute('value'), wertNeu = neu.getAttribute('value');
  for (const a of [...alt.attributes]) if (!neu.hasAttribute(a.name)) alt.removeAttribute(a.name);
  for (const a of [...neu.attributes]) if (alt.getAttribute(a.name) !== a.value) alt.setAttribute(a.name, a.value);
  if (tag === 'TEXTAREA') { if (!fokus && taAlt !== taWert) { alt.textContent = taWert; alt.value = taWert; } return; }
  morphKinder(alt, neu);

    if (alt.type === 'checkbox' || alt.type === 'radio') alt.checked = neu.hasAttribute('checked');
    else if (alt.type !== 'file' && !fokus && wertAlt !== wertNeu) alt.value = wertNeu ?? '';
  } else if (tag === 'SELECT' && !fokus && selAlt !== selIdx) alt.selectedIndex = selIdx >= 0 ? selIdx : 0;
}
// Zahlen beim Öffnen einer Ansicht hochzählen
function zaehlerStarten(wurzel) {
  if (wenigBewegung()) return;
  wurzel.querySelectorAll('[data-zahl]').forEach(el => {
    const ziel = +el.dataset.zahl, suffix = el.dataset.suffix || '', t0 = performance.now();
    if (!ziel) return;
    const schritt = t => {
      const k = Math.min(1, (t - t0) / 750), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(ziel * e) + suffix;
      if (k < 1) requestAnimationFrame(schritt);
    };
    el.textContent = '0' + suffix;
    requestAnimationFrame(schritt);
    setTimeout(() => { el.textContent = ziel + suffix; }, 900); // falls der Browser keine Frames zeichnet (Hintergrund)
  });
}

// Halbkreis-Anzeige aus Strichen
function gauge(pct, label) {
  let s = '';
  for (let i = 0, n = 40; i <= n; i++) {
    const a = Math.PI * (1 - i / n), c = Math.cos(a), sn = Math.sin(a);
    const an = i / n * 100 <= pct && pct > 0;
    s += `<line class="g-l ${an ? 'an' : ''}" style="--i:${i}" x1="${(100 + 68 * c).toFixed(1)}" y1="${(100 - 68 * sn).toFixed(1)}" x2="${(100 + 86 * c).toFixed(1)}" y2="${(100 - 86 * sn).toFixed(1)}"
      stroke="${an ? '#18181b' : '#d6d4cb'}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  return `<svg class="gauge" viewBox="0 0 200 112" width="230" role="img" aria-label="${label} ${pct}%">${s}
    <text x="100" y="88" text-anchor="middle" font-size="28" font-weight="600" fill="#18181b" font-family="Inter, sans-serif" data-zahl="${pct}" data-suffix="%">${pct}%</text>
    <text x="100" y="106" text-anchor="middle" font-size="11" fill="#74747c" font-family="Inter, sans-serif">${label}</text></svg>`;
}

// Punkte, die vor Baustart erledigt sein müssen: alle Hauptpunkte der Phasen mit [!] (Planung bis Beschaffung)
// sowie einzeln mit [!] markierte Punkte in anderen Phasen
function offenWichtig(p) {
  const out = [];
  const walk = (n, pfad) => {
    if (n.wichtig && !chkDone(p, n)) out.push({ n, pfad });
    n.children.forEach(c => walk(c, [...pfad, n.text]));
  };
  parseCheckliste(p.checkliste).forEach(ph => ph.items.forEach(n => {
    if (ph.wichtig) { if (!chkDone(p, n)) out.push({ n, pfad: [ph.titel] }); }
    else walk(n, [ph.titel]);
  }));
  return out;
}

function freigabe(p) {

  return { s, offen, tage, kritisch: offen.length > 0 && tage !== null && tage <= FREIGABE_TAGE && (s.ende >= todayIso()) };
}

        ${offen.length > 8 ? `<div class="muted" style="padding:4px 0 0 28px;cursor:pointer" onclick="ui.tab='checkliste';nav('projekt/${p.id}')">… und ${offen.length - 8} weitere</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}
function viewDashboard() {
  const today = todayIso();
  const mit = state.projects.map(p => ({ p, s: span(p) })).filter(x => x.s);
  const geplant = mit.filter(x => x.s.start > today).sort((a, b) => a.s.start.localeCompare(b.s.start));
  const laufend = mit.filter(x => x.s.start <= today && x.s.ende >= today).sort((a, b) => a.s.ende.localeCompare(b.s.ende));
  const ohne = state.projects.length - mit.length;
  const next = geplant[0];
  const einsaetze = meineEinsaetze().filter(e => e.t.start >= today);
  const proTag = {};
  einsaetze.forEach(e => proTag[e.t.start] = (proTag[e.t.start] || 0) + 1);
  const in30 = einsaetze.filter(e => diffDays(today, e.t.start) <= 30).length;
  const termine =state.projects.flatMap(p => p.termine.filter(t => t.ende >= today).map(t => ({ t, p, g: gewerk(p, t.gewerkId) })))
    .sort((a, b) => a.t.start.localeCompare(b.t.start)).slice(0, 8);

  const nextCard = next ? `
    <div class="card next" style="cursor:pointer" onclick="openProjekt('${next.p.id}')" title="Projekt öffnen"><div class="next-grid"><div>
      <div class="muted">Nächstes Projekt</div>
      <div class="big">${esc(next.p.nummer)} · ${esc(next.p.name)}</div>
      <div class="muted">${esc(next.p.ort || '')}</div>
      <div class="when">

        <div><span class="muted">Ende</span><b>${fmtLong(next.s.ende)}</b><span class="muted">KW ${kw(toDate(next.s.ende))}</span></div>
        <div><span class="muted">Dauer</span><b>${Math.ceil((diffDays(next.s.start, next.s.ende) + 1) / 7)} Wochen</b><span class="muted">${arbeitstage(next.s.start, next.s.ende)} Arbeitstage</span></div>
        <div><span class="muted">Checkliste</span><b>${chkStats(next.p).done} / ${chkStats(next.p).total}</b><span class="muted">${chkStats(next.p).total - chkStats(next.p).done} Punkte offen</span></div>
      </div>
      ${freigabe(next.p).kritisch ? `<div class="rot-txt" style="margin-top:10px;font-weight:600">⚠ ${freigabe(next.p).offen.length} Punkte vor Baustart offen – Baustart gefährdet</div>` : ''}
      <button onclick="event.stopPropagation();openProjekt('${next.p.id}')">Projekt öffnen</button>
    </div>${gauge(chkStats(next.p).pct, 'Checkliste erledigt')}</div></div>` : `

      <div class="muted">Nächstes Projekt</div>
      <div class="big">Kein geplantes Projekt</div>
      <div class="muted">Lege ein Projekt an und erfasse Termine im Terminplan.</div>
      <button onclick="neuesProjektDialog()">+ Neues Projekt</button>
    </div>`;

  return `
  <div class="dash-head">
    <div>
      <div style="font-size:17px;margin-bottom:6px">Willkommen zurück, ${esc(S().name.split(' ')[0])}</div>

    </div>
    <div class="row">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="Projekt suchen…" onkeydown="if(event.key==='Enter'){ui.q=this.value;nav('projekte')}"></div>

  <div class="kpis">

        return `<div class="li" onclick="openProjekt('${p.id}')"><span class="swatch" style="background:${p.farbe}"></span>

        <div class="muted">${esc(p.nummer)} · ${esc(g.name)}</div></div></div>`).join('') : '<div class="empty">Keine anstehenden Termine.</div>'}

}

function viewUebersicht(p) {

    const i = chkKeys.push(n) - 1;
    return `<div class="of-item ${f.kritisch ? 'rot' : ''}"><input type="checkbox" onchange="chkSet('${p.id}',${i},true,this)" title="als erledigt markieren">
      <span>${esc(n.text)}<span class="muted"> · ${esc(pfad.slice(1).join(' › ') || pfad[0])}</span></span>
      ${n.mail ? `<button class="sec sm" onclick="mailDialog('${p.id}',${i})">✉ Mail</button>` : ''}</div>`;

  // Leute im Projekt: Projektleiter, Kunde, Gewerke mit Terminen, zusätzlich zugeordnete Personen
  const kunde = kontaktById(p.kundeId);
  const leute = [{ name: s.name, rolle: 'Projektleiter', firma: s.firma, tel: s.telefon, mail: s.email, farbe: 'var(--ink)' }];

  p.gewerke.map(x => gewerk(p, x.id)).filter(g => termine.some(t => t.gewerkId === g.id) && (g.kontakt || g.firma || g.email || g.telefon)).forEach(g => {
    if (g.crm) gezeigt.add(g.crm);
    leute.push({ name: g.kontakt || g.firma, rolle: g.name, firma: g.kontakt ? g.firma : '', tel: g.telefon, mail: g.email, farbe: g.farbe,
      aktion: effektiveVorlage(g) ? `<button class="sec sm" title="Mail an ${esc(g.name)}" onclick="gewerkMail('${p.id}','${g.id}')">✉</button>` : '' });
  });
  p.personen.map(kontaktById).filter(c => c && !gezeigt.has(c.id)).forEach(c => leute.push({ name: kontaktName(c), rolle: c.gewerk || (c.art === 'kunde' ? 'Kunde' : ARTEN[c.art]),
    firma: c.name ? kontaktFirma(c) : '', tel: c.telefon, mail: c.email, farbe: avatarFarbe(c),
    aktion: `<button class="ck-btn" title="Kontakt bearbeiten" onclick="kontaktDialog('${c.id}')">✎</button><button class="ck-btn" title="aus dem Projekt entfernen" onclick="personEntfernen('${p.id}','${c.id}')">✕</button>` }));
  return `
  <div class="ueb-grid">
    <div class="card">
      <div class="ck-head"><h3 style="margin:0">Bis Baustart offen</h3>
        ${f.offen.length ? `<span class="${f.kritisch ? 'tag-warn' : 'tag-sub'}">${f.kritisch ? 'Baustart gefährdet · ' : ''}${f.offen.length} offen</span>` : sp ? '<span class="tag-ok">✓ Baufreigabe</span>' : ''}</div>
      <div class="muted" style="margin-bottom:6px">${wann}</div>

      <div style="margin-top:10px"><a href="#" onclick="event.preventDefault();ui.tab='checkliste';render()">Zur ganzen Checkliste →</a></div>

// ---------- Checkliste ----------
let chkKeys = [];
// Eingeklappt-Zustand: ohne eigene Wahl ist ein Bereich zu, sobald er komplett erledigt ist
const istZu = (p, key, fertig) => (p.ckZu && key in p.ckZu) ? p.ckZu[key] : fertig;
function chkZu(pid, i) {
  const p = findP(pid), n = chkKeys[i];
  p.ckZu = p.ckZu || {};
  p.ckZu[n.key] = !istZu(p, n.key, n.fertig);
  save(); render();
}
function chkAlleZu(pid, zu) {
  const p = findP(pid), z = p.ckZu = {};
  parseCheckliste(p.checkliste).forEach(ph => { z['phase:' + ph.titel.toLowerCase()] = zu; ph.items.forEach(n => { if (n.children.length) z[n.key] = zu; }); });
  save(); render();
}
function viewCheckliste(p) {
  const { done, total, ph, pct } = chkStats(p);
  const sp = span(p), fg = freigabe(p);
  const pflicht = new Set(fg.offen.map(o => o.n.key));
  const node = (n, lvl) => {
    const st = p.chk[n.key] || {}, ok = chkDone(p, n);
    const auto = ok && !st.ok && !(n.datum && st.datum);
    if (ui.nurOffen && ok) return '';
    const i = chkKeys.push({ ...n, fertig: ok }) - 1;
    const zu = n.children.length && istZu(p, n.key, ok);
    const pfeil = n.children.length
      ? `<button class="ck-btn ck-pfeil" title="${zu ? 'aufklappen' : 'zuklappen'}" onclick="chkZu('${p.id}',${i})">${zu ? '▸' : '▾'}</button>` : '<span class="ck-pfeil"></span>';
    const sub = n.children.length ? `<span class="muted">${n.children.filter(c => chkDone(p, c)).length}/${n.children.length}${n.oder ? ' · eines davon' : ''}</span>` : '';
    const baustart = /baustart/i.test(n.text) && !st.datum && sp
      ? `<button class="sec sm" onclick="chkDatum('${p.id}',${i},'${sp.start}')">aus Terminplan: ${fmt(sp.start)}</button>` : '';
    const rot = fg.kritisch && pflicht.has(n.key);
    return `<div class="ck-row lvl${lvl} ${ok ? 'done' : ''} ${rot ? 'rot' : ''} ${ui.pop === n.key ? 'pop' : ''}" style="padding-left:${lvl * 28 + 4}px">
      ${pfeil}<input type="checkbox" ${ok ? 'checked' : ''} ${auto ? 'disabled title="Automatisch erledigt (Unterpunkte)"' : ''} onchange="chkSet('${p.id}',${i},this.checked,this)">
      <div class="ck-txt"><span>${esc(n.text)}</span>${sub}${rot ? '<span class="tag-warn">Baustart gefährdet</span>' : n.wichtig ? '<span class="tag-wichtig">vor Baustart</span>' : ''}
        ${n.mail ? `<button class="sec sm" onclick="mailDialog('${p.id}',${i})">✉ Mail</button>` : ''}
        ${DOKS[n.dok] ? `<button class="sec sm" onclick="${DOKS[n.dok].fn}('${p.id}')">📄 ${DOKS[n.dok].label}${DOKS[n.dok].hat(p) ? ' bearbeiten' : ' ausfüllen'}</button>` : ''}
        ${n.datum ? `<input type="date" value="${st.datum || ''}" onchange="chkDatum('${p.id}',${i},this.value)">` : ''}${baustart}
        ${st.ok && st.am ? `<span class="ck-am">✓ ${fmt(st.am)}</span>` : ''}

    await Promise.all([ladeScript('lasoltec-vorlage.js'), ladeScript(PDFLIB_URL)]);
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.load(Uint8Array.from(atob(window.LASOLTEC_PDF), c => c.charCodeAt(0)));

    const umbrechen = (txt, size, maxW) => sauber(txt).split('\n').flatMap(absatz => {
      const out = []; let z = '';
      absatz.split(/\s+/).filter(Boolean).forEach(w => {
        const t = z ? z + ' ' + w : w;

      <div class="row"><label style="margin:0">ab</label><input type="time" id="t-plzeit" value="${t?.plZeit || ''}" style="width:110px"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button onclick="speichereTermin('${p.id}')">${t ? 'Änderungen speichern' : 'Hinzufügen'}</button>

        <button class="sec sm" onclick="ui.ganttScroll=true;render()">Heute</button>
      </div>
    </div>
    ${termine.length ? gantt(p, termine) : '<div class="empty">Noch keine Termine erfasst.</div>'}
  </div>
  ${termine.length ? `<div class="card"><h3>Termine</h3><div class="table-wrap"><table>
    <tr><th>Gewerk</th><th>Tätigkeit</th><th>Start</th><th>Ende</th><th>AT</th><th>Fortschritt</th><th>Ich vor Ort</th><th>Bemerkung</th><th></th></tr>
    ${termine.map(x => { const g = gewerk(p, x.gewerkId); return `<tr>
      <td style="white-space:nowrap"><span class="swatch" style="background:${g.farbe}"></span>${esc(g.name)}${seiteTag(g)}</td>
      <td>${x.meilenstein ? '◆ ' : ''}${esc(x.titel)}</td>
      <td>${fmt(x.start)}${zeitTxt(x) ? `<div class="muted" style="font-size:12px;white-space:nowrap">🕒 ${zeitTxt(x)}</div>` : ''}</td><td>${fmt(x.ende)}</td>
      <td>${arbeitstage(x.start, x.ende)}</td>
      <td style="white-space:nowrap"><span class="prog"><div style="width:${x.fortschritt || 0}%"></div></span><small>${x.fortschritt || 0}%</small></td>
      <td>${x.pl ? `<span class="tag-pl">${fmt(x.start)}${x.plZeit ? ' ' + x.plZeit : ''}</span>` : ''}</td>
      <td class="muted">${esc(x.bemerkung)}</td>
      <td style="white-space:nowrap">${x.pl ? `<button class="sec sm" title="In Outlook / Kalender übernehmen" onclick="icsDownload([['${p.id}','${x.id}']])">📅</button> ` : ''}<button class="sec sm" onclick="ui.editTermin='${x.id}';render();scrollTo(0,0)">Bearbeiten</button>
        <button class="danger sm" onclick="loescheTermin('${p.id}','${x.id}')">✕</button></td></tr>`; }).join('')}
  </table></div></div>` : ''}`;
}

// Monate der Zeitachse (Tag-Index von/bis) mit Jahr, z.B. "November 2026"
function monatsAbschnitte(ax) {
  const out = [];
  let von = 0;
  for (let i = 1; i <= ax.tage; i++) {
    if (i === ax.tage || addDays(ax.start, i).getUTCDate() === 1) {
      const d0 = addDays(ax.start, von);
      out.push({ von, bis: i, text: `${MONATE[d0.getUTCMonth()]} ${d0.getUTCFullYear()}` });
      von = i;
    }
  }
  return out;
}
// ---------- Gewerk-Suche im Terminformular ----------
const gwLabel = g => [g.name, g.firma, g.kontakt].filter(Boolean).join(' · ');
let gwTreffer = [], gwAktiv = 0;
function gwListe(offen) {
  const L = $('gw-liste'), inp = $('t-gw-suche');
  if (!L || !inp) return;
  if (!offen) { L.hidden = true; return; }
  const p = findP(route().id), gewaehlt = $('t-gw').value;
  // ist ein Gewerk gewählt und der Text unverändert, alle zeigen
  const sel = gewaehlt && p.gewerke.some(g => g.id === gewaehlt) ? gewerk(p, gewaehlt) : null;
  const q = sel && inp.value === gwLabel(sel) ? '' : inp.value.trim().toLowerCase();
  const woerter = q.split(/\s+/).filter(Boolean);
  const passt = g => { const t = [g.name, g.firma, g.kontakt, g.telefon, g.email, g.adresse, ARTEN[artOf(g)]].join(' ').toLowerCase(); return woerter.every(w => t.includes(w)); };
  const hl = s => { let h = esc(s || ''); woerter.forEach(w => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  gwTreffer = [];
  let html = '';
  GW_ARTEN.forEach(([art, titel]) => {
    const liste = p.gewerke.map(g => gewerk(p, g.id)).filter(g => artOf(g) === art && passt(g));
    if (!liste.length) return;
    html += `<div class="gw-gruppe">${titel}</div>` + liste.map(g => {
      const i = gwTreffer.push(g.id) - 1;
      return `<div class="gw-opt ${g.id === gewaehlt ? 'gewaehlt' : ''}" data-i="${i}" onmousedown="event.preventDefault();gwWaehlen('${g.id}')">
        <span class="swatch" style="background:${g.farbe}"></span>
        <div style="min-width:0"><b>${hl(g.name)}</b>${g.firma ? ` <span class="muted">· ${hl(g.firma)}</span>` : ''}
          ${g.kontakt || g.telefon || g.email ? `<div class="muted klein">${[g.kontakt && '👤 ' + hl(g.kontakt), g.telefon && '☎ ' + hl(g.telefon), g.email && hl(g.email)].filter(Boolean).join(' · ')}</div>` : ''}</div></div>`;
    }).join('');
  });
  // Kontakte aus dem CRM, die in diesem Projekt noch kein Gewerk sind
  if (woerter.length) {
    const crm = S().kontakte.filter(c => c.art !== 'kunde' && !p.gewerke.some(g => g.crm === c.id) && woerter.every(w => kontaktText(c).includes(w))).sort(nachName).slice(0, 12);
    if (crm.length) html += `<div class="gw-gruppe">Aus Kontakten (CRM) hinzufügen</div>` + crm.map(c => {
      const i = gwTreffer.push('crm:' + c.id) - 1;
      return `<div class="gw-opt" data-i="${i}" onmousedown="event.preventDefault();gwAusKontakt('${c.id}')">
        <span class="avatar klein" style="background:${avatarFarbe(c)}">${initialen(kontaktName(c))}</span>
        <div style="min-width:0"><b>${hl(c.gewerk || c.firma || c.name)}</b> <span class="muted">· ${hl([c.firma, c.name].filter(Boolean).join(' · '))}</span>
          <div class="muted klein">${[c.telefon && '☎ ' + hl(c.telefon), c.email && hl(c.email)].filter(Boolean).join(' · ')}</div></div></div>`;
    }).join('');
  }
  const neuIdx = gwTreffer.push('__neu') - 1;
  html += `<div class="gw-opt gw-neu" data-i="${neuIdx}" onmousedown="event.preventDefault();gwNeu()">＋ Neues Gewerk${q ? ` «${esc(inp.value.trim())}»` : ''} anlegen</div>`;
  if (gwTreffer.length === 1) html = `<div class="muted" style="padding:10px 12px">Kein Gewerk gefunden.</div>` + html;
  L.innerHTML = html;
  gwAktiv = Math.min(gwAktiv, gwTreffer.length - 1);
  if (q) gwAktiv = 0;
  gwMarkieren();
  L.hidden = false;
}
function gwMarkieren() {
  document.querySelectorAll('#gw-liste .gw-opt').forEach(el => el.classList.toggle('aktiv', +el.dataset.i === gwAktiv));
  document.querySelector('#gw-liste .gw-opt.aktiv')?.scrollIntoView({ block: 'nearest' });
}
function gwTaste(e) {
  const L = $('gw-liste');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (L.hidden) return gwListe(true);
    gwAktiv = (gwAktiv + (e.key === 'ArrowDown' ? 1 : -1) + gwTreffer.length) % gwTreffer.length;
    gwMarkieren();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const id = gwTreffer[gwAktiv];
    if (id === '__neu') gwNeu(); else if (id && id.startsWith('crm:')) gwAusKontakt(id.slice(4)); else if (id) gwWaehlen(id);
  } else if (e.key === 'Escape') L.hidden = true;
}
function gwWaehlen(id) {
  const p = findP(route().id), g = p && p.gewerke.some(x => x.id === id) && gewerk(p, id);
  if (!g || !$('t-gw')) return;
  $('t-gw').value = id; $('t-gw-suche').value = gwLabel(g);
  $('gw-liste').hidden = true;
  $('t-titel').focus();
}
// CRM-Kontakt als Gewerk ins Projekt übernehmen und gleich auswählen
function gwAusKontakt(cid) {
  const p = findP(route().id), c = kontaktById(cid);
  const g = { id: uid(), name: c.gewerk || c.firma || c.name, art: c.art, eigen: c.art === 'intern', crm: cid,
    firma: '', adresse: '', kontakt: '', telefon: '', email: '', farbe: freieFarbe(p.gewerke.map(x => x.farbe)) };
  p.gewerke.push(g);
  save(); render(); gwWaehlen(g.id);
  toast(`«${g.name}» aus den Kontakten ins Projekt übernommen.`);
}
function gwNeu() {
  $('gw-liste').hidden = true;
  gewerkDialog(route().id, null, { name: $('t-gw-suche').value.trim(), ausSuche: true });
}

// Termine nach Gewerk gruppiert, Gruppen in der Reihenfolge ihres ersten Termins
function ganttGruppen(p, termine) {
  const map = new Map();
  termine.forEach(t => { if (!map.has(t.gewerkId)) map.set(t.gewerkId, []); map.get(t.gewerkId).push(t); });
  return [...map].map(([gid, items]) => ({ g: gewerk(p, gid), items, start: items[0].start, ende: items.reduce((m, t) => t.ende > m ? t.ende : m, '0000') }));
}
// opt.zoom: 'tag' | 'woche' (sonst Auswahl im Terminplan), opt.vorschau: nur anzeigen (Projekt-Übersicht)
function gantt(p, termine, opt = {}) {
  const ax = zeitachse(termine), tagMode = (opt.zoom || ui.zoom) !== 'woche', w = tagMode ? 24 : (opt.vorschau ? 10 : 8), TW = ax.tage * w;
  const s0 = isoOf(ax.start), idx = iso => diffDays(s0, iso);
  const raster = `background-image:repeating-linear-gradient(to right, transparent 0 ${5 * w}px, rgba(0,0,0,.045) ${5 * w}px ${7 * w}px),` +
    `repeating-linear-gradient(to right, ${tagMode ? `#e6eaef 0 1px, transparent 1px ${w}px` : `#d5dbe2 0 1px, transparent 1px ${7 * w}px`})`;
  const tint = (c, a) => `background:linear-gradient(${c}${a},${c}${a}),#fff`;
  const row = (cls, left, track, leftStyle = '', attr = '') =>
    `<div class="xg-row ${cls}"><div class="xg-left" style="${leftStyle}" ${attr}>${left}</div><div class="xg-track" style="width:${TW}px;${raster}">${track}</div></div>`;

  const monate = monatsAbschnitte(ax).map(m => `<div class="xg-mon" style="left:${m.von * w}px;width:${(m.bis - m.von) * w}px">${m.text}</div>`).join('');
  const wochen = ax.wochen.map((d, i) => `<div class="xg-wk" style="left:${i * 7 * w}px;width:${7 * w}px">KW ${kw(d)}${tagMode ? ' · ' + fmt(isoOf(d)).slice(0, 6) : ''}</div>`).join('');
  let tage = '';
  if (tagMode) for (let i = 0; i < ax.tage; i++) {
    const d = addDays(ax.start, i), wd = (d.getUTCDay() + 6) % 7;
    tage += `<div class="xg-day ${wd > 4 ? 'we' : ''}" style="left:${i * w}px;width:${w}px">${d.getUTCDate()}<br>${'MDMDFSS'[wd]}</div>`;
  }
  const head = `<div class="xg-row xg-head" style="height:${tagMode ? 70 : 44}px"><div class="xg-left">
      <div>Gewerk / Aufgabe</div><div>Fortschritt</div><div>Start</div><div>Ende</div></div>
      <div class="xg-track" style="width:${TW}px">${monate}${wochen}${tage}</div></div>`;

  const body = ganttGruppen(p, termine).map(gr => {
    const g = gr.g;
    const kopf = row('xg-group', `<div style="grid-column:1/-1"><span class="swatch" style="background:${g.farbe}"></span>${esc(g.name)}${seiteTag(g)}
        <span class="muted" style="font-weight:400;margin-left:6px">${esc(g.firma || '')}</span></div>`,
      `<div class="xg-sum" style="left:${idx(gr.start) * w}px;width:${(diffDays(gr.start, gr.ende) + 1) * w}px;background:${g.farbe}"></div>`, tint(g.farbe, '38'));
    return kopf + gr.items.map(t => {
      const f = t.fortschritt || 0, l = idx(t.start) * w;
      const bar = t.meilenstein
        ? `<div class="xg-ms" style="left:${l + w / 2 - 6.5}px;background:${g.farbe}" title="${esc(t.titel)}: ${fmt(t.start)}"></div>`
        : `<div class="xg-bar" style="left:${l + 1}px;width:${(diffDays(t.start, t.ende) + 1) * w - 2}px;background:${g.farbe}" title="${esc(t.titel)}: ${fmt(t.start)} – ${fmt(t.ende)}${zeitTxt(t) ? ', ' + zeitTxt(t) : ''} · ${f}%"><i style="width:${f}%"></i></div>`;
      const pl = t.pl ? `<div class="xg-pl" style="left:${l - 3}px" title="Ich bin vor Ort: ${fmt(t.start)}${t.plZeit ? ' ab ' + t.plZeit : ''}"></div>` : '';
      const vor = t.nach && p.termine.find(x => x.id === t.nach);
      return row('task', `<div title="${esc(t.titel)}${vor ? ' – startet nach: ' + esc(vor.titel) : ''}">${vor ? '<span class="muted">↳ </span>' : ''}${t.meilenstein ? '◆ ' : ''}${esc(t.titel)}${zeitTxt(t) ? `<span class="muted"> · ${zeitTxt(t)}</span>` : ''}</div>
          <div>${t.meilenstein ? '' : `<span class="prog"><div style="width:${f}%"></div></span><small>${f}%</small>`}</div>
          <div>${fmt(t.start)}</div><div>${fmt(t.ende)}</div>`,
        bar + pl, tint(g.farbe, '14'), opt.vorschau ? '' : `onclick="ui.editTermin='${t.id}';render();scrollTo(0,0)" title="Klicken zum Bearbeiten"`);
    }).join('');
  }).join('');

  const ti = idx(todayIso()), LW = innerWidth <= 800 ? 230 : 480;
  const heute = ti >= 0 && ti < ax.tage ? `<div class="xg-today" style="left:${LW + ti * w + w / 2 - 1}px" title="Heute"></div>` : '';
  return `<div class="xg" data-today="${Math.max(0, ti) * w}" data-w="${w}"><div class="xg-inner">${head}${body}${heute}</div></div>`;
}

function speichereTermin(pid) {
  const p = findP(pid);
  const d = { gewerkId: val('t-gw'), titel: val('t-titel'), start: val('t-start'), ende: val('t-ende'), bemerkung: val('t-bem'), meilenstein: $('t-ms').checked,
    pl: $('t-pl').checked, plZeit: val('t-plzeit'), fortschritt: +$('t-fs').value, zeitVon: val('t-von'), zeitBis: val('t-bis'), nach: val('t-nach'), abstand: Math.max(0, +val('t-abst') || 0) };
  if (d.meilenstein && d.start && !d.ende) d.ende = d.start;
  // mit Abhängigkeit genügt die Dauer: fehlender Start wird berechnet
  if (d.nach && !d.start) { d.start = d.ende || todayIso(); if (!d.ende) d.ende = d.start; }
  if (!d.gewerkId) { toast('Bitte ein Gewerk aus der Liste wählen oder neu anlegen.'); return $('t-gw-suche').focus(); }
  if (!d.titel || !d.start || !d.ende) return toast('Bitte Tätigkeit, Start und Ende ausfüllen.');
  if (d.ende < d.start) return toast('Das Ende liegt vor dem Start.');
  if (ui.editTermin) Object.assign(p.termine.find(x => x.id === ui.editTermin), d);
  else p.termine.push({ id: uid(), ...d });
  const n = verschiebeAbhaengige(p);
  ui.editTermin = null; ui.formNr = (ui.formNr || 0) + 1; // Formular danach leeren
  save(); render(); toast(n ? `Termin gespeichert · ${n} abhängige Termine angepasst.` : 'Termin gespeichert.');
}
function loescheTermin(pid, tid) {
  if (!confirm('Termin löschen?')) return;
  const p = findP(pid);
  p.termine = p.termine.filter(x => x.id !== tid);
  verschiebeAbhaengige(p); save(); render();
}

// ---------- Abhängigkeiten ----------
function addArbeitstage(iso, n) {
  let d = toDate(iso);
  while (n > 0) { d = addDays(d, 1); const w = d.getUTCDay(); if (w && w !== 6) n--; }
  return isoOf(d);
}
// alle Termine, die (direkt oder indirekt) nach tid starten – dürfen nicht Vorgänger von tid werden
function nachfolger(p, tid) {
  const s = new Set([tid]);
  let neu = true;
  while (neu) { neu = false; p.termine.forEach(t => { if (t.nach && s.has(t.nach) && !s.has(t.id)) { s.add(t.id); neu = true; } }); }
  return s;
}
// Start = nächster Arbeitstag nach Ende des Vorgängers + Abstand; Anzahl Arbeitstage bleibt gleich. Gibt Anzahl verschobener Termine zurück.
function verschiebeAbhaengige(p) {
  const moved = new Set();
  for (let runde = 0; runde <= p.termine.length; runde++) {
    let geaendert = false;
    p.termine.forEach(t => {
      if (!t.nach) return;
      const v = p.termine.find(x => x.id === t.nach);
      if (!v) { t.nach = ''; return; }
      const start = addArbeitstage(v.ende, 1 + (t.abstand || 0));
      if (start !== t.start) {
        const at = Math.max(1, arbeitstage(t.start, t.ende));
        t.start = start; t.ende = addArbeitstage(start, at - 1);
        moved.add(t.id); geaendert = true;
      }
    });
    if (!geaendert) break;
  }
  return moved.size;
}

          ${effektiveVorlage(x) ? `<div><span class="tag-wichtig" style="margin:0">✉ ${esc(effektiveVorlage(x))}</span></div>` : ''}</td>
        <td>${esc(x.firma)}</td><td>${esc(x.kontakt)}</td>
        <td class="muted">${x.telefon ? `<a href="tel:${esc(x.telefon)}" onclick="event.stopPropagation()">${esc(x.telefon)}</a>` : ''}${x.telefon && x.email ? '<br>' : ''}${x.email ? `<a href="mailto:${esc(x.email)}" onclick="event.stopPropagation()">${esc(x.email)}</a>` : ''}</td>
        <td class="muted">${esc(x.adresse)}</td>

          <button class="sec sm" onclick="gewerkDialog('${p.id}','${x.id}')">Bearbeiten</button>
          ${x.fix ? '' : `<button class="danger sm" onclick="loescheGewerk('${p.id}','${x.id}')">✕</button>`}</td></tr>`).join('')}
    </table></div></div>`;

function gwArt(art) {

  const intern = art === 'intern', f = $('g-firma'), a = $('g-adr');
  if (intern) { f.dataset.alt = f.disabled ? f.dataset.alt : f.value; a.dataset.alt = a.disabled ? a.dataset.alt : a.value; f.value = S().firma; a.value = [S().strasse, S().ort].filter(Boolean).join(', '); }

// legt eine Mailvorlage für ein Gewerk an und gibt ihren Namen zurück
function neueVorlageFuer(gewerkName) {
  const L = S().mailvorlagen;
  let name = `${gewerkName} anfragen`, n = 2;
  while (L.some(m => m.name.toLowerCase() === name.toLowerCase())) name = `${gewerkName} anfragen ${n++}`;
  L.push({ name, gewerk: gewerkName, an: '', betreff: `${gewerkName} {projektnummer} {projekt}, {ort}`,
    text: `Guten Tag {gewerk_kontakt}\n\nFür unser Projekt {projektnummer} {projekt} in {ort} benötigen wir Sie für folgende Arbeiten:\n\n{termine}\n\nBitte bestätigen Sie mir die Termine kurz.\n` });
  return name;
}
function gewerkSpeichern() {
  const { pid, gid, art, ausSuche } = ui.gwDlg, p = findP(pid), intern = art === 'intern';
  const name = val('g-name');
  if (!name) { toast('Bitte einen Gewerk-Namen eingeben.'); return $('g-name').focus(); }
  let vorlage = $('g-vorlage').value, neueVorlage = false;
  if (vorlage === '__neu') { vorlage = neueVorlageFuer(name); neueVorlage = true; }
  const daten = { name, art, eigen: intern, firma: intern ? '' : val('g-firma'), adresse: intern ? '' : val('g-adr'), kontakt: val('g-kontakt'),
    telefon: val('g-tel'), email: val('g-mail'), farbe: $('g-farbe').value, mailvorlage: vorlage };
  let meldung = gid ? 'Gewerk gespeichert' : 'Gewerk hinzugefügt';
  // Kontaktdaten zentral im CRM halten: verknüpften Kontakt aktualisieren oder neu anlegen
  let crm = ui.gwDlg.crm && kontaktById(ui.gwDlg.crm) ? ui.gwDlg.crm : '';
  const kd = { art, name: daten.kontakt, firma: daten.firma, telefon: daten.telefon, email: daten.email, adresse: daten.adresse };
  if (crm) { const c = kontaktById(crm); Object.assign(c, kd, { gewerk: c.gewerk || name }); }
  else if ($('g-crm-neu')?.checked && (kd.name || kd.firma || kd.email || kd.telefon)) {
    crm = uid(); S().kontakte.push({ id: crm, gewerk: name, notiz: '', ...kd }); meldung += ' · im CRM gespeichert';
  }
  daten.crm = crm || undefined;
  let g = gid && p.gewerke.find(x => x.id === gid);
  if (g) Object.assign(g, daten); else { g = { id: uid(), ...daten }; p.gewerke.push(g); }
  if (document.querySelector('input[name=g-std]:checked')?.value === 'ja' && !g.std) {
    const { id, std, fix, ...rest } = g, sid = uid();
    S().standardGewerke.push({ ...rest, sid });
    g.std = sid; g.fix = true;
    const n = stdAbgleich(state);
    meldung += ` · als Standard-Gewerk übernommen${n ? ' (' + inProjekten(n) + ')' : ''}`;
  }
  if (neueVorlage) meldung += ` · Mailvorlage «${vorlage}» angelegt`;
  save(); $('dlg').close(); render(); toast(meldung + '.');
  if (ausSuche) gwWaehlen(g.id);
}
function loescheGewerk(pid, gid) {

// ---------- Wochenplan ----------
const wochenStart = iso => { const d = toDate(iso); return isoOf(addDays(d, -((d.getUTCDay() + 6) % 7))); };
// am Wochenende nur zeigen, wenn der Termin dort beginnt oder endet (sonst wird über das Wochenende nicht gearbeitet)
const aktivAm = (t, d) => t.start <= d && t.ende >= d && (toDate(d).getUTCDay() % 6 !== 0 || d === t.start || d === t.ende);
function viewWoche() {
  const today = todayIso();
  if (!ui.woche) ui.woche = wochenStart(today);
  const ws = ui.woche, tage = [...Array(7)].map((_, i) => isoOf(addDays(toDate(ws), i))), we = tage[6];
  const rows = state.projects.map(p => ({
    p, t: sortTermine(p).filter(t => t.start <= we && t.ende >= ws && (!ui.nurIntern || artOf(gewerk(p, t.gewerkId)) !== 'extern'))
  })).filter(r => r.t.length).sort((a, b) => a.t[0].start.localeCompare(b.t[0].start));
  const zeigen = tage.filter((d, i) => i < 5 || rows.some(r => r.t.some(t => aktivAm(t, d))));
  const shift = n => isoOf(addDays(toDate(ws), 7 * n));
  const einsaetze = meineEinsaetze().filter(e => e.t.start >= ws && e.t.start <= we).length;
  return `
  <div class="page-head no-print">
    <div><h1>Wochenplan</h1><div class="muted" style="margin-top:4px">KW ${kw(toDate(ws))} · ${fmt(ws)} – ${fmt(we)} · ${rows.length} Baustellen · ${einsaetze} Einsätze von mir</div></div>
    <div class="row">
      <label class="check" style="margin-right:8px"><input type="checkbox" ${ui.nurIntern ? 'checked' : ''} onchange="ui.nurIntern=this.checked;render()"> nur unsere Montage (intern + Sub)</label>
      <button class="sec sm" onclick="ui.woche='${shift(-1)}';render()">‹</button>
      <button class="sec sm" onclick="ui.woche=null;render()">Diese Woche</button>
      <button class="sec sm" onclick="ui.woche='${shift(1)}';render()">›</button>
      <button class="sec sm" onclick="print()">Drucken</button>
    </div>
  </div>
  <div class="print-only"><h2>Wochenplan KW ${kw(toDate(ws))} · ${fmt(ws)} – ${fmt(we)}</h2></div>
  <div class="card" style="padding:0;overflow:hidden">
    ${rows.length ? `<div class="table-wrap"><table class="wk">
      <tr><th style="width:200px">Projekt</th>${zeigen.map(d => `<th class="${d === today ? 'heute' : ''}">${WT[toDate(d).getUTCDay()]} ${fmt(d).slice(0, 6)}</th>`).join('')}</tr>
      ${rows.map(({ p, t }) => `<tr>
        <td><div style="display:flex;gap:8px;align-items:flex-start;cursor:pointer" onclick="openProjekt('${p.id}')"><span class="pdot" style="background:${p.farbe};margin-top:4px"></span>
          <div><b>${esc(p.nummer)}</b> ${esc(p.name)}<div class="muted">${esc(p.ort || '')}</div></div></div></td>
        ${zeigen.map(d => `<td class="${d === today ? 'heute' : ''}">${t.filter(x => aktivAm(x, d)).map(x => {
          const g = gewerk(p, x.gewerkId);
          return `<div class="wk-chip" style="border-left-color:${g.farbe}" onclick="openProjekt('${p.id}')" title="${esc(x.titel)}: ${fmt(x.start)} – ${fmt(x.ende)}">
            ${zeitTxt(x) ? `<b class="wk-zeit">${zeitTxt(x)}</b>` : ''}${x.meilenstein ? '◆ ' : ''}${esc(x.titel)}<small>${esc(g.name)}${!g.eigen && g.firma ? ' · ' + esc(g.firma) : ''}</small>
            ${x.pl && x.start === d ? `<span class="wk-pl">Ich vor Ort${x.plZeit ? ' ab ' + x.plZeit : ''}</span>` : ''}</div>`;
        }).join('')}</td>`).join('')}
      </tr>`).join('')}
    </table></div>` : '<div class="empty">In dieser Woche sind keine Arbeiten geplant.</div>'}
  </div>`;
}

function kontaktSpeichern() {

// beim Löschen bleiben die Daten in den Gewerken erhalten, nur die Verknüpfung fällt weg
function kontaktLoeschen(cid) {

  const kopie = g => { if (g.crm !== cid) return; Object.assign(g, { kontakt: c.name, telefon: c.telefon, email: c.email, ...(g.eigen ? {} : { firma: c.firma, adresse: c.adresse }) }); delete g.crm; };
  S().standardGewerke.forEach(kopie);

}

// Suchfeld für CRM-Kontakte; bei Auswahl wird window[aktion](kontaktId) aufgerufen
function kontaktPicker(aktion, opt = {}) {
  return `<div class="gw-wahl"><input id="kp-${aktion}" autocomplete="off" placeholder="${opt.platzhalter || 'Kontakt suchen …'}" data-filter="${opt.filter || ''}" data-neu="${opt.ohneNeu ? '' : '1'}"
    onfocus="kpListe('${aktion}')" oninput="kpListe('${aktion}')" onkeydown="kpTaste(event,'${aktion}')" onblur="setTimeout(()=>{const l=$('kpl-${aktion}');if(l)l.hidden=true},180)">
    <div class="gw-liste" id="kpl-${aktion}" hidden></div></div>`;
}
let kpTreffer = [], kpAktiv = 0;
function kpListe(aktion) {
  const inp = $('kp-' + aktion), L = $('kpl-' + aktion);
  if (!inp) return;
  const filter = inp.dataset.filter ? inp.dataset.filter.split(',') : null;
  const woerter = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const liste = S().kontakte.filter(c => (!filter || filter.includes(c.art)) && woerter.every(w => kontaktText(c).includes(w)));
  kpTreffer = []; kpAktiv = 0;
  let html = '';
  KONTAKT_ARTEN.forEach(([art, titel]) => {
    const l = liste.filter(c => c.art === art).sort(nachName).slice(0, 30);
    if (!l.length) return;
    html += `<div class="gw-gruppe">${titel}</div>` + l.map(c => {
      const i = kpTreffer.push(c.id) - 1;
      return `<div class="gw-opt" data-i="${i}" onmousedown="event.preventDefault();kpWaehlen('${aktion}','${c.id}')">
        <span class="avatar klein" style="background:${avatarFarbe(c)}">${initialen(kontaktName(c))}</span>
        <div style="min-width:0"><b>${markiere(kontaktName(c), woerter)}</b>${kontaktFirma(c) && c.name ? ` <span class="muted">· ${markiere(kontaktFirma(c), woerter)}</span>` : ''}
          <div class="muted klein">${[c.gewerk && markiere(c.gewerk, woerter), c.telefon && '☎ ' + markiere(c.telefon, woerter), c.email && markiere(c.email, woerter)].filter(Boolean).join(' · ')}</div></div></div>`;
    }).join('');
  });
  if (inp.dataset.neu) {
    const i = kpTreffer.push('__neu') - 1;
    html += `<div class="gw-opt gw-neu" data-i="${i}" onmousedown="event.preventDefault();kpNeu('${aktion}')">＋ Neuer Kontakt${inp.value.trim() ? ` «${esc(inp.value.trim())}»` : ''}</div>`;
  }
  if (!liste.length) html = '<div class="muted" style="padding:10px 12px">Kein Kontakt gefunden.</div>' + html;
  L.innerHTML = html; L.hidden = false; kpMarkieren(aktion);
}
function kpMarkieren(aktion) {
  document.querySelectorAll(`#kpl-${aktion} .gw-opt`).forEach(el => el.classList.toggle('aktiv', +el.dataset.i === kpAktiv));
  document.querySelector(`#kpl-${aktion} .gw-opt.aktiv`)?.scrollIntoView({ block: 'nearest' });
}
function kpTaste(e, aktion) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    kpAktiv = (kpAktiv + (e.key === 'ArrowDown' ? 1 : -1) + kpTreffer.length) % Math.max(1, kpTreffer.length);
    kpMarkieren(aktion);
  } else if (e.key === 'Enter') {
    e.preventDefault(); e.stopPropagation();
    const id = kpTreffer[kpAktiv];
    if (id === '__neu') kpNeu(aktion); else if (id) kpWaehlen(aktion, id);
  } else if (e.key === 'Escape') $('kpl-' + aktion).hidden = true;
}
function kpWaehlen(aktion, cid) { $('kpl-' + aktion).hidden = true; $('kp-' + aktion).value = ''; window[aktion](cid); }
function kpNeu(aktion) {
  const inp = $('kp-' + aktion), f = inp.dataset.filter;
  $('kpl-' + aktion).hidden = true;
  kontaktDialog(null, { name: inp.value.trim(), art: f ? f.split(',')[0] : 'extern', danach: aktion });
}

// ---------- Alle Termine (Kalender) ----------
function viewKalender() {
  const [y, m] = ui.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), last = new Date(Date.UTC(y, m, 0));
  const gridStart = addDays(first, -((first.getUTCDay() + 6) % 7));
  const gridEnd = addDays(last, 6 - ((last.getUTCDay() + 6) % 7));
  const today = todayIso();
  const spans = state.projects.map(p => ({ p, s: span(p) })).filter(x => x.s).sort((a, b) => a.s.start.localeCompare(b.s.start));
  const plTag = {};
  meineEinsaetze().forEach(e => (plTag[e.t.start] = plTag[e.t.start] || []).push(e));

  let weeks = '';
  for (let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)) {
    const wsI = isoOf(ws), weI = isoOf(addDays(ws, 6));
    const segs = spans.filter(x => x.s.start <= weI && x.s.ende >= wsI);
    const rows = `minmax(26px, auto) ${segs.map(() => '25px').join(' ')} 1fr`;
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), di = isoOf(d);
      const cls = [d.getUTCMonth() !== m - 1 && 'out', i >= 5 && 'we', di === today && 'today'].filter(Boolean).join(' ');
      const pls = ui.showPl ? (plTag[di] || []).map(({ p, t }) =>
        `<b class="cal-pl" title="Ich vor Ort: ${esc(p.nummer)} ${esc(p.name)} – ${esc(t.titel)}${t.plZeit ? ' ab ' + t.plZeit : ''}" onclick="openProjekt('${p.id}')">${t.plZeit || 'PL'} ${esc(p.nummer)}</b>`).join('') : '';
      cells += `<div class="cal-day ${cls}" style="grid-column:${i + 1}"></div>
        <div class="cal-num ${cls}" style="grid-column:${i + 1}"><span>${d.getUTCDate()}</span>${pls}</div>`;
    }
    const bars = segs.map(({ p, s }, lane) => {
      const a = s.start > wsI ? s.start : wsI, b = s.ende < weI ? s.ende : weI;
      const l = s.start < wsI ? '0' : '5px', r = s.ende > weI ? '0' : '5px';
      return `<div class="cal-bar" style="grid-column:${diffDays(wsI, a) + 1} / span ${diffDays(a, b) + 1};grid-row:${lane + 2};background:${p.farbe};border-radius:${l} ${r} ${r} ${l}"
        title="${esc(p.nummer)} ${esc(p.name)}: ${fmt(s.start)} – ${fmt(s.ende)}" onclick="openProjekt('${p.id}')">${esc(p.nummer)} · ${esc(p.name)}</div>`;
    }).join('');
    weeks += `<div class="cal-week" style="grid-template-rows:${rows}">${cells}${bars}</div>`;
  }

  const shift = n => { const d = new Date(Date.UTC(y, m - 1 + n, 1)); return isoOf(d).slice(0, 7); };
  return `
  <div class="page-head">
    <h1>Alle Termine</h1>
    <div class="row">
      <label class="check" style="margin-right:12px"><input type="checkbox" ${ui.showPl ? 'checked' : ''} onchange="ui.showPl=this.checked;render()"> <span class="cal-pl" style="margin:0">PL</span> Meine Einsätze anzeigen</label>
      <button class="sec sm" onclick="ui.month='${shift(-1)}';render()">‹</button>
      <b style="min-width:140px;text-align:center">${MONATE[m - 1]} ${y}</b>
      <button class="sec sm" onclick="ui.month='${shift(1)}';render()">›</button>
      <button class="sec sm" onclick="ui.month='${today.slice(0, 7)}';render()">Heute</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <div class="cal" style="border:none;min-width:640px">
      <div class="cal-head">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => `<div>${d}</div>`).join('')}</div>
      ${weeks}
    </div>
  </div>
  <div class="card">
    <h3>Projektdauer</h3>
    ${spans.length ? `<div class="table-wrap"><table>
      <tr><th>Projekt</th><th>Start</th><th>Ende</th><th>Dauer</th><th>Status</th></tr>
      ${spans.map(({ p, s }) => `<tr class="click" onclick="openProjekt('${p.id}')">
        <td><span class="swatch" style="background:${p.farbe}"></span><b>${esc(p.nummer)}</b> ${esc(p.name)}</td>
        <td>${fmt(s.start)}</td><td>${fmt(s.ende)}</td>
        <td>${Math.ceil((diffDays(s.start, s.ende) + 1) / 7)} Wo. · ${arbeitstage(s.start, s.ende)} AT</td>
        <td>${badge(p)}</td></tr>`).join('')}
    </table></div>` : '<div class="empty">Noch keine Projekte mit Terminen.</div>'}
  </div>`;
}

function updMail(i, k, v) {
  const m = S().mailvorlagen[i], alt = m.name;
  m[k] = k === 'text' ? v : v.trim();
  // Umbenennen: Verknüpfungen in Vorlage und Projekten mitziehen
  if (k === 'name' && alt && alt !== m.name) {
    const ers = t => t.split(`[mail: ${alt}]`).join(`[mail: ${m.name}]`);
    state.settings.checklisteVorlage = ers(state.settings.checklisteVorlage);
    state.projects.forEach(p => p.checkliste = ers(p.checkliste));
    if (ui.ed) ui.ed.lines.forEach(z => { if (z.mail === alt) z.mail = m.name; });
    [...state.settings.standardGewerke, ...state.projects.flatMap(p => p.gewerke)].forEach(g => { if (g.mailvorlage === alt) g.mailvorlage = m.name; });
  }
  save(); toast('Vorlage gespeichert.');
}
function delMail(i) {
  if (!confirm(`Mailvorlage «${S().mailvorlagen[i].name}» löschen?`)) return;
  S().mailvorlagen.splice(i, 1); save(); render();
}

const inProjekten = n => `in ${n} Projekt${n === 1 ? '' : 'en'}`;
// Änderung in alle Projekte übernehmen, ausser das Feld wurde dort angepasst
function updStd(i, k, v) {
  const s = S().standardGewerke[i], alt = s[k];
  v = typeof v === 'string' ? v.trim() : v;
  s[k] = v;
  let n = 0;
  state.projects.forEach(p => p.gewerke.forEach(g => {
    if (g.std !== s.sid) return;
    if ((g[k] ?? '') === (alt ?? '') || (k !== 'name' && !g[k])) { g[k] = v; if (k === 'art') g.eigen = v === 'intern'; n++; }
  }));
  save(); render();
  if (n) toast(`Gespeichert · ${inProjekten(n)} übernommen.`);
}
function addStd(art = 'extern') {
  const list = S().standardGewerke;
  list.push({ name: 'Neues Gewerk', art, eigen: art === 'intern', firma: '', adresse: '', kontakt: '', email: '', farbe: freieFarbe(list.map(g => g.farbe)), sid: uid() });
  const n = stdAbgleich(state);
  save(); render();
  toast(`Gewerk hinzugefügt${n ? ' · ' + inProjekten(n) + ' ergänzt' : ''}. Jetzt Namen eintragen.`);
}
// aus allen Projekten entfernen; Gewerke mit Terminen bleiben im Projekt (dann löschbar)
function stdEntfernen(sid) {
  let weg = 0, bleibt = 0;
  state.projects.forEach(p => {
    p.gewerke = p.gewerke.filter(g => {
      if (g.std !== sid) return true;
      if (p.termine.some(t => t.gewerkId === g.id)) { delete g.std; g.fix = false; bleibt++; return true; }
      weg++; return false;
    });
  });
  return { weg, bleibt };
}
function delStd(i) {
  const s = S().standardGewerke[i];
  if (!confirm(`«${s.name}» aus der Standardliste und aus allen Projekten ohne Termine dieses Gewerks entfernen?`)) return;
  S().standardGewerke.splice(i, 1);
  const r = stdEntfernen(s.sid);
  save(); render();
  toast(`Entfernt${r.weg ? ' · ' + inProjekten(r.weg) : ''}${r.bleibt ? ` · ${r.bleibt}× wegen Terminen behalten` : ''}.`);
}
function stdZuruecksetzen() {
  if (!confirm('Standardliste auf die ursprünglichen Gewerke zurücksetzen? Das gilt auch für alle Projekte.')) return;
  const alt = S().standardGewerke;
  const neu = stdKopie().map(s => ({ ...s, sid: alt.find(a => gwSchluessel(a) === gwSchluessel(s))?.sid || uid() }));
  alt.filter(a => !neu.some(s => s.sid === a.sid)).forEach(a => stdEntfernen(a.sid));
  state.settings.standardGewerke = neu;
  stdAbgleich(state);
  save(); render(); toast('Standard-Gewerke zurückgesetzt.');
}

// Ordner-Handle wird in IndexedDB gemerkt (localStorage kann das nicht)
const idb = {
  open: () => new Promise((res, rej) => {
    const r = indexedDB.open('ckw-projekte', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }),
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
const backup = { dir: null, status: 'showDirectoryPicker' in window ? 'none' : 'unsupported', last: null };

async function regrant() {

async function writeFile(dir, name, text) {

let abTimer;

async function runAutoBackup(force) {
