<style>
  :root {
    --bg: #ebeae6; --side: #f8f8f5; --card: #fff; --text: #18181b; --muted: #74747c; --line: #e8e7e2;
    --ink: #18181b; --brand: #18181b; --brand-dark: #000; --brand-2: #f1f0eb; --lime: #bfd62f; --bar: #93b81c;
    --danger: #c0392b; --ok: #2e8b3e; --warn: #c27c0e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .layout.collapsed { grid-template-columns: 64px 1fr; }
  .side-toggle { background: rgba(255,255,255,.12); border: none; width: 30px; height: 30px; padding: 0; border-radius: 6px; color: #fff; font-size: 16px; flex-shrink: 0; }
  .collapsed .brand { padding: 16px 0; justify-content: center; }
  .collapsed .brand-txt, .collapsed nav a span, .collapsed .side-txt { display: none; }
  .collapsed nav a { justify-content: center; padding: 10px 0; }
  .collapsed .side-foot { padding: 14px 0; text-align: center; }
  .collapsed .side-foot .dot { margin: 0; }
  main { padding: 24px 24px 60px; min-width: 0; max-width: 1200px; width: 100%; margin: 0 auto; }
  aside { background: var(--brand); color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { padding: 16px 12px 14px 18px; border-bottom: 1px solid rgba(255,255,255,.15); display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 66px; }
  .brand-txt { min-width: 0; }
  .brand b { display: block; font-size: 16px; }
  .brand span { font-size: 12px; opacity: .8; }
  nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #fff; text-decoration: none; opacity: .85; font-size: 15px; }
  nav a:hover { background: rgba(255,255,255,.1); opacity: 1; }
  nav a.active { background: #fff; color: var(--brand); opacity: 1; font-weight: 600; }
  nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding: 14px 18px; font-size: 12px; border-top: 1px solid rgba(255,255,255,.15); opacity: .9; }
  .side-foot button { margin-top: 6px; background: #fff; color: var(--brand); border-color: #fff; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 22px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; color: var(--text); }
  input:disabled { background: #f1f3f6; color: var(--muted); }
  textarea { min-height: 60px; resize: vertical; }
  input[type=color] { padding: 2px; height: 38px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); margin: 0; }
  .check input { width: auto; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border: 1px solid var(--brand); background: var(--brand); color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  button.sec { background: #fff; color: var(--brand); }
  button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button.sm { padding: 4px 9px; font-size: 13px; }
  button:hover { filter: brightness(1.08); }
  button.plus { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 26px; line-height: 1; box-shadow: 0 3px 10px rgba(0,85,140,.3); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f8fafc; }
  .table-wrap { overflow-x: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; flex-shrink: 0; }
  .pnum { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-2); display: inline-block; padding: 2px 8px; border-radius: 99px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; display: inline-block; }
  .b-laufend { background: #e3f4e8; color: var(--ok); } .b-geplant { background: var(--brand-2); color: var(--brand); }
  .b-abgeschlossen { background: #eceff3; color: var(--muted); } .b-leer { background: #fdf2e0; color: var(--warn); }
  .tag-int { font-size: 11px; background: var(--brand); color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .tag-sub { font-size: 11px; background: #fdf2e0; color: #9a5b00; border: 1px solid #f3d9a8; padding: 0 6px; border-radius: 4px; margin-left: 6px; }
  .tag-ext { font-size: 11px; background: #fff; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; margin-left: 6px; }
  .tag-pl { font-size: 11px; background: #fdecea; color: var(--danger); padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .tag-warn { font-size: 11px; background: var(--danger); color: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-left: 6px; }
  .g-pl { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; transform: translateX(-3px); z-index: 2; }
  .cal-pl { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--danger); border-radius: 3px; padding: 0 4px; margin-left: 3px; vertical-align: 1px; cursor: pointer; max-width: 80px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: none; color: var(--muted); border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 14px; }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  /* Projekte */
  .projects { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .pcard { border: 1px solid var(--line); border-left: 5px solid var(--c, var(--brand)); border-radius: 10px; padding: 14px; background: #fff; cursor: pointer; transition: box-shadow .15s; }
  .pcard:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  /* Dashboard */
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi b { font-size: 26px; display: block; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .next { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: #fff; border: none; }
  .next .muted { color: rgba(255,255,255,.8); }
  .next .big { font-size: 24px; font-weight: 700; margin: 6px 0 2px; }
  .next .when { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
  .next .when div b { display: block; font-size: 17px; }
  .next button { background: #fff; color: var(--brand); border-color: #fff; margin-top: 14px; }
  .cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress div { height: 100%; background: var(--ok); }
  .li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .li:last-child { border-bottom: none; }
  .li .date { width: 86px; font-size: 13px; color: var(--muted); flex-shrink: 0; }
  /* Terminplan (Gantt im Tagesraster) */
  .xg { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .xg-inner { position: relative; width: max-content; }
  .xg-row { display: flex; border-bottom: 1px solid #e8ecf1; min-height: 32px; }
  .xg-left { position: sticky; left: 0; z-index: 3; display: grid; grid-template-columns: 1fr 100px 80px 80px; width: 480px; flex-shrink: 0; background: #fff; border-right: 2px solid var(--line); font-size: 13px; }
  .xg-left > div { padding: 5px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
  .xg-row.task .xg-left { cursor: pointer; }
  .xg-row.task .xg-left > div:first-child { padding-left: 22px; }
  .xg-row.task:hover .xg-left { filter: brightness(.97); }
  .xg-track { position: relative; flex-shrink: 0; }
  .xg-head { background: #2c3440; color: #fff; }
  .xg-head .xg-left { background: #2c3440; color: #fff; font-weight: 600; font-size: 12px; border-right-color: #2c3440; }
  .xg-mon { position: absolute; top: 0; height: 22px; padding: 4px 6px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; color: var(--lime); border-left: 1px solid rgba(255,255,255,.35); border-bottom: 1px solid rgba(255,255,255,.12); }
  .xg-wk { position: absolute; top: 22px; height: 22px; border-left: 1px solid rgba(255,255,255,.25); padding: 4px 5px; white-space: nowrap; overflow: hidden; font-size: 11px; }
  .xg-day { position: absolute; top: 44px; height: 26px; text-align: center; font-size: 10px; line-height: 1.15; padding-top: 2px; color: #dfe5eb; border-left: 1px solid rgba(255,255,255,.08); }
  .xg-day.we { color: #8a96a3; }
  .xg-group .xg-left > div { font-weight: 700; }
  .xg-bar { position: absolute; top: 8px; height: 16px; border-radius: 3px; overflow: hidden; min-width: 4px; }
  .xg-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.3); }
  .xg-sum { position: absolute; top: 13px; height: 6px; border-radius: 3px; opacity: .55; }
  .xg-ms { position: absolute; top: 9px; width: 13px; height: 13px; transform: rotate(45deg); }
  .xg-pl { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; z-index: 2; }
  .xg-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
  .prog { height: 6px; background: #e3e7ec; border-radius: 3px; overflow: hidden; display: inline-block; width: 40px; vertical-align: middle; margin-right: 6px; }
  .prog div { height: 100%; background: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--brand); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 10px; font-size: 13px; background: #fff; color: var(--brand); }
  .seg button.on { background: var(--brand); color: #fff; }
  /* Checkliste */
  .ck-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-bottom: 1px solid #eef1f5; }
  .ck-row:last-child { border-bottom: none; }
  .ck-row input[type=checkbox] { width: 18px; height: 18px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--ok); cursor: pointer; }
  .ck-row.done .ck-txt > span:first-child { color: var(--muted); text-decoration: line-through; text-decoration-color: #b8c0ca; }
  .ck-row.lvl0 .ck-txt > span:first-child { font-weight: 600; }
  .ck-txt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .ck-txt input[type=date] { padding: 3px 6px; width: 150px; }
  .ck-am { font-size: 11px; color: var(--ok); }
  .ck-notiz { flex-basis: 100%; font-size: 12px; color: var(--muted); background: #f8fafc; border-left: 3px solid var(--line); padding: 3px 8px; white-space: pre-wrap; }
  .ck-btn { background: none; border: none; color: var(--muted); padding: 0 4px; font-size: 14px; }
  .ck-btn:hover { color: var(--brand); }
  .ck-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ck-phase.complete h3::after { content: ' ✓'; color: var(--ok); }
  textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; min-height: 420px; line-height: 1.45; }
  /* Kalender */
  .cal { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8fafc; border-bottom: 1px solid var(--line); }
  .cal-head div { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); min-height: 96px; }
  .cal-week:last-child { border-bottom: none; }
  .cal-day { grid-row: 1 / -1; border-right: 1px solid var(--line); }
  .cal-day:nth-child(14n-1) { border-right: none; }
  .cal-day.we { background: #fafbfc; }
  .cal-num { grid-row: 1; padding: 4px 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; min-width: 0; }
  .cal-num.out { color: #b8c0ca; }
  .cal-num.today span { background: var(--danger); color: #fff; border-radius: 99px; padding: 1px 6px; font-weight: 700; }
  .cal-bar { z-index: 1; margin: 2px 3px; height: 21px; line-height: 21px; font-size: 11.5px; color: #fff; padding: 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 500; }
  .cal-bar:hover { filter: brightness(1.1); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  dialog { border: none; border-radius: 12px; padding: 22px; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20,30,40,.45); }
  .note { background: #fdf2e0; border: 1px solid #f3d9a8; color: #7a5300; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  /* ---------- Look: hell, weich, abgerundet ---------- */

  .layout { gap: 14px; padding: 14px; }

  .collapsed .nav-sec { display: none; }

  /* Checklisten-Editor */
  .ed-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .ed-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid #f0efea; background: #fff; }
  .ed-row:last-child { border-bottom: none; }
  .ed-row > input { flex: 1; min-width: 120px; padding: 6px 9px; }
  .ed-phase { background: #f4f3ee; }
  .ed-phase > input { font-weight: 600; }
  .ed-tools { display: flex; gap: 0; }
  .ed-mail { width: auto; max-width: 190px; padding: 5px 6px; font-size: 12.5px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); border: 1px solid #e3e2dc; border-radius: 99px; padding: 3px 9px; margin: 0; cursor: pointer; white-space: nowrap; user-select: none; }
  .chip input { display: none; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* Dashboard: vor Baustart offen */

  .of-proj:last-child { border-bottom: none; }
  .of-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; margin-bottom: 4px; }
  .of-item { display: flex; align-items: center; gap: 10px; padding: 4px 0 4px 2px; font-size: 14px; }
  .of-item input { width: 17px; height: 17px; accent-color: var(--bar); flex-shrink: 0; cursor: pointer; }
  .of-item > span { flex: 1; min-width: 0; }
  /* Baufreigabe, Einklappen */
  .frei { border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-weight: 500; }
  .frei.ok { background: #eef6e6; color: #3d5a12; border: 1px solid #cfe3b8; }
  .frei.rot { background: #fdecea; color: #8e2318; border: 1px solid #f3c2bb; cursor: pointer; }
  .rot-txt { color: var(--danger); }
  .ck-row.rot { background: #fdf3f1; box-shadow: inset 3px 0 0 var(--danger); }
  .ck-row.rot .ck-txt > span:first-child { color: #8e2318; }
  .ck-phase.rot { border-color: #f3c2bb; }
  .ck-klick { cursor: pointer; user-select: none; }
  .ck-phase.zu { padding-bottom: 14px; }
  .ck-pfeil { width: 18px; flex-shrink: 0; display: inline-block; text-align: center; color: var(--muted); padding: 0; }
  .of-proj.kritisch .of-head b { color: #8e2318; }
  .of-item.rot > span { color: #8e2318; }
  .of-head .link:hover { text-decoration: underline; }
  /* Arbeitsauftrag (IBN- / Service-Rapport) */
  .aa { font-size: 14px; color: #1d1d1f; }
  .aa-logo { text-align: center; margin: 2px 0 10px; }
  .aa-logo img { height: 40px; }
  .aa-logo .logo { display: inline-block; }
  .aa-linie { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #00558c, #0096c8 35%, #78be3c 70%, #e6c828); margin-bottom: 12px; }
  .aa-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: #37474f; color: #fff; border-radius: 10px; padding: 8px 14px; }
  .aa-bar-r { display: flex; gap: 16px; flex-wrap: wrap; }
  .aa-bar label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: #fff; font-size: 13px; }
  .aa-bar input { width: auto; padding: 3px 6px; border-radius: 6px; border: none; background: #fff; }
  .aa-titel { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 14px; font-size: 24px; font-weight: 700; }
  .aa-titel span { white-space: nowrap; }
  .aa-titel input { font: inherit; border: none; border-bottom: 1.5px dashed #d0d0d0; border-radius: 0; background: none; padding: 0 2px; min-width: 0; }
  .aa-3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 6px; }
  .aa-3 > div { padding: 0 14px; border-left: 1px solid #ddd; }
  .aa-3 > div:first-child { padding-left: 0; border-left: none; }
  .aa-3.aa-2sp { grid-template-columns: repeat(2, 1fr); }
  .aa-schalter { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin: 0 0 14px; font-size: 13px; }
  .aa-schalter .aa-std { margin: 0; }
  .aa h4 { display: flex; align-items: center; gap: 7px; margin: 0 0 6px; font-size: 15px; }
  .aa h4 svg { width: 19px; height: 19px; fill: #37474f; flex: none; }
  .aa textarea { min-height: 0; resize: vertical; }
  .aa-h { margin-top: 18px !important; flex-wrap: wrap; }
  .aa-h .muted { font-weight: 400; font-size: 12.5px; }
  .aa-std { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 0; font-weight: 500; color: inherit; }
  .aa-std input { width: auto; }
  .aa-stunden { margin-top: 8px; border-collapse: collapse; width: 100%; font-size: 12px; }
  .aa-stunden th { background: #37474f; color: #fff; padding: 5px; font-weight: 600; }
  .aa-stunden td { border: 1px solid #ddd; height: 24px; }
  .aa-gruppen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .aa-box { background: #fff; border: 1px solid #e6e6e6; border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 10px rgba(0, 0, 0, .07); display: flex; flex-direction: column; gap: 3px; }
  .aa-box.aa-pl { border-color: #cfe0b4; background: #fbfdf6; }
  .aa-box-kopf { display: flex; gap: 6px; align-items: center; }
  .aa-gtitel { font-weight: 700; border: none; background: none; padding: 3px 2px; }
  .aa-wer { margin: 2px 0 5px; align-self: flex-start; }
  .aa-wer button { font-size: 11.5px; padding: 3px 8px; }
  .aa-pkt { display: flex; gap: 6px; align-items: center; }
  .aa-pkt input:not([type=checkbox]) { padding: 3px 6px; font-size: 13px; border-color: transparent; background: none; }
  .aa-pkt input:not([type=checkbox]):hover, .aa-pkt input:not([type=checkbox]):focus { background: #f6f6f3; }
  .aa-pkt input[type=checkbox] { width: 15px; height: 15px; flex: none; margin: 0; }
  .aa-leer { display: inline-block; width: 13px; height: 13px; flex: none; border: 1.5px solid #9a9a9a; border-radius: 3px; vertical-align: -2px; }
  .aa-box > .sec.sm { align-self: flex-start; margin-top: 4px; }
  .aa-neu { border: 1.5px dashed #c8c8c0; background: none; color: var(--muted); border-radius: 12px; min-height: 80px; }
  .aa-neu:hover { border-color: #9a9a92; color: var(--text); }
  .aa-fuss { margin-top: 18px; padding-top: 10px; border-top: 1px solid #e6e6e6; }
  .aa-fuss-kopf { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .aa-linien { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
  .aa-linien span { border-bottom: 1px solid #888; font-size: 12px; color: #555; padding-bottom: 2px; }
  /* Abnahmeprotokoll */
  .ab-2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; }
  .ab-liste { display: flex; flex-direction: column; gap: 3px; }
  .ab-liste > .sec.sm { align-self: flex-start; margin-top: 4px; }
  .ab-pkt { display: flex; gap: 6px; align-items: center; }
  .ab-pkt input:not([type=checkbox]) { padding: 4px 7px; font-size: 13px; }
  .ab-pkt input[type=checkbox] { width: 15px; height: 15px; flex: none; margin: 0; }
  .ab-text { flex: 1; min-width: 0; font-weight: 600; }
  .ab-detail { flex: 1.1; min-width: 0; }
  .ab-maengel { margin-top: 18px; border: 1px solid #d9d9d9; border-radius: 12px; padding: 12px 14px; }
  .ab-tab td:first-child { text-align: center; color: #777; }
  .ab-zeilen { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 8px 0 10px; }
  .ab-zeilen label { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-weight: 600; color: inherit; }
  .ab-zeilen input { width: 70px; padding: 4px 8px; }
  /* Mängelliste */
  .ml-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .ml-karte { background: #fff; border: 1px solid #e6e6e6; border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 10px rgba(0, 0, 0, .07); display: flex; flex-direction: column; gap: 8px; }
  .ml-karte.ml-ok { background: #f7fbef; border-color: #cfe0b4; }
  .ml-karte.ml-ok .ml-bild img { opacity: .6; }
  .ml-kopf { display: flex; gap: 8px; align-items: center; }
  .ml-kopf b { white-space: nowrap; }
  .ml-bereich { flex: 1; min-width: 0; padding: 4px 8px; font-size: 13px; }
  .ml-bild { display: grid; place-items: center; height: 190px; margin: 0; border-radius: 10px; background: #f4f4f1; border: 1.5px dashed #cfcfc8; cursor: pointer; overflow: hidden; color: var(--muted); text-align: center; font-weight: 600; }
  .ml-bild.hat { border-style: solid; border-color: #e6e6e6; background: #f4f4f1; }
  .ml-bild img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .ml-bild small { font-weight: 400; }
  .ml-bild:hover { border-color: #9a9a92; }
  .ml-fuss { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ml-erledigt { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 600; color: inherit; }
  .ml-erledigt input { width: 16px; height: 16px; margin: 0; }
  .ml-neu { min-height: 260px; }
  .mg-item { align-items: center; }
  .mg-bild { width: 38px; height: 30px; object-fit: cover; border-radius: 6px; flex: none; background: #f1f1ec; }
  .ab-unter { grid-template-columns: 1fr 1fr 1fr; margin-top: 26px; }
  /* Dokumente im Projekt */
  .dok-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .dok-karte { display: flex; gap: 12px; align-items: flex-start; margin: 0; }
  .dok-ic { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #f1f1ec; color: #37474f; flex: none; }
  .dok-ic svg { width: 22px; height: 22px; }
  .ab-edit td { padding: 2px 3px; }
  .ab-edit td:first-child { color: #777; }
  .ab-edit input { padding: 4px 7px; font-size: 13px; }
  .dok-knoepfe { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  @media (max-width: 700px) {
    .ab-2, .ab-unter, .ml-grid { grid-template-columns: 1fr; }
    .aa-3, .aa-linien { grid-template-columns: 1fr; }
    .aa-3 > div { padding: 10px 0 0; border-left: none; }
    .aa-titel { font-size: 19px; flex-wrap: wrap; }
  }
  /* Checkliste Blitzschutz (LASOLTEC) */
  .bz-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 3px solid #f6c400; padding-bottom: 8px; margin-bottom: 10px; }
  .bz-kopf h2 { margin: 4px 0 0; color: #1f3864; font-weight: 400; font-size: 24px; }
  .bz h3 { color: #2f5496; margin: 16px 0 8px; }
  .bz-feld { margin-bottom: 10px; }
  .bz-feld textarea { min-height: 0; }
  .bz-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .bz-box { display: flex; align-items: flex-start; gap: 8px; color: var(--text); font-size: 14px; margin: 0 0 9px; cursor: pointer; }
  .bz-box input { width: 17px; height: 17px; margin-top: 1px; flex-shrink: 0; accent-color: #1f3864; }
  @media (max-width: 700px) { .bz-2 { grid-template-columns: 1fr; } }
  /* Anmeldung und Cloud */
  .login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
  body.gesperrt .login { display: flex; }
  body.gesperrt .layout { display: none; }
  .login-card { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 34px 30px; width: min(400px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .side-user { padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .side-user b { color: var(--text); font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-user button { margin-top: 6px; }
  .collapsed .side-user { padding: 10px 0; text-align: center; }
  .collapsed .side-user .side-txt { display: none; }
  /* Kontakte und Projekt-Übersicht */
  .avatar { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; letter-spacing: .02em; }
  .avatar.klein { width: 26px; height: 26px; font-size: 10.5px; }
  .ueb-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
  .ueb-grid > .card { margin-bottom: 18px; }
  .ueb-kunde { margin-bottom: 8px; }
  .personen { display: grid; gap: 2px; }
  .person { display: flex; gap: 12px; align-items: center; padding: 9px 8px; border-radius: 12px; }
  .person:hover { background: #f8f8f4; }
  .p-info { flex: 1; min-width: 0; }
  .p-info .muted { font-size: 12.5px; }
  .p-kontakt { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 2px; }
  .p-kontakt a, .table-wrap a { color: var(--text); text-decoration: none; border-bottom: 1px dotted #b9b8b0; }
  .p-kontakt a:hover, .table-wrap a:hover { border-bottom-color: var(--text); }
  .p-aktion { display: flex; gap: 2px; }
  .plan-vorschau { cursor: pointer; border-radius: 16px; transition: box-shadow .2s, transform .2s; }
  .plan-vorschau:hover { box-shadow: 0 0 0 3px #e6eebb; }
  .plan-vorschau .xg { pointer-events: none; }
  .crm-zeile { margin-bottom: 14px; }
  .crm-link { padding: 10px 12px; background: #eef5fb; border: 1px solid #cfe0ef; border-radius: 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .klein { font-size: 12px; }
  table.std-tab { min-width: 1250px; }
  table.std-tab td { padding: 5px 4px; }
  table.std-tab input:not([type=color]), table.std-tab select { min-width: 120px; }
  @media (max-width: 900px) { .ueb-grid { grid-template-columns: 1fr; } }
  /* Gewerk-Suche und Gewerk-Dialog */
  .gw-wahl { position: relative; }
  .gw-liste { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); max-height: 340px; overflow-y: auto; background: #fff;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(20, 20, 10, .14); padding: 6px; min-width: 300px; }
  .gw-gruppe { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 10px 4px; }
  .gw-opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .gw-opt .swatch { margin-top: 3px; }
  .gw-opt .klein { font-size: 12px; margin-top: 1px; }
  .gw-opt.aktiv { background: #f1f0eb; }
  .gw-opt.gewaehlt b { color: var(--ok); }
  .gw-opt mark { background: #eef5c4; color: inherit; border-radius: 3px; padding: 0 1px; }
  .gw-neu { color: var(--text); font-weight: 600; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; padding-top: 10px; }
  .seg-breit { display: flex; width: 100%; }
  .seg-breit button { flex: 1; padding: 8px 6px; }
  /* Art beim Erstellen: PV-Projekt, Batterienachrüstung, Service-Auftrag */
  .art-wahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .art-wahl button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; background: #fff; color: var(--text);
    border: 1.5px solid #e3e2dc; border-radius: 12px; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .art-wahl button:hover { border-color: #b9b8b0; transform: translateY(-1px); }
  .art-wahl button.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--lime); }
  .art-wahl .art-ic { font-size: 22px; line-height: 1.2; }
  .art-wahl b { font-size: 13px; }
  .art-wahl small { font-size: 11px; color: var(--muted); }
  .art-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #eef4fb; color: #00558c; }
  .art-tag.art-service { background: #fdf1e3; color: #b35c00; }
  .sv-row:last-child { border-bottom: none; }
  .sv-row.sv-alt { box-shadow: inset 3px 0 0 var(--danger); padding-left: 10px; }
  .frage { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: #f6f8ea; border: 1px solid #e1eab5; }
  @media (prefers-reduced-motion: no-preference) { .gw-liste:not([hidden]) { animation: aufgehen .18s cubic-bezier(.2, .8, .2, 1); } }
  .zeitfeld { display: flex; align-items: center; gap: 6px; }
  .zeitfeld input { min-width: 0; }
  .wk-zeit { display: block; font-size: 11px; color: var(--text); }
  /* Mikroanimationen */
  nav a { position: relative; }
  nav a.active::before { content: ''; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--lime); }
  .next { position: relative; overflow: hidden; }
  .b-laufend::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
  .xg-today::before { content: ''; position: absolute; top: 2px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .ck-phase.complete { border-color: #dbe7a8; background: linear-gradient(180deg, #fbfdf2, #fff 60%); }
  .kpi { cursor: pointer; }
  .funke { position: fixed; width: var(--g); height: var(--g); margin: calc(var(--g) / -2) 0 0 calc(var(--g) / -2); border-radius: 50%; pointer-events: none; z-index: 60; animation: funke .75s cubic-bezier(.15, .7, .3, 1) forwards; }
  .of-item { max-height: 90px; }
  @media (prefers-reduced-motion: no-preference) {
    /* Seiten- und Tabwechsel: ein Element blendet ein statt vieler einzelner Karten (backwards: danach kein transform mehr) */
    .rein { animation: seite-rein .28s cubic-bezier(.2, .7, .2, 1) backwards; will-change: opacity, transform; }
    .rein .progress div, .rein .prog div { animation: wachsen .6s cubic-bezier(.2, .7, .2, 1) .1s backwards; transform-origin: left center; }
    .rein .gauge .g-l { animation: blende .25s calc(var(--i) * 10ms + .1s) backwards; }
    .progress div, .prog div { transition: width .6s cubic-bezier(.2, .7, .2, 1), background-color .3s; }
    .xg-bar i { transition: width .6s cubic-bezier(.2, .7, .2, 1); }
    .g-l { transition: stroke .5s; }
    .card, .kpi, .pcard, .li, .of-head, .wk-chip, .ck-phase { transition: box-shadow .25s, transform .25s, border-color .25s, background-color .25s; }
    .pcard:hover, .kpi:hover, .next:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(20, 20, 10, .09); border-color: #dbe5a6; }
    .card:not(.next):not(.ck-phase):hover { box-shadow: 0 6px 22px rgba(20, 20, 10, .05); }
    .li:hover { transform: translateX(4px); }
    .ck-row:hover { background-color: #fafaf6; }
    .ck-row.done .ck-txt > span:first-child { transition: color .4s; }
    nav a.active::before { animation: balken .35s cubic-bezier(.3, 1.4, .5, 1); transform-origin: center; }
    .next::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%); transform: translateX(-110%); animation: glanz 8s ease-in-out 1.5s infinite; }
    .b-laufend::before { animation: puls 1.8s ease-in-out infinite; }
    .xg-today::before { animation: puls-rot 1.8s ease-in-out infinite; }
    .of-item.weg { animation: wegklappen .38s cubic-bezier(.4, 0, .2, 1) forwards; overflow: hidden; }
    .ck-phase.complete h3::after { display: inline-block; animation: aufploppen .5s cubic-bezier(.3, 1.6, .5, 1); }
    .wk-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0, 0, 0, .08); }
    button { transition: background-color .15s, color .15s, transform .12s, box-shadow .15s; }
    button:active:not(:disabled) { transform: scale(.96); }
    nav a, .tabs button, .chip, .seg button { transition: background-color .18s, color .18s, box-shadow .18s; }
    nav a svg { transition: transform .2s; }
    nav a:hover svg { transform: scale(1.12); }
    .layout { transition: grid-template-columns .28s cubic-bezier(.2, .7, .2, 1); }
    input, select, textarea { transition: border-color .15s, box-shadow .15s, background-color .15s; }
    dialog[open] { animation: aufgehen .26s cubic-bezier(.2, .8, .2, 1); }
    dialog[open]::backdrop { animation: blende .26s ease; }
    .login-card { animation: aufgehen .45s cubic-bezier(.2, .8, .2, 1); }
    .toast { transition: opacity .25s, transform .25s cubic-bezier(.2, .8, .2, 1); transform: translateX(-50%) translateY(10px); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .ck-row { transition: background-color .3s; }
    .ck-row.pop { animation: aufleuchten 1s ease; }
    .ck-row.pop input[type=checkbox] { animation: hops .35s cubic-bezier(.3, 1.6, .5, 1); }
    .frei.rot { animation: pulsieren 2.4s ease-in-out infinite; }

    if (d > bestD) { best = c; bestD = d; }

// eine Zeile pro Eintrag; Grundlage für Checkliste und Editor
function zeilenAusText(text) {
  const flags = (s, z) => s.replace(/\[(datum|oder|!|mail:[^\]]*|dok:[^\]]*)\]/gi, (m, f) => {
    f = f.toLowerCase();
    if (f === 'datum') z.datum = true; else if (f === 'oder') z.oder = true; else if (f === '!') z.wichtig = true;
    else if (f.startsWith('mail:')) z.mail = m.slice(6, -1).trim(); else z.dok = m.slice(5, -1).trim().toLowerCase();
    return '';
  }).replace(/\s+/g, ' ').trim();
  return String(text || '').split('\n').filter(l => l.trim()).map(raw => {
    if (raw.trim().startsWith('#')) { const z = { typ: 'phase', wichtig: false }; z.text = flags(raw.trim().replace(/^#+\s*/, ''), z); return z; }
    const z = { typ: 'item', lvl: Math.floor(raw.replace(/\t/g, '  ').match(/^ */)[0].length / 2), datum: false, oder: false, wichtig: false, mail: '', dok: '' };
    z.text = flags(raw.trim(), z);
    return z;
  });
}
function textAusZeilen(lines) {
  return lines.filter(z => z.text.trim()).map(z => z.typ === 'phase' ? '\n# ' + z.text.trim() + (z.wichtig ? ' [!]' : '')
    : '  '.repeat(z.lvl) + z.text.trim() + (z.datum ? ' [datum]' : '') + (z.oder ? ' [oder]' : '') + (z.wichtig ? ' [!]' : '')
      + (z.mail ? ` [mail: ${z.mail}]` : '') + (z.dok ? ` [dok: ${z.dok}]` : '')).join('\n').trim();
}

  const walk = n => { std.set(n.key, n); n.children.forEach(walk); };
  parseCheckliste(CHECKLISTE_VORLAGE).forEach(ph => { stdPh.set(ph.titel.toLowerCase(), ph); ph.items.forEach(walk); });

  const stack = [], lines = zeilenAusText(text);
  lines.forEach(z => {
    if (z.typ === 'phase') { phase = z.text; stack.length = 0; if (stdPh.get(phase.toLowerCase())?.wichtig) z.wichtig = true; return; }
    while (stack.length > z.lvl) stack.pop();
    const s = std.get([phase, ...stack, z.text].join(' › ').toLowerCase());
    if (s) { z.mail = z.mail || s.mail; z.dok = z.dok || s.dok; z.wichtig = z.wichtig || s.wichtig; }
    stack.push(z.text);

}

function zeilenMitKey(text) {

    if (z.typ === 'phase') { phase = z.text; stack.length = 0; return { ...z, key: 'phase:' + phase.toLowerCase() }; }
    while (stack.length > z.lvl) stack.pop();
    const key = [phase, ...stack, z.text].join(' › ').toLowerCase();
    stack.push(z.text);

}
// Änderungen der Vorlage (alt → neu) auf die Checkliste eines Projekts übertragen.

// Ohne alt werden nur fehlende Punkte der Vorlage ergänzt.
function vorlageUebertragen(projText, altText, neuText) {
  const N = zeilenMitKey(neuText), A = altText == null ? null : zeilenMitKey(altText);
  const imAlt = new Map((A || []).map(z => [z.key, z])), imNeu = new Set(N.map(z => z.key));
  let L = zeilenMitKey(projText);
  if (A) {
    const weg = A.filter(z => !imNeu.has(z.key)).map(z => z.key);
    L = L.filter(z => !weg.some(k => z.key === k || z.key.startsWith((k.startsWith('phase:') ? k.slice(6) : k) + ' › ')));
    N.forEach(n => {
      const a = imAlt.get(n.key), z = a && L.find(x => x.key === n.key);
      if (z) ['datum', 'oder', 'wichtig', 'mail', 'dok'].forEach(f => { if ((a[f] || '') !== (n[f] || '') && (z[f] || '') === (a[f] || '')) z[f] = n[f]; });
    });
  }
  N.forEach((n, i) => {
    if (L.some(z => z.key === n.key) || imAlt.has(n.key)) return;
    // hinter dem vorherigen Eintrag der Vorlage einfügen (nach dessen Unterpunkten)
    let pos = -1;
    for (let j = i - 1; j >= 0 && pos < 0; j--) pos = L.findIndex(z => z.key === N[j].key);

}
function parseCheckliste(text) {

    if (!phasen.length) phasen.push({ titel: 'Allgemein', items: [] });
    const ph = phasen[phasen.length - 1];
    while (stack.length > z.lvl) stack.pop();
    const parent = stack[stack.length - 1];
    const node = { ...z, key: [ph.titel, ...stack.map(n => n.text), z.text].join(' › ').toLowerCase(), children: [],
      label: [...stack.slice(-1).map(n => n.text), z.text].join(' › ') };

}

  return { done, total, ph, pct: total ? Math.round(done / total * 100) : 0 };
}

function zeitachse(termine) {

// ---------- DOM-Abgleich: nur Geändertes anfassen, damit nichts flackert und Übergänge laufen ----------
function morphHtml(el, html) {
  const neu = el.cloneNode(false);
  neu.innerHTML = html;
  morphKinder(el, neu);
}
// data-form: wechselt der Wert, wird das Formular neu aufgebaut (z.B. nach dem Speichern leeren)
const gleichArt = (a, b) => a.nodeType === b.nodeType && (a.nodeType !== 1 || (a.tagName === b.tagName && (a.id || '') === (b.id || '')
  && a.getAttribute('data-form') === b.getAttribute('data-form')));
function morphKinder(alt, neu) {
  const kinder = [...neu.childNodes];
  kinder.forEach((nk, i) => {
    const ak = alt.childNodes[i];
    if (!ak) alt.appendChild(nk);
    else if (!gleichArt(ak, nk)) alt.replaceChild(nk, ak);
    else if (nk.nodeType === 1) morphElement(ak, nk);
    else if (ak.nodeValue !== nk.nodeValue) ak.nodeValue = nk.nodeValue;
  });
  while (alt.childNodes.length > kinder.length) alt.removeChild(alt.lastChild);
}
function morphElement(alt, neu) {
  const tag = alt.tagName, fokus = document.activeElement === alt;
  // Formularwerte vor dem Abgleich der Kinder merken (Optionen werden dabei verschoben)
  // Eingaben des Nutzers bleiben erhalten, solange sich der gespeicherte Wert nicht geändert hat
  const selAlt = tag === 'SELECT' ? [...alt.options].findIndex(o => o.hasAttribute('selected')) : -1;
  const selIdx = tag === 'SELECT' ? [...neu.options].findIndex(o => o.hasAttribute('selected')) : -1;
  const taAlt = tag === 'TEXTAREA' ? alt.textContent : null, taWert = tag === 'TEXTAREA' ? neu.textContent : null;
  const wertAlt = alt.getAttribute('value'), wertNeu = neu.getAttribute('value');
  // nachgeladene Bilder (data-bild) behalten ihre Quelle, solange es dasselbe Bild ist
  const bildBleibt = tag === 'IMG' && alt.dataset.bild && alt.dataset.bild === neu.getAttribute('data-bild');
  for (const a of [...alt.attributes]) if (!neu.hasAttribute(a.name) && !(bildBleibt && a.name === 'src')) alt.removeAttribute(a.name);
  for (const a of [...neu.attributes]) if (alt.getAttribute(a.name) !== a.value) alt.setAttribute(a.name, a.value);
  if (tag === 'TEXTAREA') { if (!fokus && taAlt !== taWert) { alt.textContent = taWert; alt.value = taWert; } return; }
  morphKinder(alt, neu);
  if (tag === 'INPUT') {
    if (alt.type === 'checkbox' || alt.type === 'radio') alt.checked = neu.hasAttribute('checked');
    else if (alt.type !== 'file' && !fokus && wertAlt !== wertNeu) alt.value = wertNeu ?? '';
  } else if (tag === 'SELECT' && !fokus && selAlt !== selIdx) alt.selectedIndex = selIdx >= 0 ? selIdx : 0;
}
// Zahlen beim Öffnen einer Ansicht hochzählen
function zaehlerStarten(wurzel) {
  if (wenigBewegung()) return;
  wurzel.querySelectorAll('[data-zahl]').forEach(el => {
    const ziel = +el.dataset.zahl, suffix = el.dataset.suffix || '', t0 = performance.now();
    if (!ziel) return;
    const schritt = t => {
      const k = Math.min(1, (t - t0) / 750), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(ziel * e) + suffix;
      if (k < 1) requestAnimationFrame(schritt);
    };
    el.textContent = '0' + suffix;
    requestAnimationFrame(schritt);
    setTimeout(() => { el.textContent = ziel + suffix; }, 900); // falls der Browser keine Frames zeichnet (Hintergrund)
  });
}

// Halbkreis-Anzeige aus Strichen
function gauge(pct, label) {
  let s = '';
  for (let i = 0, n = 40; i <= n; i++) {
    const a = Math.PI * (1 - i / n), c = Math.cos(a), sn = Math.sin(a);
    const an = i / n * 100 <= pct && pct > 0;
    s += `<line class="g-l ${an ? 'an' : ''}" style="--i:${i}" x1="${(100 + 68 * c).toFixed(1)}" y1="${(100 - 68 * sn).toFixed(1)}" x2="${(100 + 86 * c).toFixed(1)}" y2="${(100 - 86 * sn).toFixed(1)}"
      stroke="${an ? '#18181b' : '#d6d4cb'}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  return `<svg class="gauge" viewBox="0 0 200 112" width="230" role="img" aria-label="${label} ${pct}%">${s}
    <text x="100" y="88" text-anchor="middle" font-size="28" font-weight="600" fill="#18181b" font-family="Inter, sans-serif" data-zahl="${pct}" data-suffix="%">${pct}%</text>
    <text x="100" y="106" text-anchor="middle" font-size="11" fill="#74747c" font-family="Inter, sans-serif">${label}</text></svg>`;
}

// Punkte, die vor Baustart erledigt sein müssen: alle Hauptpunkte der Phasen mit [!] (Planung bis Beschaffung)
// sowie einzeln mit [!] markierte Punkte in anderen Phasen
function offenWichtig(p) {
  const out = [];
  const walk = (n, pfad) => {
    if (n.wichtig && !chkDone(p, n)) out.push({ n, pfad });
    n.children.forEach(c => walk(c, [...pfad, n.text]));
  };
  parseCheckliste(p.checkliste).forEach(ph => ph.items.forEach(n => {
    if (ph.wichtig) { if (!chkDone(p, n)) out.push({ n, pfad: [ph.titel] }); }
    else walk(n, [ph.titel]);
  }));
  return out;
}
const FREIGABE_TAGE = 7; // ab so vielen Tagen vor Baustart werden offene Punkte rot
function freigabe(p) {
  const s = span(p), offen = offenWichtig(p), tage = s ? diffDays(todayIso(), s.start) : null;
  return { s, offen, tage, kritisch: offen.length > 0 && tage !== null && tage <= FREIGABE_TAGE && (s.ende >= todayIso()) };
}
function freigabeHinweis(p) {
  const f = freigabe(p);
  if (!f.s) return '';
  if (!f.offen.length) return `<div class="frei ok">✓ Baufreigabe: alle Punkte bis «Beschaffung & Baustellenlogistik» sind erledigt.</div>`;
  if (!f.kritisch) return '';
  return `<div class="frei rot" onclick="ui.tab='checkliste';render()">⚠ ${f.tage < 0 ? `Bau läuft seit ${fmt(f.s.start)}` : f.tage === 0 ? 'Baustart ist heute' : `Baustart in ${f.tage} Tagen (${fmtLong(f.s.start)})`}
    – ${f.offen.length} Punkt${f.offen.length > 1 ? 'e' : ''} vor Baustart noch offen. Der Bau darf erst starten, wenn alles erledigt ist.</div>`;
}
// Service-Aufträge: Status aus der Checkliste (Datumspunkt = Termin, [dok: ibn] = Rapport), Termin sonst aus dem Terminplan
function serviceStatus(p) {
  const st = chkStats(p), alle = [];
  const walk = n => { alle.push(n); n.children.forEach(walk); };
  st.ph.forEach(ph => ph.items.forEach(walk));
  const tn = alle.find(n => n.datum && (p.chk[n.key] || {}).datum), rap = alle.filter(n => n.dok === 'ibn');
  const termin = tn ? p.chk[tn.key].datum : span(p)?.start || '';
  const rapportFertig = rap.length > 0 && rap.every(n => chkDone(p, n));
  // Rapport begonnen (Formular geöffnet) oder abgehakt, aber Auftrag noch nicht ganz erledigt
  const key = st.total && st.done === st.total ? 'erledigt' : rapportFertig || p.ibn ? 'rapport' : termin ? 'termin' : 'offen';
  return { key, termin, rapportFertig, tage: p.erstellt ? diffDays(p.erstellt, todayIso()) : null, st };
}

}

const DOK_ICONS = {

  termine: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
// Checklisten-Punkt, an dem ein Dokument hängt ([dok: …])
function dokPunkt(p, dok) {
  let f = null;
  const walk = n => { if (!f && n.dok === dok) f = n; n.children.forEach(walk); };
  parseCheckliste(p.checkliste).forEach(ph => ph.items.forEach(walk));
  return f;
}
function viewDokumente(p) {
  const id = p.id, service = projektArt(p) === 'service', nT = p.termine.length;

    { icon: 'rapport', titel: rapportName(p), info: 'Arbeitsauftrag für den Monteur', dok: 'ibn', da: !!p.ibn, auf: `ibnDialog('${id}')`, pdf: `ibnPdf('${id}')` },
    ...(service ? [] : [
      { icon: 'zwischen', titel: 'Zwischenabnahmeprotokoll', info: 'Teile der Anlage abnehmen und Mängel festhalten', dok: 'zwischen', da: !!p.zwischen, auf: `zwischenDialog('${id}')`, pdf: `zwischenPdf('${id}')`,
        stand: (z => z.total ? (z.offen ? `<span class="tag-warn">${z.offen} Mängel offen</span>` : `<span class="tag-ok">✓ alle ${z.total} Mängel erledigt</span>`) : '')(zwischenOffen(p)) },
      { icon: 'abnahme', titel: 'Abnahmeprotokoll', info: 'Offizielle Abnahme mit dem Kunden', dok: 'abnahme', da: !!p.abnahme, auf: `abnahmeDialog('${id}')`, pdf: `abnahmePdf('${id}')` },
      { icon: 'blitz', titel: 'Checkliste Blitzschutz', info: 'Bestellung der Abnahme bei LASOLTEC', dok: 'blitz', da: !!p.blitz, auf: `blitzDialog('${id}')`, pdf: `blitzPdf('${id}')` }]),
    { icon: 'maengel', titel: 'Mängelliste', info: 'Was der Monteur beheben muss, mit Bildern', dok: 'maengel', da: !!p.maengel, auf: `maengelDialog('${id}')`, pdf: `maengelPdf('${id}')`,
      stand: (st => st.total ? (st.offen ? `<span class="tag-warn">${st.offen} offen</span> <span class="muted klein">${st.total - st.offen} erledigt</span>` : `<span class="tag-ok">✓ alle ${st.total} erledigt</span>`) : '')(maengelStand(p)) },
    { icon: 'termine', titel: 'Terminplan', info: nT ? `${nT} Termin${nT > 1 ? 'e' : ''} · PDF auf A3 quer` : 'noch keine Termine erfasst', da: nT > 0, auf: `ui.tab='termine';ui.ganttScroll=true;render()`, aufL: 'Zum Terminplan', pdf: nT ? `pdf('${id}')` : '' }
  ];
  return `<div class="dok-grid">${L.map(x => {
    const n = x.dok && dokPunkt(p, x.dok), fertig = n && chkDone(p, n);

    return `<div class="card dok-karte">

      <div style="flex:1;min-width:0"><b>${x.titel}</b><div class="muted klein">${x.info}</div><div style="margin-top:6px">${x.dok ? status : ''}</div></div>

function viewUebersicht(p) {
  const f = freigabe(p), sp = span(p), termine = sortTermine(p), s = S();
  // offene Punkte bis Baustart

  // Leute im Projekt: Projektleiter, Kunde, Gewerke mit Terminen, zusätzlich zugeordnete Personen
  const kunde = kontaktById(p.kundeId);
  const leute = [{ name: s.name, rolle: 'Projektleiter', firma: s.firma, tel: s.telefon, mail: s.email, farbe: 'var(--ink)' }];
  const gezeigt = new Set();
  p.gewerke.map(x => gewerk(p, x.id)).filter(g => termine.some(t => t.gewerkId === g.id) && (g.kontakt || g.firma || g.email || g.telefon)).forEach(g => {

            aktion: `<button class="ck-btn" title="Kunde bearbeiten" onclick="kontaktDialog('${kunde.id}')">✎</button><button class="ck-btn" title="anderen Kunden wählen" onclick="findP('${p.id}').kundeId='';save();render()">✕</button>` })

    ${termine.length ? `<div class="plan-vorschau" onclick="ui.tab='termine';ui.ganttScroll=true;render()" title="Zum Terminplan">${gantt(p, termine, { zoom: 'woche', vorschau: true })}</div>`

}

// ---------- Checkliste ----------
let chkKeys = [];
// Eingeklappt-Zustand: ohne eigene Wahl ist ein Bereich zu, sobald er komplett erledigt ist
const istZu = (p, key, fertig) => (p.ckZu && key in p.ckZu) ? p.ckZu[key] : fertig;
function chkZu(pid, i) {
  const p = findP(pid), n = chkKeys[i];
  p.ckZu = p.ckZu || {};
  p.ckZu[n.key] = !istZu(p, n.key, n.fertig);
  save(); render();
}
function chkAlleZu(pid, zu) {
  const p = findP(pid), z = p.ckZu = {};
  parseCheckliste(p.checkliste).forEach(ph => { z['phase:' + ph.titel.toLowerCase()] = zu; ph.items.forEach(n => { if (n.children.length) z[n.key] = zu; }); });
  save(); render();
}
function viewCheckliste(p) {
  const { done, total, ph, pct } = chkStats(p);
  const sp = span(p), fg = freigabe(p);
  const pflicht = new Set(fg.offen.map(o => o.n.key));
  const node = (n, lvl) => {
    const st = p.chk[n.key] || {}, ok = chkDone(p, n);
    const auto = ok && !st.ok && !(n.datum && st.datum);
    if (ui.nurOffen && ok) return '';
    const i = chkKeys.push({ ...n, fertig: ok }) - 1;
    const zu = n.children.length && istZu(p, n.key, ok);
    const pfeil = n.children.length
      ? `<button class="ck-btn ck-pfeil" title="${zu ? 'aufklappen' : 'zuklappen'}" onclick="chkZu('${p.id}',${i})">${zu ? '▸' : '▾'}</button>` : '<span class="ck-pfeil"></span>';
    const sub = n.children.length ? `<span class="muted">${n.children.filter(c => chkDone(p, c)).length}/${n.children.length}${n.oder ? ' · eines davon' : ''}</span>` : '';
    const baustart = /baustart/i.test(n.text) && !st.datum && sp
      ? `<button class="sec sm" onclick="chkDatum('${p.id}',${i},'${sp.start}')">aus Terminplan: ${fmt(sp.start)}</button>` : '';
    const rot = fg.kritisch && pflicht.has(n.key);
    return `<div class="ck-row lvl${lvl} ${ok ? 'done' : ''} ${rot ? 'rot' : ''} ${ui.pop === n.key ? 'pop' : ''}" style="padding-left:${lvl * 28 + 4}px">
      ${pfeil}<input type="checkbox" ${ok ? 'checked' : ''} ${auto ? 'disabled title="Automatisch erledigt (Unterpunkte)"' : ''} onchange="chkSet('${p.id}',${i},this.checked,this)">
      <div class="ck-txt"><span>${esc(n.text)}</span>${sub}${rot ? '<span class="tag-warn">Baustart gefährdet</span>' : n.wichtig ? '<span class="tag-wichtig">vor Baustart</span>' : ''}
        ${n.mail ? `<button class="sec sm" onclick="mailDialog('${p.id}',${i})">✉ Mail</button>` : ''}
        ${DOKS[n.dok] ? `<button class="sec sm" onclick="${DOKS[n.dok].fn}('${p.id}')">📄 ${n.dok === 'ibn' ? rapportName(p) : DOKS[n.dok].label}${DOKS[n.dok].hat(p) ? ' bearbeiten' : ' ausfüllen'}</button>` : ''}
        ${n.datum ? `<input type="date" value="${st.datum || ''}" onchange="chkDatum('${p.id}',${i},this.value)">` : ''}${baustart}
        ${st.ok && st.am ? `<span class="ck-am">✓ ${fmt(st.am)}</span>` : ''}
        ${st.notiz ? `<div class="ck-notiz">${esc(st.notiz)}</div>` : ''}
      </div>
      <button class="ck-btn" title="Notiz" onclick="chkNotiz('${p.id}',${i})">✎</button>
    </div>${zu ? '' : n.children.map(c => node(c, lvl + 1)).join('')}`;
  };
  return `
  <div class="card">
    <div class="ck-head">
      <div><b style="font-size:20px">${done} / ${total}</b> <span class="muted">Punkte erledigt · ${pct}%</span></div>
      <div class="row">
        <label class="check"><input type="checkbox" ${ui.nurOffen ? 'checked' : ''} onchange="ui.nurOffen=this.checked;render()"> nur offene</label>
        <button class="sec sm" onclick="chkAlleZu('${p.id}',false)">Alle aufklappen</button>
        <button class="sec sm" onclick="chkAlleZu('${p.id}',true)">Alle zuklappen</button>
        <button class="sec sm" onclick="chkEditor('${p.id}')">Checkliste anpassen</button>
      </div>
    </div>
    <div class="progress" style="height:10px"><div style="width:${pct}%"></div></div>
  </div>
  ${ph.map((x, pi) => {
    const d = x.items.filter(n => chkDone(p, n)).length, fertig = d === x.items.length;
    const key = 'phase:' + x.titel.toLowerCase(), i = chkKeys.push({ key, fertig }) - 1, zu = istZu(p, key, fertig);
    const rot = fg.kritisch && x.wichtig && !fertig;
    return `<div class="card ck-phase ${fertig ? 'complete' : ''} ${zu ? 'zu' : ''} ${rot ? 'rot' : ''}">
      <div class="ck-head ck-klick" onclick="chkZu('${p.id}',${i})" title="${zu ? 'aufklappen' : 'zuklappen'}">
        <h3 style="margin:0"><span class="ck-pfeil">${zu ? '▸' : '▾'}</span> ${pi + 1}. ${esc(x.titel)}</h3>
        <div class="row">${x.wichtig ? `<span class="${rot ? 'tag-warn' : 'tag-wichtig'}">${rot ? 'vor Baustart offen' : 'vor Baustart'}</span>` : ''}<span class="muted">${d}/${x.items.length}</span></div>
      </div>
      <div class="progress" style="margin:${zu ? '0' : '0 0 6px'}"><div style="width:${x.items.length ? d / x.items.length * 100 : 0}%"></div></div>
      ${zu ? '' : (x.items.map(n => node(n, 0)).join('') || '<div class="muted" style="padding:8px">Alles erledigt.</div>')}
    </div>`;
  }).join('')}`;
}
// chkKeys: Knoten der aktuell angezeigten Checklisten-Punkte (Index wird in onclick verwendet)
const chkState = (p, i) => p.chk[chkKeys[i].key] = p.chk[chkKeys[i].key] || {};
function chkSet(pid, i, v, el) {
  const p = findP(pid), key = chkKeys[i].key, st = chkState(p, i);
  const phase = parseCheckliste(p.checkliste).find(ph => key.startsWith(ph.titel.toLowerCase() + ' › '));
  const phaseFertig = () => phase ? phase.items.every(n => chkDone(p, n)) : false;
  const vorher = phaseFertig(), allesVorher = chkStats(p).done === chkStats(p).total;
  st.ok = v; st.am = v ? todayIso() : '';
  if (v) {
    ui.pop = key; // kurz aufleuchten lassen
    const nachher = phaseFertig(), alles = chkStats(p).done === chkStats(p).total;
    if (el) funken(el, nachher && !vorher ? 28 : 9);
    if (alles && !allesVorher) toast('🎉 Checkliste komplett erledigt!');
    else if (nachher && !vorher) toast(`🎉 Phase «${phase.titel}» abgeschlossen`);
  }
  // im Dashboard verschwindet der erledigte Punkt sanft, bevor neu gezeichnet wird
  const zeile = el && el.closest('.of-item');
  if (zeile && !wenigBewegung()) { zeile.classList.add('weg'); setTimeout(() => { save(); render(); }, 380); }
  else { save(); render(); }
}
// kleine Funken an einem Element (z.B. beim Abhaken)
function funken(el, anzahl) {
  if (wenigBewegung()) return;
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const farben = ['#bfd62f', '#93b81c', '#18181b', '#e67e22', '#5dade2', '#e84393'];
  for (let k = 0; k < anzahl; k++) {
    const f = document.createElement('span'), w = Math.random() * Math.PI * 2, d = (anzahl > 12 ? 50 : 22) + Math.random() * (anzahl > 12 ? 70 : 22);
    f.className = 'funke';
    f.style.cssText = `left:${x}px;top:${y}px;background:${farben[k % farben.length]};--dx:${Math.cos(w) * d}px;--dy:${Math.sin(w) * d}px;--g:${3 + Math.random() * 5}px`;
    document.body.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }
}
function chkDatum(pid, i, v) { const p = findP(pid); chkState(p, i).datum = v; save(); render(); }
function chkNotiz(pid, i) {
  const p = findP(pid), st = chkState(p, i);
  const n = prompt('Notiz zu diesem Punkt:', st.notiz || '');
  if (n === null) return;
  st.notiz = n.trim(); save(); render();
}
// ---------- Mailvorlagen ----------
// IBN-Datum: Termin des IBN-Gewerks im Terminplan, sonst das Datum aus der Checkliste ("Termin von Melih")
function ibnDatum(p) {
  const g = p.gewerke.map(x => gewerk(p, x.id)).find(x => /ibn/i.test(x.name));
  const t = g && sortTermine(p).find(x => x.gewerkId === g.id);
  if (t) return fmt(t.start);
  const st = Object.entries(p.chk).find(([k, s]) => /ibn/.test(k) && /termin/.test(k) && s.datum);
  return st ? fmt(st[1].datum) : '';
}
// Mailvorlage eines Gewerks: direkt gewählt (g.mailvorlage), "keine", oder die Vorlage, die das Gewerk per Name nennt
function effektiveVorlage(g) {
  if (g.mailvorlage === 'keine') return '';
  if (g.mailvorlage) return g.mailvorlage;
  return S().mailvorlagen.find(m => m.gewerk && m.gewerk.toLowerCase() === g.name.toLowerCase())?.name || '';
}
function vorlageSelect(g, attr) {
  const akt = effektiveVorlage(g), namen = S().mailvorlagen.map(m => m.name);
  return `<select ${attr}><option value="keine" ${akt ? '' : 'selected'}>– keine –</option>
    ${[...new Set([...namen, akt].filter(Boolean))].map(n => `<option value="${esc(n)}" ${n === akt ? 'selected' : ''}>✉ ${esc(n)}</option>`).join('')}</select>`;
}
function mailFuellen(p, v, gid) {
  const s = S(), sp = span(p);
  // gewähltes Gewerk, sonst das mit der Vorlage verknüpfte, sonst über den Gewerk-Namen der Vorlage
  const alle = p.gewerke.map(x => gewerk(p, x.id));
  const g = (gid && alle.find(x => x.id === gid)) || alle.find(x => (x.mailvorlage || '').toLowerCase() === v.name.toLowerCase()) || alle.find(x => effektiveVorlage(x) === v.name) || null;
  const gt = g ? sortTermine(p).filter(t => t.gewerkId === g.id) : [];
  const von = t => (t.start === t.ende ? fmtLong(t.start) : `${fmtLong(t.start)} – ${fmtLong(t.ende)}`) + (zeitTxt(t) ? ', ' + zeitTxt(t) : '');
  const vars = {
    // ohne Eintrag im Terminplan bleiben die Felder leer zum selbst Ausfüllen
    projektnummer: p.nummer, projekt: p.name, ort: p.ort || '', baustart: sp ? fmtLong(sp.start) : '', bauende: sp ? fmtLong(sp.ende) : '',
    termin: gt[0] ? von(gt[0]) : '', termine: gt.map(t => `- ${t.titel}: ${von(t)}`).join('\n'),
    baustart_datum: sp ? fmt(sp.start) : '', bauende_datum: sp ? fmt(sp.ende) : '', ibn_datum: ibnDatum(p),
    elektriker_extern: (() => { const e = alle.find(x => /elektr/i.test(x.name) && artOf(x) !== 'intern'); return e ? [e.firma, e.kontakt].filter(Boolean).join(', ') : ''; })(),
    gewerk: g?.name || '', gewerk_firma: g?.firma || '', gewerk_kontakt: g?.kontakt || '', gewerk_telefon: g?.telefon || '',
    pl: s.name, pl_telefon: s.telefon, pl_mail: s.email, firma: s.firma,
    signatur: [s.name, 'Projektleiter', s.firma, s.strasse, s.ort, s.telefon && 'Tel. ' + s.telefon, s.email].filter(Boolean).join('\n')
  };
  const fill = t => String(t || '').replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m).replace(/[ \t]+$/gm, '');
  // Kontakt des Gewerks kommt automatisch ins «An», z.B. "Herr Müller <info@mueller.ch>"
  const anGewerk = g?.email ? (g.kontakt ? `${g.kontakt} <${g.email}>` : g.email) : '';
  return { an: fill(v.an) || anGewerk, betreff: fill(v.betreff), text: fill(v.text), g, gt, sp };
}
let mailPunkt = null; // { pid, node } des Checklisten-Punkts, zu dem der Mail-Dialog offen ist
function mailDialog(pid, i) { mailOeffnen(pid, chkKeys[i].mail, chkKeys[i]); }
// Mail direkt aus einem Gewerk (ohne Checklisten-Punkt)
function gewerkMail(pid, gid) {
  const p = findP(pid), name = effektiveVorlage(gewerk(p, gid));
  if (!name) return toast('Für dieses Gewerk ist keine Mailvorlage gewählt – unter «Bearbeiten» eine wählen oder neu anlegen.');
  mailOeffnen(pid, name, null, gid);
}
function mailOeffnen(pid, name, node, gid) {
  const p = findP(pid);
  const v = S().mailvorlagen.find(m => m.name.toLowerCase() === name.toLowerCase());
  if (!v) return toast(`Mailvorlage «${name}» nicht gefunden – unter Einstellungen → Mailvorlagen anlegen.`);
  const punkt = mailPunkt = node ? { pid, node } : null;
  const m = mailFuellen(p, v, gid), d = $('dlg');
  const hinweis = [
    v.gewerk && !m.g ? `Das Gewerk «${esc(v.gewerk)}» ist in diesem Projekt nicht vorhanden.` : '',
    m.g && !m.gt.length ? `«${esc(m.g.name)}» hat noch keinen Termin im Terminplan – Termin bitte selbst eintragen.` : '',
    !m.sp && /\{baustart\}/.test(v.text) ? 'Der Baustart ist noch nicht im Terminplan.' : '',
    !m.an ? 'Keine E-Mail-Adresse hinterlegt (beim Gewerk eintragen).' : ''
  ].filter(Boolean);
  const erledigt = node && chkDone(p, node);
  d.style.width = 'min(680px, calc(100vw - 32px))';
  d.innerHTML = `<h2>✉ ${esc(v.name)}</h2>
    <p class="muted" style="margin-top:0">Aus dem Terminplan von ${esc(p.nummer)} ${esc(p.name)} ausgefüllt${m.g ? ` · an <b>${esc(gwLabel(m.g))}</b>` : ''}. Text anpassen, kopieren und im Mail einfügen.
      ${node ? `Beim Kopieren wird «${esc(node.label)}» in der Checkliste abgehakt${erledigt ? ' (ist bereits erledigt)' : ''}.` : ''}</p>
    ${hinweis.length ? `<div class="note">${hinweis.join('<br>')}</div>` : ''}
    <label>An</label><div class="copyrow"><input id="m-an" value="${esc(m.an)}" placeholder="E-Mail-Adresse (beim Gewerk hinterlegen)"><button class="sec sm" onclick="kopiere($('m-an').value)">Kopieren</button></div>
    <label>Betreff</label><div class="copyrow"><input id="m-betreff" value="${esc(m.betreff)}"><button class="sec sm" onclick="kopiere($('m-betreff').value)">Kopieren</button></div>
    <label>Text</label><textarea id="m-text" style="min-height:280px;line-height:1.45">${esc(m.text)}</textarea>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="sec" onclick="mailVersendet();location.href='mailto:'+encodeURIComponent($('m-an').value)+'?subject='+encodeURIComponent($('m-betreff').value)+'&body='+encodeURIComponent($('m-text').value)">In Outlook öffnen</button>
      <div class="row"><button class="sec" onclick="$('dlg').close()">Schliessen</button><button onclick="kopiere($('m-text').value, mailVersendet)">Text kopieren</button></div>
    </div>`;
  d.onkeydown = null;
  d.showModal();
  d.addEventListener('close', () => { d.style.width = ''; if (punkt && mailPunkt === punkt) mailPunkt = null; }, { once: true });
}
// Checklisten-Punkt abhaken, sobald die Mail kopiert bzw. geöffnet wurde
function mailVersendet() {
  if (!mailPunkt) return;
  const p = findP(mailPunkt.pid), k = mailPunkt.node.key, st = p.chk[k] = p.chk[k] || {};
  const neu = !st.ok;
  st.ok = true;
  if (neu) st.am = todayIso();
  const notiz = `Mail versendet am ${fmt(todayIso())}`;
  if (!(st.notiz || '').includes(notiz)) st.notiz = [st.notiz, notiz].filter(Boolean).join('\n');
  save(); render();
  if (neu) toast(`Kopiert · «${mailPunkt.node.label}» abgehakt.`);
}
function kopiere(text, danach) {
  const ok = () => { toast('In die Zwischenablage kopiert.'); if (danach) danach(); };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(ok, () => kopiereAlt(text, ok));
  kopiereAlt(text, ok);
}
function kopiereAlt(text, ok) {
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  ($('dlg').open ? $('dlg') : document.body).appendChild(t); t.select();
  try { document.execCommand('copy'); ok(); } catch (e) { toast('Kopieren nicht möglich – bitte markieren und Strg+C drücken.'); }
  t.remove();
}

// ---------- Arbeitsauftrag (IBN- und Service-Rapport) ----------
// Adressblöcke für Rapport und Abnahmeprotokoll (eine Angabe pro Zeile)
const kommaZeilen = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);
function kundeText(p) {
  const k = kontaktById(p.kundeId);
  return k ? [k.name, k.firma, ...kommaZeilen(k.adresse), k.email, k.telefon].filter(Boolean).join('\n') : '';
}
const objektText = p => (p.ort ? kommaZeilen(p.ort) : [p.name]).join('\n');
// Elektriker mit Termin im Terminplan, sonst einer mit eingetragenem Kontakt (nie der Projektleiter als Platzhalter)
function elektrikerText(p) {
  const L = p.gewerke.filter(g => /elektri/i.test(g.name)), mitKontakt = g => g.crm || g.kontakt || g.telefon;
  const roh = L.find(g => p.termine.some(t => t.gewerkId === g.id)) || L.find(mitKontakt);
  if (!roh) return '';
  const g = gewerk(p, roh.id);
  return [g.firma, mitKontakt(roh) ? g.kontakt : '', g.telefon].filter(Boolean).join('\n');
}
function ibnDefaults(p) {
  const g = p.gewerke.map(x => gewerk(p, x.id)).find(x => /ibn/i.test(x.name));
  const t = g ? sortTermine(p).find(x => x.gewerkId === g.id) : null;
  // ohne Termin im Terminplan: Datum aus der Checkliste ("Termin von Melih")
  let termin = t ? t.start : '';
  if (!termin) Object.entries(p.chk).forEach(([k, st]) => { if (!termin && /ibn|service/.test(k) && /termin/.test(k) && st.datum) termin = st.datum; });
  const v = rapVorlage(rapportArt(p));
  // Datum, «Ausgefüllt von», Unterschrift, Stunden und die Monteur-Checklisten füllt der Monteur vor Ort aus
  return {
    v: 2, termin, zeit: t?.plZeit || '', titel: v.titel,
    kunde: kundeText(p), objekt: objektText(p), elektriker: elektrikerText(p),
    arbeiten: '', hinweise: '', pendent: '', stunden: v.stunden, mitElektriker: v.elektriker, mitPendent: v.pendent, gruppen: vorlageKopie(v.gruppen)

function aaG(ctx, op, gi, pi, v) {
  const G = aaZiel(ctx).gruppen, g = G[gi];
  if (op === 'titel') g.titel = v;
  else if (op === 'text') g.punkte[pi].text = v;
  else if (op === 'ok') g.punkte[pi].ok = v;
  else if (op === 'wer') g.wer = v;
  else if (op === 'pdel') g.punkte.splice(pi, 1);
  else if (op === 'padd') g.punkte.push({ text: '', ok: false });
  else if (op === 'gdel') { if (g.punkte.some(x => x.text.trim()) && !confirm(`Gruppe «${g.titel || 'ohne Titel'}» entfernen?`)) return; G.splice(gi, 1); }
  else if (op === 'gadd') G.push({ titel: 'Neue Gruppe', wer: 'monteur', punkte: [{ text: '', ok: false }] });
  save();
  if (['titel', 'text', 'ok'].includes(op)) return;
  const box = docBereich(ctx).querySelector('#aa-gruppen');
  box.innerHTML = aaGruppenHtml(ctx);
  // neues Feld gleich zum Schreiben bereit
  if (op === 'padd') { const L = box.querySelectorAll('.aa-box')[gi].querySelectorAll('.aa-pkt input:not([type=checkbox])'); L[L.length - 1].focus(); }
  if (op === 'gadd') { const L = box.querySelectorAll('.aa-gtitel'); L[L.length - 1].select(); }
}
function ibnPdf(pid) {
  if (!window.jspdf) return toast('PDF-Bibliothek nicht geladen (Internetverbindung?).');
  const p = findP(pid), r = ibnAktuell(p);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14, B = W - 2 * M, DUNKEL = AA_DUNKEL, TXT = AA_TXT;
  const absatz = (t, w) => pdfAbsatz(doc, t, w);
  const platz = h => { if (y + h > H - 16) { doc.addPage(); y = 18; } };
  let y = pdfAaKopf(doc, p.nummer, [['Termin', r.termin ? fmt(r.termin) : ''], ['Zeit', r.zeit ? r.zeit + ' Uhr' : '']], `Arbeitsauftrag: ${r.titel || ''}`);
  y = pdfSpalten(doc, y, [['kunde', 'Kunde', r.kunde], ['objekt', 'Objekt', r.objekt], ...(r.mitElektriker ? [['werkzeug', 'Elektriker', r.elektriker]] : [])]);
  const abschnitt = (titel, text) => {
    platz(14);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...TXT); doc.text(titel, M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
    y += 5.5;
    absatz(text, B).forEach(l => { platz(5); doc.text(l, M, y); y += 4.4; });
    y += 5;
  };
  abschnitt('Auszuführende Arbeiten', r.arbeiten);
  if ((r.hinweise || '').trim()) abschnitt('Hinweise für den Monteur', r.hinweise);
  // Pendente Arbeiten: Bekanntes eingetragen, darunter Linien, auf denen der Monteur Offenes notiert
  if (r.mitPendent) {
    abschnitt('Pendente Arbeiten', r.pendent);
    y -= (r.pendent || '').trim() ? 3 : 7.5;
    doc.setDrawColor(170); doc.setLineWidth(0.25);
    for (let i = 0; i < 3; i++) { platz(8); y += 7; doc.line(M, y, W - M, y); }
    y += 8;
  }

  if (r.stunden) {
    platz(36);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...TXT); doc.text('Stundenrapport', M, y);
    doc.autoTable({
      startY: y + 2.5, margin: { left: M, right: M }, theme: 'grid',
      styles: { fontSize: 8.5, cellPadding: 1.5, lineColor: [205, 205, 205], lineWidth: 0.25, minCellHeight: 8, textColor: 20 },
      headStyles: { fillColor: DUNKEL, textColor: 255, fontStyle: 'bold', halign: 'center', minCellHeight: 6 },
      head: [['Monteur', 'KW', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So', 'Total h']],
      body: [0, 1, 2].map(() => Array(10).fill('')),
      columnStyles: { 0: { cellWidth: 52 }, 1: { cellWidth: 14 }, 9: { cellWidth: 20 } }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  // Ankreuz-Gruppen in Kästchen, drei pro Reihe, möglichst unten über dem Fuss
  const G = r.gruppen.filter(g => g.titel.trim() || g.punkte.some(x => x.text.trim())), gap = 5, bw = (B - 2 * gap) / 3;
  const reihen = [];
  for (let i = 0; i < G.length; i += 3) reihen.push(G.slice(i, i + 3));
  const rh = reihe => 11 + Math.max(...reihe.map(g => g.punkte.filter(x => x.text.trim()).length)) * 5;
  const gesamt = reihen.reduce((a, rr) => a + rh(rr) + gap, 0), fussY = H - 30;
  if (y + gesamt > fussY - 4) { doc.addPage(); y = 18; }
  y = Math.max(y, fussY - 6 - gesamt);
  reihen.forEach(reihe => {
    const h = rh(reihe);
    reihe.forEach((g, i) => {
      const x = M + i * (bw + gap);
      doc.setFillColor(232, 232, 232); doc.roundedRect(x + 0.5, y + 0.8, bw, h, 3, 3, 'F');
      doc.setFillColor(255); doc.setDrawColor(225); doc.setLineWidth(0.25); doc.roundedRect(x, y, bw, h, 3, 3, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...TXT); doc.text(g.titel || '', x + 4, y + 6);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(40);
      g.punkte.filter(x => x.text.trim()).forEach((pt, j) => {
        const yy = y + 11 + j * 5;
        pdfKaestchen(doc, x + 6, yy - 2.6, g.wer === 'pl' && pt.ok);
        doc.text(doc.splitTextToSize(pt.text, bw - 16)[0], x + 11.5, yy);
      });
    });
    y += h + gap;
  });

  // Fuss: wird vom Monteur ausgefüllt
  const fy = Math.max(fussY, y + 4);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...TXT); doc.text('Ausfüllen durch den Monteur', M, fy + 4);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  const rx = W - M - doc.getTextWidth('Arbeit nicht fertig');
  pdfKaestchen(doc, rx - 4.5, fy - 1.6, false); doc.text('Arbeit nicht fertig', rx, fy + 0.8);
  const fx = rx - 9 - doc.getTextWidth('Arbeit fertig');
  pdfKaestchen(doc, fx - 4.5, fy - 1.6, false); doc.text('Arbeit fertig', fx, fy + 0.8);
  const lw = (B - 3 * 8) / 4;
  doc.setFontSize(8.5); doc.setTextColor(60); doc.setDrawColor(150); doc.setLineWidth(0.25);
  ['Datum:', 'Ausgefüllt von:', 'Unterschrift Monteur:', 'Total Arbeit:'].forEach((l, i) => {
    const x = M + i * (lw + 8);
    doc.text(l, x, fy + 14); doc.line(x, fy + 15.5, x + lw, fy + 15.5);
  });
  doc.save(`${rapportName(p)}_${p.nummer}_${p.name}.pdf`.replace(/[\\/:*?"<>|\s]+/g, '_'));
  toast(`${rapportName(p)} als PDF gespeichert.`);
}

    gegenstand: v.gegenstand, pruefung: v.pruefung, erklaerung: art === 'zwischen' ? (v.erklaerungZwischen || ERKLAERUNG_ZWISCHEN) : v.erklaerung,

function zwischenOffen(p) {

function abSet(el) { findP(abPid)[abArt][el.dataset.a] = el.value; save(); }
function abnahmePdf(pid, art = 'abnahme') {
  if (!window.jspdf) return toast('PDF-Bibliothek nicht geladen (Internetverbindung?).');
  const p = findP(pid), T = AB_ARTEN[art];
  if (!p[art]) { p[art] = abnahmeDefaults(p, art); save(); }
  const a = p[art], E = abEintraege(a), { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14, B = W - 2 * M;
  let y = pdfAaKopf(doc, p.nummer, [['Datum', a.datum ? fmt(a.datum) : ''], ['Zeit', a.zeit ? a.zeit + ' Uhr' : '']], `${T.name}: ${a.titel || ''}`);
  y = pdfSpalten(doc, y, [['kunde', 'Kunde', a.kunde], ['objekt', 'Objekt', a.objekt], ['werkzeug', 'Projektleitung / Ersteller', a.ersteller]]);

  // 1. und 2. nebeneinander; ohne Angabe bleibt beim Gegenstand eine Linie zum Ausfüllen
  const cw = (B - 8) / 2;
  const liste = (x, titel, L, mitDetail) => {
    let yy = y;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT); doc.text(titel, x, yy);
    yy += 6.5;
    L.filter(i => i.text.trim()).forEach(i => {
      const det = (i.detail || '').trim();
      const t = i.text.trim() + (mitDetail ? (det ? `: ${det}` : i.hint ? ` (${i.hint})` : '') : '');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40);
      const lines = doc.splitTextToSize(t, cw - 6);
      pdfKaestchen(doc, x, yy - 2.7, i.ok);
      doc.text(lines, x + 5.5, yy);
      if (mitDetail && !det) {
        const ex = x + 5.5 + doc.getTextWidth(lines[lines.length - 1]) + 2, ly = yy + (lines.length - 1) * 4.3 + 0.8;
        if (x + cw - ex > 12) { doc.setDrawColor(170); doc.setLineWidth(0.2); doc.line(ex, ly, x + cw, ly); }
      }
      yy += lines.length * 4.3 + 1.7;
    });
    return yy;
  };
  y = Math.max(liste(M, T.gegenstand, a.gegenstand, true), liste(M + cw + 8, '2. Funktionsprüfung & Übergabe', a.pruefung, false)) + 6;

  // 3. Mängel: eingetragene oben, darunter leere Zeilen zum Ausfüllen von Hand. Mindestens so viele Zeilen wie gewünscht,
  // freier Platz wird aufgefüllt; passen nicht alle auf die Seite, läuft die Tabelle weiter (Kopfzeile wiederholt)
  const unten = 52, rowH = 8.5, kopfH = 7, boxFix = 34, wunsch = Math.max(3, Math.min(60, parseInt(a.maengelZeilen) || 5), E.length);
  let platzZeilen = Math.floor((H - 14 - unten - y - boxFix) / rowH);
  if (platzZeilen < 3) { doc.addPage(); y = 18; platzZeilen = Math.floor((H - 14 - unten - y - boxFix) / rowH); }
  const zeile = i => E[i] ? [String(i + 1), E[i].bereich || '', E[i].text || '', E[i].bis ? fmt(E[i].bis) : ''] : [String(i + 1), '', '', ''];
  const ankreuzen = (x, cy) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40);
    [[T.keine, false], ['Mängel festgestellt (siehe Tabelle)', E.length > 0]].forEach(([t, an]) => { pdfKaestchen(doc, x, cy - 2.7, an); doc.text(t, x + 5.5, cy); cy += 5.5; });
    return cy;
  };
  if (wunsch > platzZeilen) {
    // Folgeseite bis zur Abnahmeerklärung mit leeren Zeilen auffüllen
    const seite1 = Math.floor((H - 14 - (y + 7) - kopfH) / rowH), seite2 = Math.floor((H - 14 - unten - 18 - kopfH - 20) / rowH);
    const zeilen = wunsch - seite1 <= seite2 ? seite1 + seite2 : wunsch;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT); doc.text('3. Festgestellte Mängel & Pendenzen', M, y + 4);
    doc.autoTable({
      startY: y + 7, margin: { left: M, right: M, top: 18, bottom: 14 }, theme: 'grid',
      styles: { fontSize: 9, cellPadding: 1.5, lineColor: [130, 130, 130], lineWidth: 0.3, minCellHeight: rowH, textColor: 60, valign: 'middle' },
      headStyles: { fillColor: [240, 241, 243], textColor: AA_TXT, fontStyle: 'bold', minCellHeight: kopfH },
      head: [['Nr.', 'Bereich / Bauteil', 'Beschreibung des Mangels', 'Erledigt bis']],
      body: Array.from({ length: zeilen }, (_, i) => zeile(i)),
      columnStyles: { 0: { cellWidth: 12, halign: 'center' }, 1: { cellWidth: 50 }, 3: { cellWidth: 32 } }
    });
    y = doc.lastAutoTable.finalY + 6.5;
    if (y + 12 > H - 14) { doc.addPage(); y = 22; }
    y = ankreuzen(M, y) + 8;
    if (y + unten > H - 14) { doc.addPage(); y = 18; }
  } else {
    // alles passt auf die Seite: Tabelle im Kasten wie in der Vorlage
    const n = platzZeilen, boxH = boxFix + n * rowH;
    doc.setDrawColor(190); doc.setLineWidth(0.35); doc.roundedRect(M, y, B, boxH, 3, 3, 'S');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT); doc.text('3. Festgestellte Mängel & Pendenzen', M + 5, y + 7);
    const tx = M + 5, tw = B - 10, ty = y + 11, sp = [12, 48, tw - 12 - 48 - 30, 30];
    doc.setFillColor(240, 241, 243); doc.rect(tx, ty, tw, kopfH, 'F');
    doc.setFontSize(9);
    let cx = tx;
    ['Nr.', 'Bereich / Bauteil', 'Beschreibung des Mangels', 'Erledigt bis'].forEach((l, i) => { doc.text(l, cx + 2, ty + 4.8); cx += sp[i]; });
    doc.setDrawColor(130); doc.setLineWidth(0.3); doc.rect(tx, ty, tw, kopfH + n * rowH, 'S');
    for (let i = 0; i < n; i++) doc.line(tx, ty + kopfH + i * rowH, tx + tw, ty + kopfH + i * rowH);
    cx = tx; sp.slice(0, -1).forEach(w => { cx += w; doc.line(cx, ty, cx, ty + kopfH + n * rowH); });
    doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
    for (let i = 0; i < n; i++) {
      const ry = ty + kopfH + i * rowH, werte = zeile(i);
      doc.setFontSize(9); doc.text(werte[0], tx + 6, ry + 5.6, { align: 'center' });
      // eingetragene Mängel: eine Zeile, bei langem Text zwei kleinere
      let zx = tx + sp[0];
      werte.slice(1).forEach((t, k) => {
        const w = sp[k + 1] - 3;
        if (t) {
          doc.setTextColor(30); doc.setFontSize(8.8);
          let L = doc.splitTextToSize(t, w);
          if (L.length > 1) { doc.setFontSize(7.6); L = doc.splitTextToSize(t, w).slice(0, 2); doc.text(L, zx + 1.5, ry + 3.5, { lineHeightFactor: 1.05 }); }
          else doc.text(L[0], zx + 1.5, ry + 5.6);
        }
        zx += sp[k + 1];
      });
      doc.setTextColor(60);
    }
    ankreuzen(tx, ty + kopfH + n * rowH + 6.5);
    y += boxH + 8;
  }

  // 4. Abnahmeerklärung und Unterschriften, unten auf der Seite
  y = Math.max(y, H - 14 - unten);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...AA_TXT); doc.text(T.erklaerung, M, y + 4);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
  const el = pdfAbsatz(doc, a.erklaerung, B);
  doc.text(el, M, y + 10);
  const ly = y + 10 + el.length * 4.4 + 8;
  doc.text('Ort, Datum:', M, ly);
  doc.setDrawColor(120); doc.setLineWidth(0.3); doc.line(M + 21, ly + 0.6, M + 95, ly + 0.6);
  const sy = ly + 18, sw = 80;
  doc.line(M, sy, M + sw, sy); doc.line(W - M - sw, sy, W - M, sy);
  doc.setFontSize(9.5);
  doc.text('Unterschrift Kunde / Bauherr', M, sy + 5);
  doc.text(`Unterschrift ${/ckw/i.test(S().firma) ? 'CKW' : 'Firma'} / Projektleitung`, W - M - sw, sy + 5);
  doc.save(`${T.name}_${p.nummer}_${p.name}.pdf`.replace(/[\\/:*?"<>|\s]+/g, '_'));
  toast(`${T.name} als PDF gespeichert.`);
}
